  const total = ks.reduce((a, k) => a + ((real[k] || 0) - (prev[k] || 0)) * precoDe(k), 0);
  return `*CONCILIAÇÃO DE CONSUMO — ${br(d)}*\n${l.length} OS · previsto pelas cestas × baixa real do estoque\n\n`
    + (div.length ? div.map(x => `• ${(DB.itens[x.k] || DB.catalogo[x.k] || {}).desc || x.k}: ${x.df > 0 ? '+' : ''}${fmt(x.df)} (${fmtR(x.df * precoDe(x.k))})`).join('\n') : 'Sem divergência relevante.')
    + `\n\nImpacto total: ${total > 0 ? '+' : ''}${fmtR(total)}`;
}

/* ---------- cestas por tipo de OS ---------- */
function editarCestas(foco) {
  const tipos = tiposOS();
  if (!tipos.length) return toast('Importe as ocorrências primeiro para o sistema conhecer os tipos de serviço.', 'e');
  const t = foco || tipos[0];
  const itens = Object.values(DB.itens).sort((a, b) => a.desc.localeCompare(b.desc));
  modal('Cesta de material por tipo de OS', `
    <p style="margin-top:0;font-size:13px;color:var(--txt-2)">Quanto de material um serviço desse tipo costuma consumir. É a base do consumo previsto e da previsão de compra.</p>
    <div class="row" style="margin-bottom:12px">
      ${tipos.map(x => `<span class="chip ${x === t ? 'on' : ''}" onclick="editarCestas('${esc(x).replace(/'/g, "\\'")}')">${esc(x)} <b class="mono">${(DB.cestas[x] || []).length}</b></span>`).join('')}
    </div>
    <div class="row" style="margin-bottom:12px">
      <select id="cesItem" style="flex:1">${itens.map(i => `<option value="${i.k}">${esc(i.desc)}${precoDe(i.k) ? ' — ' + fmtR(precoDe(i.k)) : ''}</option>`).join('')}</select>
      <input type="number" id="cesQtd" value="1" min="0" step="0.01" style="width:90px">
      <button class="btn a" onclick="addCesta('${esc(t).replace(/'/g, "\\'")}')">Adicionar</button></div>
    <div id="cesLista">${listaCesta(t)}</div>
    ${sugestaoCesta(t)}`, '', 760);
}
function listaCesta(t) {
  const c = DB.cestas[t] || [];
  if (!c.length) return '<div class="empty" style="padding:22px"><p>Cesta vazia para este tipo de serviço.</p></div>';
  const total = custoCesta(t);
  return `<div class="tw" style="max-height:300px"><table><thead><tr><th class="nos">Material</th>
    <th class="nos" style="text-align:right">Qtd</th><th class="nos" style="text-align:right">Custo</th><th class="nos"></th></tr></thead>
    <tbody>${c.map((x, i) => `<tr><td>${esc((DB.itens[x.k] || {}).desc || x.k)}</td>
      <td class="num"><input type="number" value="${x.qtd}" min="0" step="0.01" style="width:80px;text-align:right;padding:3px 6px"
        onchange="DB.cestas['${esc(t).replace(/'/g, "\\'")}'][${i}].qtd=+this.value||0;save();$('#cesLista').innerHTML=listaCesta('${esc(t).replace(/'/g, "\\'")}')"></td>
      <td class="num">${precoDe(x.k) ? fmtR(x.qtd * precoDe(x.k)) : '—'}</td>
      <td style="text-align:right"><button class="btn xs dg" onclick="DB.cestas['${esc(t).replace(/'/g, "\\'")}'].splice(${i},1);save();$('#cesLista').innerHTML=listaCesta('${esc(t).replace(/'/g, "\\'")}')">remover</button></td></tr>`).join('')}
    <tr style="background:var(--ink-2)"><td><b>Custo da cesta</b></td><td></td><td class="num"><b>${fmtR(total)}</b></td><td></td></tr>
    </tbody></table></div>`;
}
function addCesta(t) {
  const k = $('#cesItem').value, q = +$('#cesQtd').value || 0;
  DB.cestas[t] = DB.cestas[t] || [];
  const ex = DB.cestas[t].find(x => x.k === k);
  if (ex) ex.qtd = q; else DB.cestas[t].push({ k, qtd: q });
  save(); $('#cesLista').innerHTML = listaCesta(t);
}
/* aprende a cesta: consumo real de um dia dividido pelas OS daquele tipo */
function sugestaoCesta(t) {
  const dias = [...new Set(DB.os.map(x => x.data))].sort().reverse();
  const bom = dias.find(d => { const l = osDe(d); return l.length && l.every(o => o.tipo === t) && consumoEntre(d, d) !== null; });
  if (!bom) return `<p style="margin:14px 0 0;font-size:12.5px;color:var(--txt-2)">
    Dica: num dia em que só houver serviço deste tipo, o sistema consegue calcular a cesta sozinho a partir do consumo real.</p>`;
  return `<div class="row" style="margin-top:14px"><button class="btn" onclick="aprenderCesta('${esc(t).replace(/'/g, "\\'")}','${bom}')">
    Calcular pela operação de ${br(bom)}</button></div>`;
}
function aprenderCesta(t, d) {
  const l = osDe(d), c = consumoEntre(d, d);
  if (!c || !l.length) return toast('Sem dados suficientes.', 'e');
  DB.cestas[t] = Object.entries(c.itens).map(([k, q]) => ({ k, qtd: Math.round(q / l.length * 100) / 100 })).filter(x => x.qtd > 0);
  save(); editarCestas(t); toast(`Cesta calculada com ${l.length} OS de ${br(d)}.`);
}
Object.assign(VFN, { hoje: vHoje, estoque: vEstoque, cargas: vCargas, ferramental: vFerramental,
  equip: vEquip, os: vOS, pedido: vPedido, firmware: vFirmware, relatorio: vRelatorio, ajustes: vAjustes });

/* ---------- inicio: roda depois de todos os modulos carregarem ---------- */
render();
if (!Store.ok) setTimeout(() => toast('Este navegador bloqueou o armazenamento — os dados somem ao fechar. Baixe o arquivo e abra direto do seu computador.', 'w'), 900);
</script>

<script>
/* =====================================================================
   CAMADA 3 — o relatório no formato real, a rotina real e o fluxo
   físico dos equipamentos que voltam de troca e retirada.
   ===================================================================== */
if (!DB.tarefas) DB.tarefas = null;
if (!DB.cfg.destino) DB.cfg.destino = 'MATERIAIS DE RETIRADA E SUBSTITUIÇÃO';

/* etapas físicas do equipamento que retorna */
const ETAPAS = ['RECEBIDO', 'CADASTRADO', 'VINCULADO', 'HIGIENIZADO', 'ENCAIXOTADO', 'ENVIADO'];
const ETAPA_COR = { RECEBIDO: 't-n', CADASTRADO: 't-i', VINCULADO: 't-a', HIGIENIZADO: 't-a', ENCAIXOTADO: 't-w', ENVIADO: 't-ok' };
function etapaDe(e) {
  if (e.etapa) return e.etapa;
  return e.hubsoft ? (e.cliente ? 'VINCULADO' : 'CADASTRADO') : 'RECEBIDO';
}
function avancarEtapa(id, delta) {
  const e = DB.equip.find(x => x.id === id); if (!e) return;
  const i = Math.max(0, Math.min(ETAPAS.length - 1, ETAPAS.indexOf(etapaDe(e)) + (delta || 1)));
  e.etapa = ETAPAS[i];
  e.hubsoft = i >= 1;
  save(); repaintEquip();
}
function porEtapa(data) {
  const l = data ? DB.equip.filter(e => e.data === data) : DB.equip;
  const c = {}; ETAPAS.forEach(x => c[x] = 0);
  l.forEach(e => c[etapaDe(e)]++);
  return c;
}
function equipEmAberto() { return DB.equip.filter(e => etapaDe(e) !== 'ENVIADO'); }

/* ---------- catálogo de atividades: a rotina como ela é ---------- */
function tarefasPadrao() {
  return [
    { id: 'recolher', t: 'RECOLHER CARGA DOS 12X36', auto: 'carga' },
    { id: 'ferr', t: 'CONFERÊNCIA DE FERRAMENTAL', auto: 'ferr' },
    { id: 'confcarga', t: 'CONFERÊNCIA DE CARGA DOS TÉCNICOS', auto: 'confcarga' },
    { id: 'acomodar', t: 'ACOMODAÇÃO DOS EQUIPAMENTOS RECEBIDOS NO PEDIDO SEMANAL' },
    { id: 'fichas', t: 'ORGANIZAÇÃO DAS FICHAS DE SAÍDA DE MATERIAL' },
    { id: 'planilha', t: 'PREENCHER PLANILHA DE TROCAS E RETIRADA DO MÊS' },
    { id: 'cadastro', t: 'CRIAR CADASTRO DOS EQUIPAMENTOS RECOLHIDOS DE TROCA E RETIRADA', auto: 'cadastro' },
    { id: 'vincular', t: 'VINCULAR EQUIPAMENTOS DE TROCA E RETIRADA AO CLIENTE DE ORIGEM', auto: 'vincular' },
    { id: 'enviar', t: 'RETIRADA DE EQUIPAMENTOS EM CLIENTES E ENVIO AO SETOR DE DESTINO', auto: 'enviar' },
    { id: 'higienizar', t: 'ENCAIXOTAR E HIGIENIZAR EQUIPAMENTOS DE TROCA E SUBSTITUIÇÃO', auto: 'higienizar' },
    { id: 'estoque', t: 'CONFERÊNCIA DA POSIÇÃO DO ESTOQUE CENTRAL', auto: 'estoque' },
    { id: 'pedido', t: 'ELABORAÇÃO E ENVIO DO PEDIDO SEMANAL DE MATERIAIS', auto: 'pedido' },
    { id: 'firmware', t: 'ATUALIZAÇÃO DE FIRMWARE DOS EQUIPAMENTOS', auto: 'firmware' },
    { id: 'organizar', t: 'ORGANIZAÇÃO DO ALMOXARIFADO' },
    { id: 'separar', t: 'SEPARAÇÃO DE MATERIAL PARA AS EQUIPES' }
  ];
}
function tarefas() { if (!DB.tarefas) { DB.tarefas = tarefasPadrao(); save(); } return DB.tarefas; }
function feitasDe(d) { return ((DB.diario[d] || {}).feitas) || []; }
function tglTarefa(id) {
  const d = $('#relData') ? $('#relData').value : hoje();
  DB.diario[d] = DB.diario[d] || {};
  const f = new Set(feitasDe(d));
  f.has(id) ? f.delete(id) : f.add(id);
  DB.diario[d].feitas = [...f];
  marcarRotina('rel', d); save(); render();
}

/* ---------- evidência automática: o que o sistema já sabe que foi feito ---------- */
function evidencia(id, d) {
  const tecs = DB.tecnicos.filter(t => t.ativo !== false);
  const fc = DB.ferr.checks[d] || {};
  switch (id) {
    case 'carga': {
      const t = Object.values(DB.cargas).filter(c => c.data === d).map(c => c.tec);
      return t.length ? { ok: 1, txt: `(TEC. ${t.join(' E ')})` } : null;
    }
    case 'ferr': {
      const conf = tecs.filter(t => fc[t.nome] && Object.keys(fc[t.nome]).length);
      if (!conf.length) return null;
      return { ok: 1, linhas: conf.map(t => {
        const falta = DB.ferr.lista.filter(f => !fc[t.nome][f]);
        return `CONFERÊNCIA DE FERRAMENTAL TEC. ${t.nome} (${falta.length ? 'FALTA: ' + falta.join(', ').toUpperCase() : 'TODO FERRAMENTAL OK'})`;
      }) };
    }
    case 'confcarga': {
      const c = DB.confCarga.filter(x => x.data === d);
      if (!c.length) return null;
      const div = c.filter(x => x.faltas > 0);
      return { ok: 1, txt: div.length ? `(DIVERGÊNCIA: ${div.map(x => x.tec).join(', ')})` : `(${c.map(x => x.tec).join(' E ')} - SEM DIVERGÊNCIA)` };
    }
    case 'cadastro': {
      const n = DB.equip.filter(e => e.data === d).length;
      return n ? { ok: 1, txt: `(${n} EQUIPAMENTO${n > 1 ? 'S' : ''})` } : null;
    }
    case 'vincular': {
      const n = DB.equip.filter(e => e.data === d && e.cliente).length;
      return n ? { ok: 1, txt: `(${n} VINCULADO${n > 1 ? 'S' : ''})` } : null;
    }
    case 'higienizar': {
      const n = DB.equip.filter(e => ['HIGIENIZADO', 'ENCAIXOTADO', 'ENVIADO'].includes(etapaDe(e)) && e.data === d).length;
      return n ? { ok: 1, txt: `(${n} EQUIPAMENTO${n > 1 ? 'S' : ''})` } : null;
    }
    case 'enviar': {
      const n = DB.equip.filter(e => etapaDe(e) === 'ENVIADO' && e.data === d).length;
      return n ? { ok: 1, txt: `(${n} ENVIADO${n > 1 ? 'S' : ''} A ${DB.cfg.destino})` } : null;
    }
    case 'estoque': return snapsCentral().some(s => s.data === d) ? { ok: 1, txt: '' } : null;
    case 'pedido': {
      const p = DB.pedidos.filter(x => x.data === d);
      return p.length ? { ok: 1, txt: `(${p[0].itens.length} ITENS)` } : null;
    }
    case 'firmware': {
      const f = DB.firm.log.filter(x => x.data === d);
      return f.length ? { ok: 1, txt: `(${f.reduce((a, b) => a + b.qtd, 0)} EQUIPAMENTOS)` } : null;
    }
  }
  return null;
}

/* ---------- o relatório, no seu formato ---------- */
function linhasRelatorio(d) {
  const feitas = new Set(feitasDe(d)), out = [];
  tarefas().forEach(t => {
    const ev = t.auto ? evidencia(t.auto, d) : null;
    if (ev && ev.linhas) { ev.linhas.forEach(l => out.push(l)); return; }
    if (ev) { out.push((t.t + ' ' + (ev.txt || '')).trim()); return; }
    if (feitas.has(t.id)) out.push(t.t);
  });
  const extra = ((DB.diario[d] || {}).notas || '').split('\n').map(x => x.trim()).filter(Boolean);
  extra.forEach(x => out.push(x.toUpperCase()));
  return out;
}
function montarRelatorio(d) {
  const data = d || hoje();
  if (DB.cfg.relFormato === 'gestao') return relatorioGestao(data);
  const l = linhasRelatorio(data);
  return `RELATÓRIO DIÁRIO - ${br(data)} ${(DB.cfg.responsavel || '').toUpperCase()}`.trim()
    + '\n' + (l.length ? l.join('\n') : 'SEM ATIVIDADES REGISTRADAS');
}
/* versão com números — para reunião, não para o dia a dia */
function relatorioGestao(data) {
  const L = [], est = listaEstoque(), crit = est.filter(x => x.st === 'crit');
  const leg = todosLegados(), aberto = equipEmAberto();
  L.push(`RELATÓRIO DIÁRIO — ${br(data)}`);
  L.push(`${DB.cfg.unidade || ''}${DB.cfg.responsavel ? ' · ' + DB.cfg.responsavel : ''}`);
  L.push('');
  L.push('ATIVIDADES');
  linhasRelatorio(data).forEach(x => L.push('• ' + x));
  L.push('');
  L.push('INDICADORES');
  if (temCatalogo()) {
    L.push(`• Capital sob controle: ${fmtR(valorTotal())} (${fmtR(valorCentral())} no almoxarifado, ${fmtR(valorCampo())} em campo)`);
    const r = abcResumo();
    if (r) L.push(`• Classe A: ${r.A.n} itens concentram ${Math.round(r.A.v / r.tot * 100)}% do capital`);
  }
  L.push(`• Itens em ruptura: ${crit.length}`);
  if (aberto.length) L.push(`• Equipamentos em processamento: ${aberto.length} (${ETAPAS.map(e => { const n = aberto.filter(x => etapaDe(x) === e).length; return n ? `${n} ${e.toLowerCase()}` : ''; }).filter(Boolean).join(', ')})`);
  if (leg.length) { const vl = leg.reduce((a, x) => a + precoDe(x.k), 0);
    L.push(`• Patrimônios inativos parados em carga: ${leg.length}${vl > 0 ? ` (${fmtR(vl)})` : ' (fora do catálogo, sem valor de referência)'}`); }
  const os = DB.os.filter(o => o.data === data).length;
  if (os) L.push(`• Ocorrências atendidas: ${os}`);
  return L.join('\n');
}
function salvarNotas() {
  const data = $('#relData').value || hoje();
  DB.diario[data] = DB.diario[data] || {};
  DB.diario[data].notas = $('#relNotas').value;
  marcarRotina('rel', data); save(); render(); toast('Relatório atualizado.');
}
function copiarRelatorio() {
  const d = ($('#relData') && $('#relData').value) || hoje();
  marcarRotina('rel', d); save();
  copiar(montarRelatorio(d), 'Relatório copiado.');
}
function trocarFormato(v) { DB.cfg.relFormato = v; save(); render(); }

function vRelatorio() {
  const data = ($('#relData') && $('#relData').value) || hoje();
  const txt = montarRelatorio(data), feitas = new Set(feitasDe(data));
  const ts = tarefas();
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) 360px;gap:16px">
    <div>
      <div class="card"><div class="hd"><h3>Relatório</h3>
        <input type="date" id="relData" value="${data}" style="width:148px" onchange="render()">
        <div class="sp"></div>
        <div class="row" style="gap:5px">
          <span class="chip ${DB.cfg.relFormato !== 'gestao' ? 'on' : ''}" onclick="trocarFormato('texto')">Seu formato</span>
          <span class="chip ${DB.cfg.relFormato === 'gestao' ? 'on' : ''}" onclick="trocarFormato('gestao')">Com indicadores</span></div>
        <button class="btn sm" onclick="copiarRelatorio()">Copiar</button>
        <button class="btn sm" onclick="baixar('relatorio_'+$('#relData').value+'.txt',montarRelatorio($('#relData').value))">Baixar</button></div>
        <div class="bd"><div class="pre" style="max-height:none;font-size:13px;line-height:1.6">${esc(txt)}</div></div></div>

      <div class="card" style="margin-top:16px"><div class="hd"><h3>Atividades do dia</h3>
        <span class="tag t-a">${linhasRelatorio(data).length} linhas no relatório</span><div class="sp"></div>
        <button class="btn sm" onclick="editarTarefas()">Editar lista</button></div>
        <div class="bd" style="padding:0">
          ${ts.map(t => {
            const ev = t.auto ? evidencia(t.auto, data) : null;
            const on = !!ev || feitas.has(t.id);
            return `<div class="step ${on ? 'done' : ''}" style="padding:8px 12px">
              <div class="bx ${on ? 'on' : ''}" ${ev ? 'title="marcado pelo sistema"' : `onclick="tglTarefa('${t.id}')" role="checkbox" aria-checked="${on}" tabindex="0" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();tglTarefa('${t.id}')}"`}
                style="${ev ? 'background:var(--acc);border-color:var(--acc);color:#fff;cursor:default' : ''}">✓</div>
              <div class="tx"><b style="font-size:12.5px;font-weight:${on ? 600 : 400}">${esc(t.t)}</b>
                ${ev ? `<span style="color:var(--acc-d)">registrado automaticamente${ev.txt ? ' ' + esc(ev.txt) : ''}</span>` : ''}</div>
            </div>`;
          }).join('')}
        </div></div>
    </div>
    <div>
      <div class="card"><div class="hd"><h3>Outras atividades</h3></div><div class="bd">
        <p style="margin:0 0 8px;font-size:12.5px;color:var(--txt-2)">Uma por linha. Entram no relatório exatamente como escritas.</p>
        <textarea id="relNotas" style="min-height:130px" placeholder="Apoio ao setor de recepção&#10;Separação de material para expansão">${esc((DB.diario[data] || {}).notas || '')}</textarea>
        <button class="btn a" style="margin-top:8px;width:100%" onclick="salvarNotas()">Salvar no relatório</button></div></div>

      <div class="card" style="margin-top:14px"><div class="hd"><h3>Equipamentos em processamento</h3></div>
        <div class="bd" style="padding:12px 16px">
          ${(() => { const c = porEtapa(), tot = equipEmAberto().length;
            return tot ? ETAPAS.map(e => c[e] ? `<div class="row" style="padding:3px 0;gap:8px">
              <span class="tag ${ETAPA_COR[e]}" style="width:104px;justify-content:center">${e}</span>
              <div class="bar" style="flex:1"><i style="width:${c[e] / DB.equip.length * 100}%"></i></div>
              <b class="mono" style="width:26px;text-align:right">${c[e]}</b></div>` : '').join('')
            + `<div style="font-size:12px;color:var(--txt-2);margin-top:8px">${tot} equipamento(s) ainda não enviados ao setor de destino.</div>`
            : '<div style="font-size:12.5px;color:var(--txt-2)">Nenhum equipamento em processamento.</div>'; })()}
          <button class="btn sm" style="margin-top:10px;width:100%" onclick="ir('equip')">Abrir troca e retirada</button>
        </div></div>

      <div class="card" style="margin-top:14px"><div class="hd"><h3>Últimos dias</h3></div><div class="bd tight">
        ${ultimosDias().map(d => `<div class="row" style="padding:8px 16px;border-bottom:1px solid var(--line-2);cursor:pointer" onclick="$('#relData').value='${d.data}';render()">
          <b style="font-size:13px">${br(d.data)}</b><div class="sp" style="flex:1"></div>
          <span class="tag t-n">${linhasRelatorio(d.data).length} atividades</span></div>`).join('') || '<div class="empty" style="padding:20px"><p>Sem histórico ainda.</p></div>'}
      </div></div>
    </div></div>`;
}
function editarTarefas() {
  modal('Atividades da rotina', `
    <p style="margin-top:0;font-size:12.5px;color:var(--txt-2)">Escreva do jeito que você reporta. As marcadas com <span class="tag t-a">auto</span> o sistema preenche sozinho a partir do que foi registrado no dia.</p>
    <div class="row" style="margin-bottom:12px"><input id="tnova" placeholder="Nova atividade" style="flex:1"
      oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')addTarefa()">
      <button class="btn a" onclick="addTarefa()">Adicionar</button></div>
    <div id="tLista">${listaTarefas()}</div>`,
    `<button class="btn" onclick="DB.tarefas=tarefasPadrao();save();$('#tLista').innerHTML=listaTarefas()">Restaurar padrão</button>`, 700);
}
function listaTarefas() {
  return `<div style="border:1px solid var(--line);border-radius:var(--r)">${tarefas().map((t, i) => `
    <div class="row" style="padding:7px 12px;border-bottom:1px solid var(--line-2)">
      <span style="flex:1;font-size:12.5px">${esc(t.t)}</span>
      ${t.auto ? '<span class="tag t-a">auto</span>' : ''}
      <button class="btn xs dg" onclick="DB.tarefas.splice(${i},1);save();$('#tLista').innerHTML=listaTarefas()">remover</button></div>`).join('')}</div>`;
}
function addTarefa() {
  const v = $('#tnova').value.trim().toUpperCase(); if (!v) return;
  tarefas().push({ id: uid(), t: v }); save();
  $('#tnova').value = ''; $('#tLista').innerHTML = listaTarefas(); $('#tnova').focus();
}

/* ---------- esteira dos equipamentos na tela de troca e retirada ---------- */
function tabelaEquip() {
  const q = fEq.toLowerCase();
  const l = DB.equip.filter(e => !q || JSON.stringify(e).toLowerCase().includes(q)).slice().reverse();
  if (!l.length) return `<div class="empty"><h4>Nenhum equipamento registrado</h4>
    <p>Cadastre aqui o que volta de troca e retirada. O sistema valida MAC, avisa duplicidade, acompanha a esteira até o envio e monta a linha da planilha.</p>
    <button class="btn a" onclick="novoEquip()">Novo cadastro</button></div>`;
  return `<div class="tw"><table><thead><tr>
    <th class="nos">Data</th><th class="nos">OS / Cliente</th><th class="nos">Equipamento</th><th class="nos">Serial</th>
    <th class="nos">MAC</th><th class="nos">Origem</th><th class="nos">Etapa</th><th class="nos"></th></tr></thead>
    <tbody>${l.map(e => { const et = etapaDe(e), i = ETAPAS.indexOf(et);
      return `<tr>
      <td class="mono" style="font-size:12px">${br(e.data)}</td>
      <td><b>${esc(e.os || '—')}</b>${e.cliente ? `<div style="font-size:11.5px;color:var(--txt-2)">${esc(e.cliente)}</div>`
        : '<div style="font-size:11.5px;color:var(--crit)">sem cliente de origem</div>'}</td>
      <td>${esc(e.marca || '')} ${esc(e.modelo || '')}<div style="font-size:11.5px;color:var(--txt-2)">${esc(e.tipo || '')}</div></td>
      <td class="mono" style="font-size:12px">${esc(e.serial || '—')}</td>
      <td class="mono" style="font-size:12px;${e.mac && !macOk(e.mac) ? 'color:var(--crit)' : ''}">${esc(e.mac || '—')}</td>
      <td><span class="tag t-i">${esc((e.tag || '').replace('RETORNO ', ''))}</span></td>
      <td style="white-space:nowrap">
        <button class="btn xs" onclick="avancarEtapa('${e.id}',-1)" ${i === 0 ? 'disabled' : ''} title="voltar etapa">‹</button>
        <span class="tag ${ETAPA_COR[et]}" style="min-width:88px;justify-content:center">${et}</span>
        <button class="btn xs" onclick="avancarEtapa('${e.id}',1)" ${i === ETAPAS.length - 1 ? 'disabled' : ''} title="avançar etapa">›</button></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn xs" onclick="novoEquip('${e.id}')">editar</button>
        <button class="btn xs dg" onclick="delEquip('${e.id}')">excluir</button></td></tr>`;
    }).join('')}</tbody></table></div>`;
}
Object.assign(VFN, { relatorio: vRelatorio });
render();
</script>

<script>
/* =====================================================================
   CAMADA 4 — pedidos dos técnicos pelo celular
   O técnico pede pelo aplicativo, o pedido cai aqui, você separa e entrega.
   A confirmação no celular substitui a ficha de saída assinada em papel.
   ===================================================================== */
if (!DB.reqs) DB.reqs = [];
if (!DB.saidas) DB.saidas = [];
if (!DB.cfg.ponteUrl) DB.cfg.ponteUrl = '';

const ST_REQ = ['PENDENTE', 'SEPARANDO', 'PRONTO', 'ENTREGUE', 'CONFIRMADO'];
const ST_COR = { PENDENTE: 't-w', SEPARANDO: 't-i', PRONTO: 't-a', ENTREGUE: 't-w', CONFIRMADO: 't-ok', 'NA FILA': 't-n' };
const ST_TXT = { PENDENTE: 'aguardando separação', SEPARANDO: 'em separação', PRONTO: 'pronto para retirar',
  ENTREGUE: 'entregue, aguardando confirmação', CONFIRMADO: 'confirmado pelo técnico' };
let sincronizando = false, ultimaSync = null;

async function pontePost(acao, corpo) {
  if (!DB.cfg.ponteUrl) throw new Error('Configure o endereço da ponte primeiro.');
  const r = await fetch(DB.cfg.ponteUrl, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ acao }, corpo)), redirect: 'follow'
  });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('Resposta inesperada. Confira se a implantação está como "Qualquer pessoa".'); }
  if (!j.ok) throw new Error(j.erro || 'Falha no servidor.');
  return j;
}
async function ponteGet(params) {
  if (!DB.cfg.ponteUrl) throw new Error('Configure o endereço da ponte primeiro.');
  const q = new URLSearchParams(params).toString();
  const r = await fetch(DB.cfg.ponteUrl + (DB.cfg.ponteUrl.includes('?') ? '&' : '?') + q, { redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Falha no servidor.');
  return j;
}

/* publica para o celular apenas o que circula nesta filial */
function pacoteCatalogo() {
  /* o tecnico pede consumivel e equipamento; ferramenta, EPI e patrimonio de infra nao entram */
  const FORA = /FERRAMENTA|EPI|VEICULO|ESCRITORIO|HIGIENE|COZINHA|DATACENTER|INFORM|CAMERA/i;
  const itens = Object.values(DB.itens)
    .filter(i => !i.legado && !duravel(i) && !FORA.test(i.cat || '') && !FORA.test(fichaCat(i.k) || ''))
    .map(i => ({ k: i.k, desc: i.desc, un: i.un || 'UN', cat: (fichaCat(i.k) || i.cat || 'Diversos') }))
    .sort((a, b) => a.desc.localeCompare(b.desc));
  const tecnicos = DB.tecnicos.filter(t => t.ativo !== false).map(t => t.nome).sort();
  return { itens, tecnicos };
}
function fichaCat(k) { const c = DB.catalogo && DB.catalogo[k]; return c && c.categoria && c.categoria !== 'N/A' ? c.categoria : null; }

async function publicarCatalogo() {
  const p = pacoteCatalogo();
  if (!p.itens.length) return toast('Importe o estoque antes de publicar a lista.', 'e');
  try {
    const j = await pontePost('publicar', p);
    toast(`Lista publicada: ${j.itens} materiais e ${j.tecnicos} técnicos disponíveis no aplicativo.`);
    DB.cfg.publicadoEm = new Date().toISOString(); save(); render();
  } catch (e) { toast(e.message, 'e'); }
}
async function sincronizarReqs(silencioso) {
  if (sincronizando || !DB.cfg.ponteUrl) return;
  sincronizando = true;
  try {
    const j = await ponteGet({ acao: 'pedidos' });
    const vindos = j.pedidos || [];
    const antes = DB.reqs.filter(r => r.status === 'PENDENTE').length;
    /* o servidor manda a verdade; o que já foi separado localmente mantém os itens conferidos */
    DB.reqs = vindos.map(v => {
      const local = DB.reqs.find(x => x.id === v.id);
      return Object.assign({}, v, { conf: (local && local.conf) || {} });
    }).sort((a, b) => String(b.criado_em).localeCompare(String(a.criado_em)));
    ultimaSync = new Date();
    save();
    const novos = DB.reqs.filter(r => r.status === 'PENDENTE').length - antes;
    if (!silencioso) toast(`${DB.reqs.length} pedidos sincronizados.`);
    else if (novos > 0) toast(`${novos} pedido(s) novo(s) de material.`);
    render();
  } catch (e) { if (!silencioso) toast(e.message, 'e'); }
  finally { sincronizando = false; }
}
async function mudarStatusReq(id, status) {
  const r = DB.reqs.find(x => x.id === id); if (!r) return;
  const anterior = r.status;
  r.status = status; save(); render();
  try {
    await pontePost('status', { id, status, separado_por: DB.cfg.responsavel || '', itens: r.itens });
    if (status === 'ENTREGUE') registrarSaida(r);
    toast(`Pedido ${id}: ${ST_TXT[status] || status}.`);
  } catch (e) { r.status = anterior; save(); render(); toast(e.message, 'e'); }
}
/* a entrega vira ficha de saída digital */
function registrarSaida(r) {
  if (DB.saidas.some(s => s.req === r.id)) return;
  DB.saidas.push({ id: uid(), req: r.id, data: hoje(), hora: new Date().toTimeString().slice(0, 5),
    tec: r.tecnico, itens: r.itens, por: DB.cfg.responsavel || '' });
  marcarRotina('equip'); save();
}
function fichaSaida(id) {
  const r = DB.reqs.find(x => x.id === id) || DB.saidas.find(x => x.req === id); if (!r) return '';
  const itens = r.itens || [];
  const val = itens.reduce((a, i) => a + i.qtd * precoDe(i.k), 0);
  return `FICHA DE SAÍDA DE MATERIAL Nº ${r.id}\n`
    + `${DB.cfg.unidade || ''}\n`
    + `Data: ${br(hoje())}   Técnico: ${r.tecnico}\n`
    + `Separado por: ${DB.cfg.responsavel || ''}\n`
    + `----------------------------------------------\n`
    + itens.map(i => `${String(fmt(i.qtd)).padStart(6)} ${(i.un || 'UN').padEnd(4)} ${i.desc}`).join('\n')
    + `\n----------------------------------------------\n`
    + `${itens.length} itens${temCatalogo() && val ? `   Valor: ${fmtR(val)}` : ''}\n`
    + (r.confirmado_em ? `RECEBIMENTO CONFIRMADO PELO TÉCNICO EM ${br(r.confirmado_em.slice(0, 10))} ÀS ${String(r.confirmado_em).slice(11, 16)}`
      : `Aguardando confirmação de recebimento no aplicativo.`);
}
function tglConf(id, k) {
  const r = DB.reqs.find(x => x.id === id); if (!r) return;
  r.conf = r.conf || {}; r.conf[k] = !r.conf[k];
  save(); const el = $('#sep-' + id); if (el) el.outerHTML = blocoSeparacao(r); else render();
}
function ajustarItem(id, k, v) {
  const r = DB.reqs.find(x => x.id === id); if (!r) return;
  const i = r.itens.find(x => x.k === k); if (!i) return;
  i.atendido = Math.max(0, parseFloat(String(v).replace(',', '.')) || 0);
  save();
}

/* ---------- tela ---------- */
if (!VIEWS.find(v => v.id === 'reqs')) VIEWS.splice(5, 0, { id: 'reqs', n: 'Pedidos dos técnicos', grp: 'Rotina' });

function vReqs() {
  if (!DB.cfg.ponteUrl) return telaPonte();
  const pend = DB.reqs.filter(r => r.status === 'PENDENTE');
  const andamento = DB.reqs.filter(r => ['SEPARANDO', 'PRONTO'].includes(r.status));
  const fechados = DB.reqs.filter(r => ['ENTREGUE', 'CONFIRMADO'].includes(r.status));
  const semConf = DB.reqs.filter(r => r.status === 'ENTREGUE');
  return `
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('Aguardando separação', pend.length, pend.length ? 'pedidos novos no celular' : 'nada na fila', pend.length ? 'var(--f-vermelho)' : 'var(--ok)')}
    ${kpi('Em andamento', andamento.length, 'separando ou prontos', 'var(--f-azul)')}
    ${kpi('Sem confirmação', semConf.length, 'entregues, técnico não confirmou', semConf.length ? 'var(--f-amarelo)' : 'var(--ok)')}
    ${kpi('Fichas geradas', DB.saidas.length, 'saídas digitais no histórico', 'var(--f-verde)')}
  </div>
  <div class="card" style="margin-bottom:16px"><div class="hd">
    <h3>Ponte com o aplicativo</h3>
    <span class="tag t-ok">conectada</span>
    ${ultimaSync ? `<span class="tag t-n">sincronizado ${ultimaSync.toTimeString().slice(0, 5)}</span>` : ''}
    <div class="sp"></div>
    <button class="btn sm" onclick="telaPonteModal()">Configurar</button>
    <button class="btn sm" onclick="publicarCatalogo()">Publicar lista de materiais</button>
    <button class="btn sm a" onclick="sincronizarReqs()">Buscar pedidos</button></div>
    <div class="bd" style="padding:10px 16px;font-size:12.5px;color:var(--txt-2)">
      ${DB.cfg.publicadoEm ? `Lista publicada em ${br(DB.cfg.publicadoEm.slice(0, 10))} — ${pacoteCatalogo().itens.length} materiais e ${pacoteCatalogo().tecnicos.length} técnicos.`
      : 'Publique a lista de materiais para que os técnicos consigam pedir pelo celular.'}
      A busca automática roda a cada 2 minutos enquanto esta tela estiver aberta.
    </div></div>

  ${pend.length || andamento.length ? `
  <div class="card" style="margin-bottom:16px"><div class="hd"><h3>Para separar</h3>
    <span class="tag ${pend.length ? 't-c' : 't-n'}">${pend.length + andamento.length} pedidos</span></div>
    <div class="bd" style="padding:0">${[...pend, ...andamento].map(blocoSeparacao).join('')}</div></div>` : `
  <div class="card" style="margin-bottom:16px"><div class="bd"><div class="empty">
    <h4>Nenhum pedido na fila</h4><p>Quando um técnico pedir material pelo celular, ele aparece aqui.</p>
    <button class="btn a" onclick="sincronizarReqs()">Buscar agora</button></div></div></div>`}

  ${fechados.length ? `<div class="card"><div class="hd"><h3>Entregues</h3>
    <span class="tag t-n">${fechados.length}</span><div class="sp"></div>
    <button class="btn sm" onclick="exportarSaidas()">Exportar fichas em CSV</button></div>
    <div class="bd tight"><div class="tw" style="max-height:360px"><table>
      <thead><tr><th class="nos">Pedido</th><th class="nos">Técnico</th><th class="nos">Itens</th>
        ${temCatalogo() ? '<th class="nos" style="text-align:right">Valor</th>' : ''}
        <th class="nos">Confirmação</th><th class="nos"></th></tr></thead>
      <tbody>${fechados.map(r => `<tr>
        <td class="mono"><b>${esc(r.id)}</b><div style="font-size:11px;color:var(--txt-3)">${brData(r.criado_em)}</div></td>
        <td>${esc(r.tecnico)}</td>
        <td>${r.itens.length} itens · ${fmt(r.itens.reduce((a, i) => a + i.qtd, 0))} peças</td>
        ${temCatalogo() ? `<td class="num">${fmtR(r.itens.reduce((a, i) => a + i.qtd * precoDe(i.k), 0))}</td>` : ''}
        <td>${r.confirmado_em ? `<span class="tag t-ok">confirmado ${brData(r.confirmado_em)}</span>` : '<span class="tag t-w">aguardando</span>'}</td>
        <td style="text-align:right"><button class="btn xs" onclick="verFicha('${esc(r.id)}')">ficha</button></td></tr>`).join('')}
      </tbody></table></div></div></div>` : ''}`;
}
function brData(s) { return s ? br(String(s).slice(0, 10)) + ' ' + String(s).slice(11, 16) : ''; }

function blocoSeparacao(r) {
  const conf = r.conf || {};
  const prontos = r.itens.filter(i => conf[i.k]).length;
  const tudo = prontos === r.itens.length;
  return `<div id="sep-${esc(r.id)}" style="border-bottom:1px solid var(--line-2);padding:14px 16px">
    <div class="row" style="margin-bottom:10px">
      <div>
        <b style="font-family:var(--disp);font-size:15px">${esc(r.tecnico)}</b>
        <span class="tag ${ST_COR[r.status] || 't-n'}" style="margin-left:8px">${esc(ST_TXT[r.status] || r.status)}</span>
        <div style="font-size:11.5px;color:var(--txt-2);margin-top:2px" class="mono">${esc(r.id)} · ${brData(r.criado_em)}</div>
      </div>
      <div class="sp" style="flex:1"></div>
      <span class="tag ${tudo ? 't-ok' : 't-n'}">${prontos}/${r.itens.length} separados</span>
      ${temCatalogo() ? `<span class="tag t-a">${fmtR(r.itens.reduce((a, i) => a + i.qtd * precoDe(i.k), 0))}</span>` : ''}
    </div>
    ${r.obs ? `<div style="background:var(--warn-bg);border-radius:var(--r);padding:8px 10px;font-size:13px;margin-bottom:10px">
      <b>Observação:</b> ${esc(r.obs)}</div>` : ''}
    <table style="margin-bottom:10px"><thead><tr>
      <th class="nos" style="width:34px"></th><th class="nos">Material</th>
      <th class="nos" style="text-align:right">Pedido</th><th class="nos" style="text-align:right">Em estoque</th>
      <th class="nos" style="text-align:right">Separado</th></tr></thead>
      <tbody>${r.itens.map(i => {
        const it = DB.itens[i.k], saldo = it ? it.qtd : null;
        const falta = saldo != null && saldo < i.qtd;
        return `<tr>
          <td><span class="bx ${conf[i.k] ? 'on' : ''}" style="display:inline-flex" onclick="tglConf('${esc(r.id)}','${esc(i.k)}')"
            role="checkbox" aria-checked="${!!conf[i.k]}" tabindex="0" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();this.click()}">✓</span></td>
          <td>${esc(i.desc)}${falta ? ' <span class="tag t-c">saldo insuficiente</span>' : ''}</td>
          <td class="num"><b>${fmt(i.qtd)}</b> <span style="color:var(--txt-3);font-size:11px">${esc(i.un || '')}</span></td>
          <td class="num" style="color:${falta ? 'var(--crit)' : 'var(--txt-2)'}">${saldo == null ? '—' : fmt(saldo)}</td>
          <td class="num"><input type="number" min="0" value="${i.atendido != null ? i.atendido : i.qtd}" style="width:76px;text-align:right;padding:3px 6px"
            onchange="ajustarItem('${esc(r.id)}','${esc(i.k)}',this.value)"></td></tr>`;
      }).join('')}</tbody></table>
    <div class="row">
      ${r.status === 'PENDENTE' ? `<button class="btn sm a" onclick="mudarStatusReq('${esc(r.id)}','SEPARANDO')">Começar a separar</button>` : ''}
      ${r.status === 'SEPARANDO' ? `<button class="btn sm a" ${tudo ? '' : 'disabled title="marque todos os itens"'} onclick="mudarStatusReq('${esc(r.id)}','PRONTO')">Marcar como pronto</button>` : ''}
      ${r.status === 'PRONTO' ? `<button class="btn sm a" onclick="mudarStatusReq('${esc(r.id)}','ENTREGUE')">Entregar ao técnico</button>` : ''}
      <button class="btn sm" onclick="verFicha('${esc(r.id)}')">Ficha de saída</button>
      <div class="sp" style="flex:1"></div>
      <button class="btn sm" onclick="copiar(textoSeparacao('${esc(r.id)}'),'Lista copiada.')">Copiar lista</button>
    </div></div>`;
}
function textoSeparacao(id) {
  const r = DB.reqs.find(x => x.id === id); if (!r) return '';
  return `SEPARAR — ${r.tecnico} (${r.id})\n`
    + r.itens.map(i => `[ ] ${fmt(i.qtd)} ${i.un || ''} — ${i.desc}`).join('\n')
    + (r.obs ? `\n\nObs.: ${r.obs}` : '');
}
function verFicha(id) {
  const t = fichaSaida(id);
  modal('Ficha de saída de material', `<div class="pre" style="max-height:none">${esc(t)}</div>`,
    `<button class="btn" onclick="baixar('ficha_${id}.txt',${JSON.stringify(JSON.stringify(t))}&&fichaSaida('${esc(id)}'))">Baixar</button>
     <button class="btn a" onclick="copiar(fichaSaida('${esc(id)}'),'Ficha copiada.')">Copiar</button>`, 620);
}
function exportarSaidas() {
  if (!DB.saidas.length) return toast('Nenhuma ficha gerada ainda.', 'e');
  const linhas = [['Ficha', 'Data', 'Hora', 'Técnico', 'Material', 'Unidade', 'Quantidade', 'Valor', 'Separado por']];
  DB.saidas.forEach(s => s.itens.forEach(i => linhas.push([s.req, br(s.data), s.hora, s.tec, i.desc, i.un || '',
    i.qtd, temCatalogo() ? Math.round(i.qtd * precoDe(i.k) * 100) / 100 : '', s.por])));
  baixar(`fichas_saida_${hoje()}.csv`, csv(linhas), 'text/csv');
  toast('Fichas exportadas.');
}
function telaPonte() {
  return `<div class="card"><div class="bd"><div class="empty">
    <h4>Conecte o aplicativo dos técnicos</h4>
    <p>Com a ponte ligada, o técnico pede material pelo celular e o pedido cai aqui.<br>
       Você separa, entrega, e a confirmação dele no aplicativo substitui a ficha assinada.</p>
    <button class="btn a" onclick="telaPonteModal()">Configurar a ponte</button></div></div></div>`;
}
function telaPonteModal() {
  modal('Ponte com o aplicativo dos técnicos', `
    <div class="field"><label class="fl">Endereço da ponte (Apps Script)</label>
      <input id="pu" class="mono" value="${esc(DB.cfg.ponteUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <p style="font-size:13px;color:var(--txt-2)">Este é o mesmo endereço que você coloca no aplicativo do celular.
      Ele sai da implantação do Apps Script, no arquivo <span class="mono">Codigo.gs</span>.</p>
    <div style="background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13px;margin-top:12px">
      <b>Como o fluxo funciona</b>
      <div style="margin-top:6px;color:var(--txt-2);line-height:1.7">
        1. Você publica a lista de materiais que existem nesta filial.<br>
        2. O técnico abre o aplicativo, escolhe os itens e envia.<br>
        3. O pedido aparece aqui para separar, com o saldo de cada item ao lado.<br>
        4. Ao entregar, o sistema gera a ficha de saída digital.<br>
        5. O técnico confirma no celular — isso vale como assinatura.
      </div></div>`,
    `<button class="btn" onclick="testarPonte()">Testar conexão</button>
     <button class="btn a" onclick="salvarPonte()">Salvar</button>`, 640);
}
function salvarPonte() {
  const v = $('#pu').value.trim();
  if (v && !/^https:\/\/script\.google\.com\/.+\/exec/.test(v)) return toast('O endereço precisa terminar em /exec.', 'e');
  DB.cfg.ponteUrl = v; save(); fecharModal(); render();
  if (v) { toast('Ponte configurada.'); sincronizarReqs(true); }
}
async function testarPonte() {
  const v = $('#pu').value.trim(); if (!v) return toast('Cole o endereço primeiro.', 'e');
  const antes = DB.cfg.ponteUrl; DB.cfg.ponteUrl = v;
  try { await ponteGet({ acao: 'ping' }); toast('Conexão funcionando.'); }
  catch (e) { toast('Não respondeu: ' + e.message, 'e'); DB.cfg.ponteUrl = antes; }
}

/* aviso no painel do dia */
function badge(id) {
  if (id === 'reqs') { const n = DB.reqs.filter(r => r.status === 'PENDENTE').length; return n || ''; }
  if (id === 'estoque') { const n = listaEstoque().filter(x => x.st === 'crit').length; return n || ''; }
  if (id === 'cargas') { const n = DB.tecnicos.filter(t => t.ativo !== false && !(DB.confCarga.find(c => c.data === hoje() && c.tec === t.nome))).length; return n || ''; }
  if (id === 'ferramental') { const c = DB.ferr.checks[hoje()] || {}; const n = DB.tecnicos.filter(t => t.ativo !== false && !c[t.nome]).length; return DB.ferr.lista.length ? (n || '') : ''; }
  if (id === 'hoje') return pendencias().length || '';
  return '';
}
Object.assign(VFN, { reqs: vReqs });
setInterval(() => { if (VIEW === 'reqs' && DB.cfg.ponteUrl) sincronizarReqs(true); }, 120000);
if (DB.cfg.ponteUrl) sincronizarReqs(true);
render();
</script>

<script>
/* =====================================================================
   CAMADA 5 — o que faz o sistema sobreviver em operação
   1. Disciplina de backup: os dados moram neste navegador. Sem cópia, um
      perfil apagado leva tudo junto.
   2. Painel de resultados: os números acumulados que provam o trabalho.
   ===================================================================== */
if (!DB.cfg.ultimoBackup) DB.cfg.ultimoBackup = null;

function diasSemBackup() {
  if (!DB.cfg.ultimoBackup) return 999;
  return Math.floor((Date.now() - new Date(DB.cfg.ultimoBackup)) / 864e5);
}
function backup() {
  baixar(`almox_backup_${hoje()}.json`, JSON.stringify(DB, null, 1), 'application/json');
  DB.cfg.ultimoBackup = new Date().toISOString(); save();
  toast('Backup gerado. Guarde no Drive, não só no computador.');
  render();
}
function avisoBackup() {
  const d = diasSemBackup();
  if (d < 7) return '';
  const nunca = d > 900;
  return `<div class="card" style="margin-bottom:16px;border-left:3px solid var(--f-vermelho)">
    <div class="bd" style="padding:12px 16px"><div class="row">
      <div style="flex:1">
        <b style="color:var(--f-vermelho)">${nunca ? 'Você ainda não fez nenhum backup' : `Último backup há ${d} dias`}</b>
        <div style="font-size:12.5px;color:var(--txt-2);margin-top:2px">
          Tudo está gravado só neste navegador. Se o perfil for apagado, se a máquina for formatada
          ou se a TI limpar o cache, ${Object.keys(DB.itens).length} itens, ${DB.equip.length} equipamentos e todo o histórico somem sem recuperação.</div>
      </div>
      <button class="btn a" onclick="backup()">Baixar backup agora</button>
    </div></div></div>`;
}

/* ---------- números do período ---------- */
function periodo(ini, fim) {
  const de = ini || iso(new Date(Date.now() - 30 * 864e5)), ate = fim || hoje();
  const dentro = d => d && d >= de && d <= ate;
  const posicoes = snapsCentral().filter(s => dentro(s.data));
  const confs = DB.confCarga.filter(c => dentro(c.data));
  const divs = confs.filter(c => c.faltas > 0);
  const ferr = Object.keys(DB.ferr.checks).filter(dentro);
  const eq = DB.equip.filter(e => dentro(e.data));
  const enviados = eq.filter(e => etapaDe(e) === 'ENVIADO');
  const vinculados = eq.filter(e => e.cliente);
  const peds = DB.pedidos.filter(p => dentro(p.data));
  const reqs = (DB.reqs || []).filter(r => dentro(String(r.criado_em).slice(0, 10)));
  const atendidos = reqs.filter(r => ['ENTREGUE', 'CONFIRMADO'].includes(r.status));
  const confirmados = reqs.filter(r => r.status === 'CONFIRMADO');
  const saidas = (DB.saidas || []).filter(s => dentro(s.data));
  const firm = DB.firm.log.filter(f => dentro(f.data));
  const os = DB.os.filter(o => dentro(o.data));
  const rel = Object.keys(DB.diario).filter(dentro).length;

  /* tempo entre o pedido do técnico e a entrega */
  let somaMin = 0, nTempo = 0;
  atendidos.forEach(r => {
    if (!r.criado_em || !r.entregue_em) return;
    const m = (new Date(r.entregue_em) - new Date(r.criado_em)) / 6e4;
    if (m >= 0 && m < 60 * 24 * 7) { somaMin += m; nTempo++; }
  });
  const dias = Math.max(1, diasEntre(de, ate) + 1);
  return { de, ate, dias, posicoes, confs, divs, ferr, eq, enviados, vinculados, peds,
    reqs, atendidos, confirmados, saidas, firm, os, rel,
    tempoMedio: nTempo ? somaMin / nTempo : null, nTempo };
}
function textoResultados(de, ate) {
  const p = periodo(de, ate), L = [];
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  L.push(`RESULTADOS DO ALMOXARIFADO — ${br(p.de)} a ${br(p.ate)}`);
  L.push(`${DB.cfg.unidade || ''}${DB.cfg.responsavel ? ' · ' + DB.cfg.responsavel : ''}`);
  L.push('');
  L.push('CONTROLE DE PATRIMÔNIO');
  if (temCatalogo()) {
    L.push(`Capital sob controle: ${fmtR(valorTotal())}`);
    L.push(`  no almoxarifado: ${fmtR(valorCentral())}`);
    L.push(`  na carga dos técnicos: ${fmtR(valorCampo())} (${pct(valorCampo(), valorTotal())} do total)`);
    const r = abcResumo();
    if (r) L.push(`Curva ABC: ${r.A.n} itens concentram 80% do capital — contagem cíclica focada neles`);
  }
  L.push(`Posições de estoque conferidas: ${p.posicoes.length} em ${p.dias} dias`);
  const leg = todosLegados();
  if (leg.length) L.push(`Patrimônios inativos localizados em campo: ${leg.length} (identificados para recolhimento)`);
  L.push('');
  L.push('CONFERÊNCIAS');
  L.push(`Cargas de técnico conferidas: ${p.confs.length}`);
  L.push(`  com divergência encontrada: ${p.divs.length} (${pct(p.divs.length, p.confs.length)})`);
  L.push(`Dias com conferência de ferramental: ${p.ferr.length}`);
  L.push(`Relatórios diários emitidos: ${p.rel}`);
  L.push('');
  L.push('EQUIPAMENTOS DE TROCA E RETIRADA');
  L.push(`Cadastrados: ${p.eq.length}`);
  L.push(`  vinculados ao cliente de origem: ${p.vinculados.length} (${pct(p.vinculados.length, p.eq.length)})`);
  L.push(`  devolvidos ao setor de destino: ${p.enviados.length}`);
  if (p.firm.length) L.push(`Firmware atualizado: ${p.firm.reduce((a, b) => a + b.qtd, 0)} equipamentos`);
  if (p.reqs.length) {
    L.push('');
    L.push('ATENDIMENTO AOS TÉCNICOS');
    L.push(`Pedidos recebidos pelo aplicativo: ${p.reqs.length}`);
    L.push(`  atendidos: ${p.atendidos.length} (${pct(p.atendidos.length, p.reqs.length)})`);
    if (p.tempoMedio != null) L.push(`  tempo médio entre pedido e entrega: ${formatarMin(p.tempoMedio)}`);
    L.push(`Fichas de saída digitais emitidas: ${p.saidas.length} (substituindo a ficha em papel)`);
    L.push(`  com recebimento confirmado pelo técnico: ${p.confirmados.length}`);
  }
  if (p.peds.length) {
    L.push('');
    L.push('REPOSIÇÃO');
    L.push(`Pedidos semanais elaborados: ${p.peds.length}`);
    const it = p.peds.reduce((a, x) => a + x.itens.length, 0);
    L.push(`  itens solicitados: ${it}`);
    const crit = listaEstoque().filter(x => x.st === 'crit').length;
    L.push(`Itens em ruptura no fechamento: ${crit}`);
  }
  if (p.os.length) {
    const pa = padraoPorOS();
    L.push('');
    L.push('CUSTO OPERACIONAL');
    L.push(`Ocorrências acompanhadas: ${p.os.length}`);
    if (pa.custoOS) L.push(`Custo médio de material por atendimento: ${fmtR(pa.custoOS)}`);
  }
  return L.join('\n');
}
function formatarMin(m) {
  if (m < 60) return Math.round(m) + ' min';
  const h = Math.floor(m / 60), r = Math.round(m % 60);
  return h + 'h' + (r ? String(r).padStart(2, '0') : '');
}
function abrirResultados() {
  const de = iso(new Date(Date.now() - 30 * 864e5));
  modal('Resultados do período', `
    <div class="row" style="margin-bottom:14px">
      <div class="f"><label class="fl">De</label><input type="date" id="rde" value="${de}" onchange="atualizarResultados()"></div>
      <div class="f"><label class="fl">Até</label><input type="date" id="rate" value="${hoje()}" onchange="atualizarResultados()"></div>
      <div class="f" style="flex:0 0 auto;align-self:flex-end">
        <button class="btn sm" onclick="$('#rde').value='${iso(new Date(Date.now() - 7 * 864e5))}';atualizarResultados()">7 dias</button>
        <button class="btn sm" onclick="$('#rde').value='${de}';atualizarResultados()">30 dias</button>
        <button class="btn sm" onclick="$('#rde').value='${iso(new Date(Date.now() - 90 * 864e5))}';atualizarResultados()">90 dias</button></div>
    </div>
    <div id="resTxt" class="pre" style="max-height:none">${esc(textoResultados(de, hoje()))}</div>
    <p style="font-size:12.5px;color:var(--txt-2);margin:12px 0 0">
      Números vindos do que foi registrado, sem estimativa. Se um indicador estiver baixo, é porque o registro
      daquele item ainda não virou rotina — não invente o número, corrija a rotina.</p>`,
    `<button class="btn" onclick="baixar('resultados_'+$('#rde').value+'_a_'+$('#rate').value+'.txt',textoResultados($('#rde').value,$('#rate').value))">Baixar</button>
     <button class="btn a" onclick="copiar(textoResultados($('#rde').value,$('#rate').value),'Resultados copiados.')">Copiar</button>`, 760);
}
function atualizarResultados() {
  const el = $('#resTxt'); if (el) el.textContent = textoResultados($('#rde').value, $('#rate').value);
}

/* aviso de backup e atalho de resultados no painel do dia
   (nome novo: redeclarar vHoje aqui criaria recursão infinita) */
function vHojeOperacional() {
  return avisoBackup()
    + `<div class="row" style="margin-bottom:16px;gap:8px">
        <button class="btn a" onclick="abrirResultados()">Resultados do período</button>
        <button class="btn" onclick="backup()">Backup${DB.cfg.ultimoBackup ? ' · último há ' + diasSemBackup() + 'd' : ''}</button>
        <div class="sp" style="flex:1"></div>
        <span class="mono" style="font-size:11px;color:var(--txt-3)">${Object.keys(DB.itens).length} itens · ${snapsCentral().length} posições · ${DB.equip.length} equipamentos</span>
      </div>`
    + vHoje();
}
Object.assign(VFN, { hoje: vHojeOperacional });
render();
</script>

<script>
/* =====================================================================
   CAMADA 6 — envios para a matriz e etiquetas de caixa
   Código de barras Code 128B gerado aqui mesmo, sem depender de internet.
   ===================================================================== */
if (!DB.caixas) DB.caixas = [];
if (!DB.fontes) DB.fontes = [];
if (!DB.cfg.matriz) DB.cfg.matriz = 'MATRIZ — MATERIAIS DE RETIRADA E SUBSTITUIÇÃO';

/* ---------- Code 128B ----------
   107 padrões de larguras de barra/espaço. Cada símbolo soma 11 módulos;
   o de parada soma 13. Essa soma é conferida na carga do arquivo. */
const C128 = ('212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,' +
  '221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,' +
  '221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,' +
  '212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,' +
  '231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,' +
  '231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,' +
  '314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,' +
  '112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,' +
  '111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,' +
  '214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,' +
  '114131,311141,411131,211412,211214,211232,2331112').split(',');

function code128Valores(txt) {
  const t = String(txt || '').replace(/[^\x20-\x7E]/g, '');
  const vals = [104];                              // início B
  for (let i = 0; i < t.length; i++) vals.push(t.charCodeAt(i) - 32);
  let soma = 104;
  for (let i = 1; i < vals.length; i++) soma += vals[i] * i;
  vals.push(soma % 103);                           // dígito verificador
  vals.push(106);                                  // parada
  return vals;
}
/* devolve um SVG pronto; altura em milímetros */
function barras(txt, alturaMm, mostrarTexto) {
  const t = String(txt || '').trim();
  if (!t) return '';
  const vals = code128Valores(t);
  const larguras = [];
  vals.forEach(v => C128[v].split('').forEach(n => larguras.push(+n)));
  const total = larguras.reduce((a, b) => a + b, 0);
  let x = 0, barra = true, rects = '';
  larguras.forEach(w => {
    if (barra) rects += `<rect x="${x}" y="0" width="${w}" height="100" fill="#000"/>`;
    x += w; barra = !barra;
  });
  const h = alturaMm || 12;
  return `<svg viewBox="0 0 ${total} 100" preserveAspectRatio="none" width="100%" height="${h}mm"
    shape-rendering="crispEdges" role="img" aria-label="código de barras ${esc(t)}">${rects}</svg>`
    + (mostrarTexto === false ? '' : `<div style="font-family:'IBM Plex Mono',monospace;font-size:7pt;letter-spacing:.12em;text-align:center;margin-top:.6mm">${esc(t)}</div>`);
}

/* ---------- caixas ---------- */
const TIPO_CAIXA = ['EQUIPAMENTOS', 'FONTES', 'DIVERSOS'];
function novaCaixa(tipo) {
  const num = 'CX' + hoje().replace(/-/g, '').slice(2) + '-' + String(DB.caixas.filter(c => c.data === hoje()).length + 1).padStart(2, '0');
  const c = { id: uid(), num, tipo: tipo || 'EQUIPAMENTOS', data: hoje(), destino: DB.cfg.matriz,
    status: 'ABERTA', itens: [], obs: '', nf: '' };
  DB.caixas.unshift(c); save(); render();
  editarCaixa(c.id);
}
function caixaDe(id) { return DB.caixas.find(c => c.id === id); }
function fecharCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  if (!c.itens.length) return toast('A caixa está vazia.', 'e');
  c.status = 'FECHADA'; save(); render(); toast(`Caixa ${c.num} fechada com ${c.itens.length} itens.`);
}
function enviarCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  c.status = 'ENVIADA'; c.enviadaEm = hoje();
  /* equipamentos da caixa passam para ENVIADO na esteira */
  c.itens.forEach(i => { if (i.equipId) { const e = DB.equip.find(x => x.id === i.equipId); if (e) { e.etapa = 'ENVIADO'; e.hubsoft = true; } } });
  marcarRotina('equip'); save(); render(); toast(`Caixa ${c.num} marcada como enviada à matriz.`);
}
function apagarCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  if (!confirm(`Apagar a caixa ${c.num}?`)) return;
  DB.caixas = DB.caixas.filter(x => x.id !== id); save(); render();
}
function addEquipCaixa(id, equipId) {
  const c = caixaDe(id), e = DB.equip.find(x => x.id === equipId);
  if (!c || !e) return;
  if (c.itens.some(i => i.equipId === equipId)) return toast('Esse equipamento já está na caixa.', 'e');
  c.itens.push({ equipId, desc: [e.marca, e.modelo].filter(Boolean).join(' ') || e.tipo || 'EQUIPAMENTO',
    tipo: e.tipo || '', serial: e.serial || '', mac: e.mac || '', ident: e.ident || '',
    os: e.os || '', cliente: e.cliente || '' });
  save(); editarCaixa(id);
}
function addFonteCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  const v = $('#fV').value.trim(), a = $('#fA').value.trim();
  if (!v || !a) return toast('Informe a voltagem e a amperagem.', 'e');
  c.itens.push({ modelo: $('#fM').value.trim().toUpperCase(), volts: v, amps: a,
    conector: $('#fC').value.trim(), aplicacao: $('#fAp').value.trim().toUpperCase(),
    qtd: Math.max(1, +$('#fQ').value || 1), cod: $('#fCod').value.trim().toUpperCase() });
  save(); editarCaixa(id);
}
function addDiverso(id) {
  const c = caixaDe(id); if (!c) return;
  const d = $('#dD').value.trim(); if (!d) return toast('Descreva o item.', 'e');
  c.itens.push({ desc: d.toUpperCase(), qtd: Math.max(1, +$('#dQ').value || 1), cod: $('#dCod').value.trim().toUpperCase() });
  save(); editarCaixa(id);
}
function tirarItem(id, i) { const c = caixaDe(id); if (!c) return; c.itens.splice(i, 1); save(); editarCaixa(id); }
function totalPecas(c) { return c.itens.reduce((a, i) => a + (i.qtd || 1), 0); }

/* ---------- etiquetas ---------- */
function etiquetaCaixa(c, seq, de) {
  const ARCO = ['#E8402A', '#F58220', '#F5C518', '#4CAF50', '#2BB8D9', '#3B62E0'];
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  const linhas = c.itens.slice(0, 22);
  return `<div class="et et-caixa">
    <div class="arco">${ARCO.map(x => `<i style="background:${x}"></i>`).join('')}</div>
    <div class="cab">
      <div style="font-size:7pt;letter-spacing:.16em;text-transform:uppercase;color:#555">Destinatário</div>
      <div class="para">${esc(c.destino)}</div>
      <div class="de"><b>Remetente:</b> ${esc(DB.cfg.unidade || '')}${DB.cfg.responsavel ? ' · ' + esc(DB.cfg.responsavel) : ''}</div>
    </div>
    <div class="faixa">
      <div style="flex:1">Caixa<b>${esc(c.num)}</b></div>

}
function etiquetaFonte(f) {
  return `<div class="et et-fonte">
    <div class="v">${esc(f.volts)}V <em>${esc(f.amps)}A</em></div>
    <div class="m">${esc(f.modelo || 'FONTE DE ALIMENTAÇÃO')}</div>

}
function listaConferencia(c) {
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  return `<div class="et-lista">
    <h1>Lista de conferência — caixa ${esc(c.num)}</h1>
    <div class="sub">Para: ${esc(c.destino)} &nbsp;·&nbsp; De: ${esc(DB.cfg.unidade || '')} &nbsp;·&nbsp; ${br(c.data)}
      &nbsp;·&nbsp; ${c.itens.length} itens / ${totalPecas(c)} peças${c.nf ? ' · NF ' + esc(c.nf) : ''}</div>
    <table><thead><tr><th style="width:8mm">#</th>
      ${eq ? '<th>Equipamento (nome no sistema)</th><th style="width:32mm">Serial</th><th style="width:36mm">MAC</th><th style="width:24mm">OS origem</th><th style="width:12mm">OK</th>'
           : '<th>Item</th><th style="width:30mm">Especificação</th><th style="width:18mm">Quantidade</th><th style="width:12mm">OK</th>'}
    </tr></thead><tbody>
    ${c.itens.map((i, n) => eq ? `<tr><td>${n + 1}</td>
        <td>${esc(i.desc)}</td><td style="font-family:monospace">${esc(i.serial || '—')}</td>
        <td style="font-family:monospace">${esc(i.mac || '—')}</td><td>${esc(i.os || '—')}</td><td></td></tr>`
      : `<tr><td>${n + 1}</td><td>${esc(i.modelo || i.desc || '')}</td>
        <td>${i.volts ? esc(i.volts) + 'V / ' + esc(i.amps) + 'A' : esc(i.cod || '—')}</td>
        <td>${i.qtd || 1}</td><td></td></tr>`).join('')}

    ${c.obs ? `<p style="font-size:8pt;margin-top:4mm"><b>Observação:</b> ${esc(c.obs)}</p>` : ''}
    <div style="margin-top:6mm">${barras(c.num, 14)}</div>
    <div class="ass"><div>Separado por — ${esc(DB.cfg.responsavel || '')}</div><div>Conferido no recebimento</div></div>
  </div>`;
}
function imprimir(html) {
  const el = document.getElementById('imprimivel');
  el.innerHTML = html;
  document.body.classList.add('imprimindo');
  const limpar = () => { document.body.classList.remove('imprimindo'); el.innerHTML = ''; window.removeEventListener('afterprint', limpar); };
  window.addEventListener('afterprint', limpar);
  setTimeout(() => { window.print(); setTimeout(limpar, 1500); }, 120);
}
function imprimirCaixa(id) { const c = caixaDe(id); if (c) imprimir(etiquetaCaixa(c, 1, 1)); }
function imprimirLista(id) { const c = caixaDe(id); if (c) imprimir(listaConferencia(c)); }
function imprimirFontes(id) {
  const c = caixaDe(id); if (!c) return;
  const et = [];
  c.itens.forEach(f => { for (let i = 0; i < (f.qtd || 1); i++) et.push(etiquetaFonte(Object.assign({}, f, { qtd: 1 }))); });
  if (!et.length) return toast('Nenhuma fonte na caixa.', 'e');
  imprimir(`<div class="folha-fontes">${et.join('')}</div>`);
}

<script>
/* =====================================================================

function vMatriz() {

        <button class="btn sm" onclick="imprimirLista('${c.id}')">Lista</button>
        ${c.tipo === 'FONTES' ? `<button class="btn sm" onclick="imprimirFontes('${c.id}')">Etiquetas das fontes</button>` : ''}

      <div class="bd" style="padding:10px 16px;font-size:12.5px;color:var(--txt-2)">
        ${br(c.data)}${c.enviadaEm ? ` → enviada em ${br(c.enviadaEm)}` : ''} · para ${esc(c.destino)}
        ${c.itens.length ? `<div style="margin-top:6px;color:var(--txt)">${esc(c.itens.slice(0, 4).map(i => i.desc || i.modelo || `${i.volts}V/${i.amps}A`).join(' · '))}${c.itens.length > 4 ? ` e mais ${c.itens.length - 4}` : ''}</div>` : '<div style="margin-top:6px">Caixa vazia.</div>'}
      </div>

  : `<div class="card"><div class="bd"><div class="empty">
      <h4>Nenhuma caixa montada</h4>
      <p>Monte a caixa, imprima a etiqueta com o conteúdo e o código de barras, e a matriz recebe sabendo<br>

      <button class="btn a" onclick="novaCaixa('EQUIPAMENTOS')">Montar a primeira caixa</button></div></div></div>`}`;
}
function emAlgumaCaixa(equipId) { return DB.caixas.some(c => c.itens.some(i => i.equipId === equipId)); }
function mudarMatriz() {
  const v = prompt('Destino padrão das remessas:', DB.cfg.matriz);

}

/* ---------- montagem da caixa ---------- */
function editarCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  const bloqueada = c.status !== 'ABERTA';
  const disp = DB.equip.filter(e => !emAlgumaCaixa(e.id) && etapaDe(e) !== 'ENVIADO');

  if (!bloqueada) {

      adicionar = `<div class="row" style="margin-bottom:12px">

        <button class="btn a" ${disp.length ? '' : 'disabled'} onclick="addEquipCaixa('${id}',$('#eqSel').value)">Adicionar</button>

    } else if (c.tipo === 'FONTES') {
      adicionar = `<div class="row" style="align-items:flex-end;margin-bottom:12px">

        <div style="flex:1;min-width:130px"><label class="fl">Aplicação</label><input id="fAp" placeholder="ONT 121AC"></div>
        <div style="width:90px"><label class="fl">Código</label><input id="fCod" placeholder="opcional"></div>
        <div style="width:70px"><label class="fl">Qtd</label><input type="number" id="fQ" value="1" min="1"></div>
        <button class="btn a" onclick="addFonteCaixa('${id}')">Adicionar</button></div>`;
    } else {
      adicionar = `<div class="row" style="align-items:flex-end;margin-bottom:12px">
        <div style="flex:2"><label class="fl">Item</label><input id="dD" placeholder="descrição do que vai na caixa"></div>
        <div style="width:120px"><label class="fl">Código</label><input id="dCod" placeholder="opcional"></div>

    }
  }
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  modal(`Caixa ${c.num} · ${c.tipo.toLowerCase()}`, `
    <div class="row" style="margin-bottom:14px">
      <div class="f"><label class="fl">Destino</label><input value="${esc(c.destino)}" ${bloqueada ? 'disabled' : ''} onchange="caixaDe('${id}').destino=this.value.toUpperCase();save()"></div>

    `<button class="btn" onclick="imprimirLista('${id}')">Imprimir lista</button>
     ${c.tipo === 'FONTES' ? `<button class="btn" onclick="imprimirFontes('${id}')">Etiquetas das fontes</button>` : ''}

function addTodosEquip(id) {
  const c = caixaDe(id); if (!c) return;
  const l = DB.equip.filter(e => ['HIGIENIZADO', 'ENCAIXOTADO'].includes(etapaDe(e)) && !emAlgumaCaixa(e.id));
  if (!l.length) return toast('Nenhum equipamento higienizado disponível.', 'e');

    <div class="card" style="margin-bottom:16px"><div class="hd"><h3>1 · Etiqueta de caixa — 100 × 150 mm</h3>
