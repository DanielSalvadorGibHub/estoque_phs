/* ---------- etiqueta 1: capa de identificação ---------- */
.et-capa{width:100mm;min-height:150mm;padding:6mm;display:flex;flex-direction:column;text-align:center}
.et-capa .arco{height:2.5mm;display:flex;margin:-6mm -6mm 5mm}
.et-capa .arco i{flex:1}
.et-capa .rot{font-size:7pt;letter-spacing:.22em;text-transform:uppercase;color:#555}
.et-capa .para{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:19pt;line-height:1.02;
  text-transform:uppercase;letter-spacing:-.03em;margin:1.5mm 0 4mm;padding-bottom:4mm;border-bottom:3pt solid #000}
.et-capa .tipo{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:13pt;text-transform:uppercase;
  background:#000;color:#fff;padding:2mm;letter-spacing:.04em;margin-bottom:5mm}
.et-capa .qtd{margin:auto 0;padding:4mm 0}
.et-capa .qtd b{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:62pt;line-height:.86;letter-spacing:-.05em;display:block}
.et-capa .qtd span{font-size:9pt;letter-spacing:.2em;text-transform:uppercase;color:#333}
.et-capa .meta{display:flex;gap:2mm;margin-bottom:4mm}
.et-capa .meta div{flex:1;border:1pt solid #000;padding:1.5mm;font-size:6.5pt;text-transform:uppercase;letter-spacing:.1em;line-height:1.3}
.et-capa .meta b{display:block;font-family:'IBM Plex Mono',monospace;font-size:11pt;font-weight:700;letter-spacing:0;text-transform:none;margin-top:.5mm}
.et-capa .de{font-size:7.5pt;color:#333;line-height:1.4;text-align:left;border-top:1pt solid #000;padding-top:2mm;margin-top:auto}
.et-capa .obs{font-size:7pt;border:1.5pt solid #000;padding:2mm;margin-bottom:3mm;text-align:left}

/* ---------- etiqueta 2: conteúdo, um código por equipamento ---------- */
.et-cont{width:100mm;min-height:150mm;padding:5mm;display:flex;flex-direction:column}
.et-cont.a4{width:210mm;min-height:297mm;padding:10mm}
.et-cont .ch{border-bottom:2pt solid #000;padding-bottom:2mm;margin-bottom:2.5mm;display:flex;align-items:flex-end;gap:3mm}
.et-cont .ch h2{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:12pt;margin:0;text-transform:uppercase;letter-spacing:-.02em;flex:1}
.et-cont.a4 .ch h2{font-size:16pt}
.et-cont .ch .p{font-family:'IBM Plex Mono',monospace;font-size:8pt;text-align:right;line-height:1.35}
.et-cont .linhas{flex:1}
.et-cont .li{display:flex;align-items:center;gap:3mm;border-bottom:.5pt solid #999;padding:1.6mm 0;page-break-inside:avoid;break-inside:avoid}
.et-cont .li .n{font-family:'IBM Plex Mono',monospace;font-size:7pt;color:#666;width:5mm;flex:0 0 5mm}
.et-cont .li .tx{flex:1;min-width:0}
.et-cont .li .tx b{display:block;font-size:8pt;font-weight:700;line-height:1.15;text-transform:uppercase}
.et-cont.a4 .li .tx b{font-size:9.5pt}
.et-cont .li .tx .mac{font-family:'IBM Plex Mono',monospace;font-size:8.5pt;letter-spacing:.04em;margin-top:.5mm}
.et-cont.a4 .li .tx .mac{font-size:10pt}
.et-cont .li .tx .ex{font-size:6.2pt;color:#555;margin-top:.4mm}
.et-cont .li .cb{width:52mm;flex:0 0 52mm}
.et-cont.a4 .li .cb{width:92mm;flex:0 0 92mm}
.et-cont .rod{margin-top:auto;border-top:2pt solid #000;padding-top:2.5mm;display:flex;align-items:flex-end;gap:3mm}
.et-cont .rod .cx{flex:1;font-size:7pt;line-height:1.4;text-align:left}
.et-cont .rod .cx b{font-family:'IBM Plex Mono',monospace;font-size:10pt;display:block}
.et-cont .rod .tt{text-align:right}
.et-cont .rod .tt b{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:30pt;line-height:.9;display:block;letter-spacing:-.04em}
.et-cont.a4 .rod .tt b{font-size:40pt}
.et-cont .rod .tt span{font-size:6.5pt;letter-spacing:.16em;text-transform:uppercase;color:#333}
</style>
<script>
/* =====================================================================
   CAMADA 7 — etiqueta em duas partes
   Papel 1: a capa, diz o que é a caixa e quantos itens tem.
   Papel 2: o conteúdo, um código de barras por equipamento.
   ===================================================================== */
const ARCO6 = ['#E8402A', '#F58220', '#F5C518', '#4CAF50', '#2BB8D9', '#3B62E0'];

/* o que vira código de barras em cada item */
function codigoItem(i, modo) {
  if (modo === 'serial') return i.serial || (i.mac || '').replace(/:/g, '') || i.cod || '';
  if (modo === 'ident') return i.ident || i.serial || (i.mac || '').replace(/:/g, '') || '';
  /* padrão: MAC sem os dois-pontos, que é mais curto e lê melhor */
  return (i.mac || '').replace(/:/g, '') || i.serial || i.cod || '';
}
function rotuloItem(i) {
  if (i.volts) return `${i.volts}V ${i.amps}A`;
  return i.mac || i.serial || i.cod || '';
}
function nomeItem(i) { return i.desc || i.modelo || 'ITEM'; }

/* ---------- papel 1 ---------- */
function etiquetaCapa(c, seq, de) {
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  return `<div class="et et-capa">
    <div class="arco">${ARCO6.map(x => `<i style="background:${x}"></i>`).join('')}</div>
    <div class="rot">Destinatário</div>
    <div class="para">${esc(c.destino)}</div>
    <div class="tipo">${esc(c.tipo)}</div>
    <div class="meta">
      <div style="flex:1.4">Caixa<b>${esc(c.num)}</b></div>
      <div>Volume<b>${seq || 1}/${de || 1}</b></div>
      <div>Data<b>${br(c.data)}</b></div>
    </div>
    <div class="qtd">
      <b>${totalPecas(c)}</b>
      <span>${eq ? 'equipamentos na caixa' : 'peças na caixa'}</span>
    </div>
    <div style="padding:0 6mm 4mm">${barras(c.num, 15)}</div>
    ${c.obs ? `<div class="obs"><b>Atenção:</b> ${esc(c.obs)}</div>` : ''}
    <div class="de">
      <b>Remetente:</b> ${esc(DB.cfg.unidade || '')}${DB.cfg.responsavel ? '<br><b>Responsável:</b> ' + esc(DB.cfg.responsavel) : ''}
      ${c.nf ? '<br><b>Nota fiscal:</b> ' + esc(c.nf) : ''}
      <br><b>Conferência:</b> lista de conteúdo colada ao lado desta etiqueta.
    </div>
  </div>`;
}

/* ---------- papel 2 ---------- */
function porPagina(c) { return c.formato === 'a4' ? 14 : 8; }
function paginasDe(c) {
  const n = porPagina(c), p = [];
  for (let i = 0; i < c.itens.length; i += n) p.push(c.itens.slice(i, i + n));
  return p.length ? p : [[]];
}
function etiquetaConteudo(c, itens, pag, tot, offset) {
  const a4 = c.formato === 'a4';
  const modo = c.cod || 'mac';
  const alt = a4 ? 11 : 8;
  return `<div class="et et-cont ${a4 ? 'a4' : ''}">
    <div class="ch">
      <h2>Conteúdo da caixa</h2>
      <div class="p">${esc(c.num)}<br>página ${pag}/${tot}</div>
    </div>
    <div class="linhas">
      ${itens.length ? itens.map((i, n) => {
        const cod = codigoItem(i, modo);
        return `<div class="li">
          <div class="n">${String((offset || 0) + n + 1).padStart(2, '0')}</div>
          <div class="tx">
            <b>${esc(nomeItem(i))}</b>
            <div class="mac">${esc(rotuloItem(i))}</div>
            ${i.serial && i.mac ? `<div class="ex">serial ${esc(i.serial)}</div>` : ''}
            ${i.qtd > 1 ? `<div class="ex">quantidade: ${i.qtd}</div>` : ''}
          </div>
          <div class="cb">${cod ? barras(cod, alt) : '<div style="font-size:6.5pt;color:#999;text-align:center">sem código</div>'}</div>
        </div>`;
      }).join('') : '<div style="font-size:8pt;color:#666;padding:6mm 0">Caixa sem itens.</div>'}
    </div>
    <div class="rod">
      <div class="cx">Caixa<b>${esc(c.num)}</b>
        ${esc(DB.cfg.unidade || '')} → ${esc(c.destino)}<br>${br(c.data)}</div>
      <div class="tt"><b>${totalPecas(c)}</b><span>${c.tipo === 'EQUIPAMENTOS' ? 'equipamentos' : 'peças'} no total</span></div>
    </div>
  </div>`;
}

/* ---------- impressão ---------- */
function paginasConteudo(c) {
  const pgs = paginasDe(c), tot = pgs.length;
  let off = 0;
  return pgs.map((itens, i) => { const h = etiquetaConteudo(c, itens, i + 1, tot, off); off += itens.length; return h; }).join('');
}
function imprimirCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  imprimir(etiquetaCapa(c, 1, 1) + paginasConteudo(c));
}
function imprimirCapa(id) { const c = caixaDe(id); if (c) imprimir(etiquetaCapa(c, 1, 1)); }
function imprimirConteudo(id) { const c = caixaDe(id); if (c) imprimir(paginasConteudo(c)); }
/* compatibilidade com chamadas antigas */
function etiquetaCaixa(c, seq, de) { return etiquetaCapa(c, seq, de); }

/* ---------- montagem da caixa, com escolha de formato e de código ---------- */
function editarCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  c.formato = 'a4';
  if (!c.cod) c.cod = 'mac';
  const bloqueada = c.status !== 'ABERTA';
  const disp = DB.equip.filter(e => !emAlgumaCaixa(e.id) && etapaDe(e) !== 'ENVIADO');
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  let adicionar = '';
  if (!bloqueada) {
    if (eq) {
      adicionar = `<div class="row" style="margin-bottom:12px">
        <select id="eqSel" style="flex:1">${disp.length ? disp.map(e => `<option value="${e.id}">${esc([e.marca, e.modelo].filter(Boolean).join(' '))} — ${esc(e.mac || e.serial || 'sem identificação')}${e.cliente ? ' · ' + esc(e.cliente) : ''}</option>`).join('') : '<option value="">nenhum equipamento disponível</option>'}</select>
        <button class="btn a" ${disp.length ? '' : 'disabled'} onclick="addEquipCaixa('${id}',$('#eqSel').value)">Adicionar</button>
        <button class="btn" ${disp.length ? '' : 'disabled'} onclick="addTodosEquip('${id}')">Adicionar todos higienizados</button></div>`;
    } else if (c.tipo === 'FONTES') {
      adicionar = `<div class="row" style="align-items:flex-end;margin-bottom:12px">
        <div style="flex:2;min-width:150px"><label class="fl">Modelo / fabricante</label><input id="fM" placeholder="ex.: FONTE INTELBRAS ONT"></div>
        <div style="width:78px"><label class="fl">Volts</label><input id="fV" placeholder="12"></div>
        <div style="width:78px"><label class="fl">Amperes</label><input id="fA" placeholder="1"></div>
        <div style="width:108px"><label class="fl">Conector</label><input id="fC" placeholder="P4 5,5×2,1"></div>
        <div style="flex:1;min-width:120px"><label class="fl">Aplicação</label><input id="fAp" placeholder="ONT 121AC"></div>
        <div style="width:96px"><label class="fl">Código</label><input id="fCod" placeholder="cód. barras"></div>
        <div style="width:68px"><label class="fl">Qtd</label><input type="number" id="fQ" value="1" min="1"></div>
        <button class="btn a" onclick="addFonteCaixa('${id}')">Adicionar</button></div>`;
    } else {
      adicionar = `<div class="row" style="align-items:flex-end;margin-bottom:12px">
        <div style="flex:2"><label class="fl">Item</label><input id="dD" placeholder="descrição do que vai na caixa"></div>
        <div style="width:130px"><label class="fl">Código</label><input id="dCod" placeholder="cód. barras"></div>
        <div style="width:78px"><label class="fl">Qtd</label><input type="number" id="dQ" value="1" min="1"></div>
        <button class="btn a" onclick="addDiverso('${id}')">Adicionar</button></div>`;
    }
  }
  const semCod = c.itens.filter(i => !codigoItem(i, c.cod)).length;
  modal(`Caixa ${c.num} · ${c.tipo.toLowerCase()}`, `
    <div class="row" style="margin-bottom:14px">
      <div class="f"><label class="fl">Destino</label><input value="${esc(c.destino)}" ${bloqueada ? 'disabled' : ''} onchange="caixaDe('${id}').destino=this.value.toUpperCase();save()"></div>
      <div class="f" style="max-width:140px"><label class="fl">Nota fiscal</label><input value="${esc(c.nf || '')}" ${bloqueada ? 'disabled' : ''} onchange="caixaDe('${id}').nf=this.value;save()"></div>
      <div class="f" style="max-width:140px"><label class="fl">Data</label><input type="date" value="${c.data}" ${bloqueada ? 'disabled' : ''} onchange="caixaDe('${id}').data=this.value;save()"></div>
    </div>
    <div class="row" style="margin-bottom:14px">
      ${eq ? `<div class="f" style="max-width:230px"><label class="fl">O código de barras representa</label>
        <select onchange="caixaDe('${id}').cod=this.value;save();editarCaixa('${id}')">
          <option value="mac" ${c.cod === 'mac' ? 'selected' : ''}>MAC (sem os dois-pontos)</option>
          <option value="serial" ${c.cod === 'serial' ? 'selected' : ''}>Número de série</option>
          <option value="ident" ${c.cod === 'ident' ? 'selected' : ''}>Identificador próprio</option>
        </select></div>` : ''}
      <div class="f" style="align-self:flex-end">
        <span class="tag t-n">${paginasDe(c).length} folha(s) de conteúdo · ${porPagina(c)} por folha</span>
        ${semCod ? `<span class="tag t-c">${semCod} sem código de barras</span>` : ''}
      </div>
    </div>
    ${adicionar}
    <div class="tw" style="max-height:280px"><table>
      <thead><tr><th class="nos" style="width:32px">#</th>
        ${eq ? '<th class="nos">Equipamento</th><th class="nos">MAC</th><th class="nos">Serial</th><th class="nos">Vira código</th>'
             : '<th class="nos">Item</th><th class="nos">Especificação</th><th class="nos" style="text-align:right">Qtd</th><th class="nos">Vira código</th>'}
        ${bloqueada ? '' : '<th class="nos"></th>'}</tr></thead>
      <tbody>${c.itens.length ? c.itens.map((i, n) => {
        const cod = codigoItem(i, c.cod);
        return eq ? `<tr>
          <td class="mono">${n + 1}</td><td><b>${esc(i.desc)}</b></td>
          <td class="mono" style="font-size:12px">${esc(i.mac || '—')}</td>
          <td class="mono" style="font-size:12px">${esc(i.serial || '—')}</td>
          <td class="mono" style="font-size:12px">${cod ? esc(cod) : '<span class="tag t-c">sem código</span>'}</td>
          ${bloqueada ? '' : `<td style="text-align:right"><button class="btn xs dg" onclick="tirarItem('${id}',${n})">tirar</button></td>`}</tr>`
        : `<tr><td class="mono">${n + 1}</td><td><b>${esc(i.modelo || i.desc || '')}</b>${i.aplicacao ? `<div style="font-size:11.5px;color:var(--txt-2)">${esc(i.aplicacao)}</div>` : ''}</td>
          <td class="mono">${i.volts ? esc(i.volts) + 'V / ' + esc(i.amps) + 'A' : esc(i.cod || '—')}${i.conector ? `<div style="font-size:11px;color:var(--txt-3)">${esc(i.conector)}</div>` : ''}</td>
          <td class="num"><b>${i.qtd || 1}</b></td>
          <td class="mono" style="font-size:12px">${cod ? esc(cod) : '<span class="tag t-n">sem código</span>'}</td>
          ${bloqueada ? '' : `<td style="text-align:right"><button class="btn xs dg" onclick="tirarItem('${id}',${n})">tirar</button></td>`}</tr>`;
      }).join('')
      : `<tr><td colspan="6"><div class="empty" style="padding:24px"><p>Caixa vazia. Adicione o que vai dentro.</p></div></td></tr>`}</tbody></table></div>
    <div class="field" style="margin-top:12px"><label class="fl">Observação (sai destacada na capa)</label>
      <input value="${esc(c.obs || '')}" ${bloqueada ? 'disabled' : ''} placeholder="ex.: dois equipamentos com avaria aparente" onchange="caixaDe('${id}').obs=this.value;save()"></div>
    <div class="grid g2" style="margin-top:16px">
      <div><div class="fl" style="margin-bottom:8px">Papel 1 — capa</div>
        ${previa(etiquetaCapa(c, 1, 1), .32)}</div>
      <div><div class="fl" style="margin-bottom:8px">Papel 2 — conteúdo${paginasDe(c).length > 1 ? ` (folha 1 de ${paginasDe(c).length})` : ''}</div>
        ${previa(etiquetaConteudo(c, paginasDe(c)[0], 1, paginasDe(c).length, 0), .32)}</div>
    </div>`,
    `<button class="btn" onclick="imprimirLista('${id}')">Lista de conferência</button>
     <button class="btn" onclick="imprimirCapa('${id}')">Só a capa</button>
     <button class="btn" onclick="imprimirConteudo('${id}')">Só o conteúdo</button>
     <button class="btn a" onclick="imprimirCaixa('${id}')">Imprimir os dois papéis</button>`, 1080);
}

/* ---------- galeria ---------- */
function galeriaEtiquetas() {
  const exCx = { num: 'CX260815-01', tipo: 'EQUIPAMENTOS', data: hoje(), destino: DB.cfg.matriz, nf: '',
    formato: '100x150', cod: 'mac', obs: 'Um equipamento com avaria aparente na carcaça.',
    itens: [
      { desc: 'INTELBRAS WIFIBER 121AC', tipo: 'ONT', serial: 'INTL2024A88F31', mac: '9C:53:22:1A:4B:7E', os: '12345' },
      { desc: 'HUAWEI EG8145V5', tipo: 'ONT', serial: 'HWTC4A2B9C11', mac: '48:57:02:9C:11:3D', os: '12351' },
      { desc: 'FIBERHOME HG6145F3', tipo: 'ONU', serial: 'BYH0007951422', mac: '54:BA:D9:64:4C:62', os: '12360' },
      { desc: 'INTELBRAS TWIBI GIGA', tipo: 'MESH', serial: 'ITB99120034', mac: 'D8:36:5F:F2:4B:98', os: '12377' }
    ] };
  const exF = [
    { modelo: 'FONTE CHAVEADA INTELBRAS', volts: '12', amps: '1', conector: 'P4 5,5×2,1', aplicacao: 'ONT 121AC / 120AC', qtd: 1, cod: 'FT12V1A' },
    { modelo: 'FONTE HUAWEI', volts: '12', amps: '2', conector: 'P4 5,5×2,1', aplicacao: 'EG8145V5', qtd: 1, cod: 'FT12V2A' },
    { modelo: 'FONTE MIKROTIK', volts: '24', amps: '0,8', conector: 'P4 5,5×2,1', aplicacao: 'RB / HAP AC', qtd: 1, cod: 'FT24V08A' }
  ];
  window.EXEMPLO_CX = exCx; window.EXEMPLO_FT = exF;
  modal('Modelos de etiqueta', `
    <p style="margin-top:0;font-size:13px;color:var(--txt-2)">
      Cada caixa leva <b style="color:var(--txt)">dois papéis colados</b>: a capa diz o que é e quantos itens tem;
      a folha de conteúdo lista item por item com o código de barras de cada um.
      Code 128 gerado aqui dentro, sem depender de internet.</p>

    <div class="grid g2" style="margin-bottom:16px">
      <div class="card"><div class="hd"><h3>Papel 1 · Capa</h3><span class="tag t-a">100 × 150 mm</span><div class="sp"></div>
        <button class="btn sm" onclick="imprimir(etiquetaCapa(EXEMPLO_CX,1,1))">Imprimir exemplo</button></div>
        <div class="bd">
          <p style="margin:0 0 10px;font-size:12.5px;color:var(--txt-2)">Destinatário em corpo grande, tipo de conteúdo,
            número da caixa e a quantidade total gigante — visível do outro lado do galpão.</p>
          <div class="et-preview" style="max-height:420px">${etiquetaCapa(exCx, 1, 2)}</div></div></div>

      <div class="card"><div class="hd"><h3>Papel 2 · Conteúdo</h3><span class="tag t-a">um código por equipamento</span><div class="sp"></div>
        <button class="btn sm" onclick="imprimir(paginasConteudo(EXEMPLO_CX))">Imprimir exemplo</button></div>
        <div class="bd">
          <p style="margin:0 0 10px;font-size:12.5px;color:var(--txt-2)">Modelo e MAC à esquerda, código de barras do próprio
            equipamento à direita. No rodapé, o total da caixa. A matriz bipa um a um sem digitar nada.</p>
          <div class="et-preview" style="max-height:420px">${etiquetaConteudo(exCx, exCx.itens, 1, 1, 0)}</div></div></div>
    </div>

    <div class="grid g2">
      <div class="card"><div class="hd"><h3>Etiqueta de fonte</h3><span class="tag t-a">70 × 37 mm · 24 por A4</span><div class="sp"></div>
        <button class="btn sm" onclick="imprimir('<div class=&quot;folha-fontes&quot;>'+EXEMPLO_FT.map(etiquetaFonte).join('')+'</div>')">Imprimir exemplo</button></div>
        <div class="bd">
          <p style="margin:0 0 10px;font-size:12.5px;color:var(--txt-2)">Voltagem e amperagem em corpo grande, legíveis de longe na prateleira.
            Compatível com folha adesiva de 24 divisões.</p>
          <div class="et-preview"><div style="display:flex;flex-wrap:wrap;width:210mm;transform:scale(.8);transform-origin:top left">${exF.map(etiquetaFonte).join('')}</div></div></div></div>

      <div class="card"><div class="hd"><h3>Lista de conferência</h3><span class="tag t-a">A4 · vai dentro da caixa</span><div class="sp"></div>
        <button class="btn sm" onclick="imprimir(listaConferencia(EXEMPLO_CX))">Imprimir exemplo</button></div>
        <div class="bd">
          <p style="margin:0 0 10px;font-size:12.5px;color:var(--txt-2)">Com coluna de conferência e assinatura dos dois lados.
            É o que te protege se sumir equipamento no caminho.</p>
          <div class="et-preview" style="max-height:380px"><div style="transform:scale(.72);transform-origin:top left">${listaConferencia(exCx)}</div></div></div></div>
    </div>`, '', 1160);
}

/* ---------- tela ---------- */
function vMatriz() {
  const abertas = DB.caixas.filter(c => c.status === 'ABERTA');
  const fechadas = DB.caixas.filter(c => c.status === 'FECHADA');

<script>
/* =====================================================================
   CAMADA 8 — importação de catálogo com prestação de contas
   O catálogo é fundido por id, nunca substituído. Toda importação diz
   o que entrou, o que mudou de preço e quanto isso mexeu no patrimônio.
   ===================================================================== */
function gravarCatalogo(linhas, data) {
  const antesTotal = valorTotal();
  const antesQtd = Object.keys(DB.catalogo).length;
  let novos = 0, atualizados = 0;
  const mudPreco = [], tipos = {}, cats = {};

  linhas.forEach(r => {
    if (!r.id) return;
    const k = 'p' + r.id, ant = DB.catalogo[k];
    const compra = r.compra || r.venda || 0;
    if (ant) {
      atualizados++;
      const pAnt = ant.compra || ant.venda || 0;
      if (Math.abs(pAnt - compra) > 0.005) mudPreco.push({ k, desc: r.desc, de: pAnt, para: compra });
    } else novos++;
    tipos[r.tipoprod || '—'] = (tipos[r.tipoprod || '—'] || 0) + 1;
    cats[r.categoria || 'N/A'] = (cats[r.categoria || 'N/A'] || 0) + 1;
    DB.catalogo[k] = {
      id: r.id, desc: r.desc, un: r.un,
      compra, venda: r.venda || r.compra || 0,
      categoria: r.categoria || 'N/A', tipo: r.tipoprod || '',
      minHub: r.minimo || 0, qtdEmpresa: r.qtd || 0
    };
  });

  Object.values(DB.itens).forEach(i => { const c = DB.catalogo[i.k]; if (c && c.categoria && c.categoria !== 'N/A') i.cat = c.categoria; });
  DB.catalogoData = data;
  _abc.chave = '';
  save();

  const depoisTotal = valorTotal();
  const delta = depoisTotal - antesTotal;
  /* só as mudanças de preço que tocam item existente na filial mexem no seu número */
  const relevantes = mudPreco.filter(m => DB.itens[m.k]);
  const semPreco = Object.values(DB.itens).filter(i => !DB.catalogo[i.k]);

  fecharModal(); render();

  if (!antesQtd) {
    toast(`Catálogo carregado: ${novos} produtos. ${fmtR(depoisTotal)} sob sua guarda.`);
    return;
  }
  modal('O que mudou no catálogo', `
    <div class="grid g4" style="margin-bottom:16px">
      ${kpi('Produtos novos', novos, 'não existiam no catálogo', novos ? 'var(--f-verde)' : 'var(--txt-3)')}
      ${kpi('Atualizados', atualizados, 'já existiam e foram revistos', 'var(--f-azul)')}
      ${kpi('Preços alterados', mudPreco.length, `${relevantes.length} afetam o seu estoque`, mudPreco.length ? 'var(--f-amarelo)' : 'var(--txt-3)')}
      ${kpi('Catálogo total', Object.keys(DB.catalogo).length, `eram ${antesQtd} antes`, 'var(--f-violeta)')}
    </div>

    ${Math.abs(delta) > 0.01 ? `<div class="card" style="margin-bottom:16px;border-left:3px solid ${delta < 0 ? 'var(--f-vermelho)' : 'var(--ok)'}">
      <div class="bd" style="padding:14px 16px">
        <div class="fl">Impacto no patrimônio sob sua guarda</div>
        <div class="row" style="gap:16px;margin-top:6px;align-items:baseline">
          <span style="font-family:var(--mono);font-size:15px;color:var(--txt-2)">${fmtR(antesTotal)}</span>
          <span style="color:var(--txt-3)">→</span>
          <b style="font-family:var(--disp);font-size:24px">${fmtR(depoisTotal)}</b>
          <span class="tag ${delta < 0 ? 't-c' : 't-ok'}">${delta > 0 ? '+' : ''}${fmtR(delta)}</span>
        </div>
        <div style="font-size:12.5px;color:var(--txt-2);margin-top:8px">
          A quantidade em estoque não mudou — o que mudou foi o preço de referência.
          Se você já apresentou o número anterior, vale mencionar a correção antes que alguém pergunte.</div>
      </div></div>` : ''}

    ${relevantes.length ? `<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Preços que mexem no seu estoque</h3>
      <span class="tag t-w">${relevantes.length}</span></div>
      <div class="bd tight"><div class="tw" style="max-height:240px"><table>
        <thead><tr><th class="nos">Produto</th><th class="nos" style="text-align:right">Antes</th>
          <th class="nos" style="text-align:right">Agora</th><th class="nos" style="text-align:right">Variação</th>
          <th class="nos" style="text-align:right">Saldo aqui</th></tr></thead>
        <tbody>${relevantes.sort((a, b) => Math.abs(b.para - b.de) - Math.abs(a.para - a.de)).map(m => {
          const it = DB.itens[m.k], q = (it.qtd || 0) + emCampo(m.k), v = (m.para - m.de) * q;
          return `<tr><td><b>${esc(m.desc)}</b></td>
            <td class="num" style="color:var(--txt-2)">${fmtR(m.de)}</td>
            <td class="num"><b>${fmtR(m.para)}</b></td>
            <td class="num"><span class="tag ${m.para < m.de ? 't-c' : 't-ok'}">${m.para > m.de ? '+' : ''}${fmtR(v)}</span></td>
            <td class="num">${fmt(q)}</td></tr>`;
        }).join('')}</tbody></table></div></div></div>` : ''}

    ${mudPreco.length > relevantes.length ? `<div style="font-size:12.5px;color:var(--txt-2);margin-bottom:14px">
      Outros ${mudPreco.length - relevantes.length} preços mudaram em produtos que não circulam nesta filial — não afetam o seu número.</div>` : ''}

    <div class="grid g2">
      <div class="card"><div class="hd"><h3>Composição do arquivo</h3></div><div class="bd">
        <div class="fl" style="margin-bottom:6px">Por tipo</div>
        <div class="row" style="gap:5px;margin-bottom:12px">${Object.entries(tipos).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<span class="chip">${esc(t)} ${n}</span>`).join('')}</div>
        <div class="fl" style="margin-bottom:6px">Por categoria</div>
        <div class="row" style="gap:5px">${Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([c, n]) => `<span class="chip">${esc(c)} ${n}</span>`).join('')}</div>
      </div></div>
      <div class="card"><div class="hd"><h3>Cobertura</h3></div><div class="bd">
        <div class="row" style="gap:20px;margin-bottom:10px">
          <div><div class="fl">Com preço</div><b style="font-family:var(--disp);font-size:22px">${Object.keys(DB.itens).length - semPreco.length}</b>
            <div style="font-size:11.5px;color:var(--txt-2)">de ${Object.keys(DB.itens).length} itens da filial</div></div>
          <div><div class="fl">Sem preço</div><b style="font-family:var(--disp);font-size:22px;color:${semPreco.length ? 'var(--warn)' : 'var(--ok)'}">${semPreco.length}</b>
            <div style="font-size:11.5px;color:var(--txt-2)">fora do catálogo</div></div>
        </div>
        <div class="bar" style="height:8px"><i style="width:${(Object.keys(DB.itens).length - semPreco.length) / Math.max(1, Object.keys(DB.itens).length) * 100}%"></i></div>
        ${semPreco.length ? `<div style="font-size:12px;color:var(--txt-2);margin-top:10px">
          ${esc(semPreco.slice(0, 3).map(i => i.desc).join(' · '))}${semPreco.length > 3 ? ` e mais ${semPreco.length - 3}` : ''}.
          ${semPreco.filter(i => i.legado).length ? `<br>${semPreco.filter(i => i.legado).length} são equipamentos inativos, que realmente não constam mais no catálogo.` : ''}</div>` : ''}
      </div></div>
    </div>`,
    `<button class="btn" onclick="copiar(textoMudancaCatalogo(${JSON.stringify(JSON.stringify(relevantes)).replace(/"/g, '&quot;')},${antesTotal},${depoisTotal}),'Resumo copiado.')">Copiar resumo</button>
     <button class="btn a" onclick="fecharModal()">Entendido</button>`, 1000);
}
function textoMudancaCatalogo(jsonRel, antes, depois) {
  let rel = []; try { rel = JSON.parse(jsonRel); } catch (e) {}
  const L = [`ATUALIZAÇÃO DO CATÁLOGO — ${br(hoje())}`, `${DB.cfg.unidade || ''}`, ''];
  L.push(`Patrimônio sob controle: ${fmtR(antes)} → ${fmtR(depois)} (${depois - antes > 0 ? '+' : ''}${fmtR(depois - antes)})`);
  L.push(`A quantidade física não mudou; o que mudou foi o preço de referência do catálogo.`);
  if (rel.length) {
    L.push('');
    L.push('Preços corrigidos em itens desta filial:');
    rel.forEach(m => L.push(`• ${m.desc}: ${fmtR(m.de)} → ${fmtR(m.para)}`));
  }
  return L.join('\n');
}
render();
</script>

<script>
/* =====================================================================
   CAMADA 9 — remetente em destaque, data de fechamento e origem
   dos nomes na lista oficial de equipamentos da Direct.
   ===================================================================== */
if (!DB.cfg.remetente) DB.cfg.remetente = 'ESTOQUE PINHAIS';

function fecharCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  if (!c.itens.length) return toast('A caixa está vazia.', 'e');
  c.status = 'FECHADA';
  c.fechadaEm = hoje();
  c.fechadaHora = new Date().toTimeString().slice(0, 5);
  save(); render();
  toast(`Caixa ${c.num} fechada em ${br(c.fechadaEm)} com ${totalPecas(c)} equipamentos.`);
}
const dataFecho = c => c.fechadaEm || c.data;

/* ---------- papel 1: capa ---------- */
function etiquetaCapa(c, seq, de) {
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  return `<div class="et et-capa">
    <div class="arco">${ARCO6.map(x => `<i style="background:${x}"></i>`).join('')}</div>
    <div class="rot">Destinatário</div>
    <div class="para">${esc(c.destino)}</div>
    <div class="tipo">${esc(c.tipo)}</div>
    <div class="remet">
      <div class="r">Remetente</div>
      <b>${esc(DB.cfg.remetente)}</b>
    </div>
    <div class="meta">
      <div style="flex:1.3">Caixa<b>${esc(c.num)}</b></div>
      <div style="flex:1.2">${c.fechadaEm ? 'Fechada em' : 'Aberta em'}<b>${br(dataFecho(c))}</b></div>
      <div>Volume<b>${seq || 1}/${de || 1}</b></div>
    </div>
    <div class="qtd">
      <b>${totalPecas(c)}</b>
      <span>${eq ? 'equipamentos na caixa' : 'peças na caixa'}</span>
    </div>
    <div style="padding:0 6mm 3mm">${barras(c.num, 14)}</div>
    ${c.obs ? `<div class="obs"><b>Atenção:</b> ${esc(c.obs)}</div>` : ''}
    <div class="de">
      ${DB.cfg.responsavel ? '<b>Responsável:</b> ' + esc(DB.cfg.responsavel) + '<br>' : ''}
      ${DB.cfg.unidade ? '<b>Unidade:</b> ' + esc(DB.cfg.unidade) + '<br>' : ''}
      ${c.nf ? '<b>Nota fiscal:</b> ' + esc(c.nf) + '<br>' : ''}
      <b>Conferência:</b> lista de conteúdo colada ao lado desta etiqueta.
    </div>
  </div>`;
}

/* ---------- papel 2: conteúdo, um código por equipamento ---------- */
function etiquetaConteudo(c, itens, pag, tot, offset) {
  const a4 = c.formato === 'a4';
  const modo = c.cod || 'mac';
  const alt = a4 ? 11 : 8;
  return `<div class="et et-cont ${a4 ? 'a4' : ''}">
    <div class="rem">
      <div><span>Remetente</span><b>${esc(DB.cfg.remetente)}</b></div>
      <div class="dt">Caixa fechada em<br><b style="font-size:9pt">${br(dataFecho(c))}${c.fechadaHora ? ' ' + c.fechadaHora : ''}</b></div>
    </div>
    <div class="ch">
      <h2>Conteúdo da caixa</h2>
      <div class="p">${esc(c.num)}<br>página ${pag}/${tot}</div>
    </div>
    <div class="linhas">
      ${itens.length ? itens.map((i, n) => {
        const cod = codigoItem(i, modo);
        return `<div class="li">
          <div class="n">${String((offset || 0) + n + 1).padStart(2, '0')}</div>
          <div class="tx">
            <b>${esc(nomeItem(i))}</b>
            <div class="mac">${esc(rotuloItem(i))}</div>
            ${i.serial && i.mac ? `<div class="ex">serial ${esc(i.serial)}</div>` : ''}
            ${i.qtd > 1 ? `<div class="ex">quantidade: ${i.qtd}</div>` : ''}
          </div>
          <div class="cb">${cod ? barras(cod, alt) : '<div style="font-size:6.5pt;color:#999;text-align:center">sem código</div>'}</div>
        </div>`;
      }).join('') : '<div style="font-size:8pt;color:#666;padding:6mm 0">Caixa sem itens.</div>'}
    </div>
    <div class="rod">
      <div class="cx">Caixa<b>${esc(c.num)}</b>
        ${esc(DB.cfg.remetente)} → ${esc(c.destino)}<br>Fechada em ${br(dataFecho(c))}</div>
      <div class="tt"><b>${totalPecas(c)}</b><span>${c.tipo === 'EQUIPAMENTOS' ? 'equipamentos' : 'peças'} no total</span></div>
    </div>
  </div>`;
}
function listaConferencia(c) {
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  return `<div class="et-lista">
    <h1>Lista de conferência — caixa ${esc(c.num)}</h1>
    <div class="sub"><b>De:</b> ${esc(DB.cfg.remetente)} &nbsp;·&nbsp; <b>Para:</b> ${esc(c.destino)}
      &nbsp;·&nbsp; <b>Fechada em:</b> ${br(dataFecho(c))}${c.fechadaHora ? ' às ' + c.fechadaHora : ''}
      &nbsp;·&nbsp; ${c.itens.length} itens / ${totalPecas(c)} peças${c.nf ? ' · NF ' + esc(c.nf) : ''}</div>
    <table><thead><tr><th style="width:8mm">#</th>
      ${eq ? '<th>Equipamento (nome no sistema)</th><th style="width:32mm">Serial</th><th style="width:36mm">MAC</th><th style="width:24mm">OS origem</th><th style="width:12mm">OK</th>'
           : '<th>Item</th><th style="width:30mm">Especificação</th><th style="width:18mm">Quantidade</th><th style="width:12mm">OK</th>'}
    </tr></thead><tbody>
    ${c.itens.map((i, n) => eq ? `<tr><td>${n + 1}</td>
        <td>${esc(nomeItem(i))}</td><td style="font-family:monospace">${esc(i.serial || '—')}</td>

        <td>${i.qtd || 1}</td><td></td></tr>`).join('')}

    ${c.obs ? `<p style="font-size:8pt;margin-top:4mm"><b>Observação:</b> ${esc(c.obs)}</p>` : ''}
    <div style="margin-top:6mm">${barras(c.num, 14)}</div>

  </div>`;
}

/* ---------- itens vindos da lista oficial da Direct ---------- */
function produtosDirect() {
  return Object.values(DB.catalogo)
    .filter(c => !c.tipo || /patrim/i.test(c.tipo))
    .sort((a, b) => a.desc.localeCompare(b.desc));
}
let ultimoProduto = '';
function addDoCatalogo(id) {
  const c = caixaDe(id); if (!c) return;
  const nome = $('#cpProd').value.trim();
  const mac = macNorm($('#cpMac').value), serial = serialNorm($('#cpSerial').value);
  if (!nome) { toast('Escolha o equipamento na lista.', 'e'); return; }
  if (!mac && !serial) { toast('Informe o MAC ou o serial.', 'e'); $('#cpMac').focus(); return; }
  if (mac && !macOk(mac)) { toast('MAC incompleto — precisa de 12 dígitos.', 'e'); $('#cpMac').focus(); return; }
  const ficha = produtosDirect().find(p => p.desc.toUpperCase() === nome.toUpperCase());
  const dup = c.itens.find(i => (mac && i.mac === mac) || (serial && i.serial === serial));
  if (dup) { toast('Esse equipamento já está na caixa.', 'e'); return; }
  c.itens.push({ desc: ficha ? ficha.desc : nome.toUpperCase(), k: ficha ? 'p' + ficha.id : '',
    tipo: ficha ? ficha.categoria : '', mac, serial, os: $('#cpOS').value.trim(), cliente: '' });
  ultimoProduto = ficha ? ficha.desc : nome;
  save(); editarCaixa(id);
  setTimeout(() => { const m = $('#cpMac'); if (m) m.focus(); }, 60);
  toast(`Adicionado. Total: ${totalPecas(c)}.`);
}

/* ---------- montagem ---------- */
function editarCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  c.formato = 'a4';
  if (!c.cod) c.cod = 'mac';
  const bloqueada = c.status !== 'ABERTA';
  const disp = DB.equip.filter(e => !emAlgumaCaixa(e.id) && etapaDe(e) !== 'ENVIADO');
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  const prods = produtosDirect();
  let adicionar = '';
  if (!bloqueada) {
    if (eq) {
      adicionar = `
      <div style="border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;background:var(--ink-2)">
        <div class="fl" style="margin-bottom:8px">Adicionar da lista de equipamentos da Direct — ${prods.length} produtos</div>
        <div class="row" style="align-items:flex-end">
          <div style="flex:2;min-width:210px"><label class="fl">Equipamento</label>
            <input id="cpProd" list="listaDirect" value="${esc(ultimoProduto)}" placeholder="digite para buscar" autocomplete="off">
            <datalist id="listaDirect">${prods.map(p => `<option value="${esc(p.desc)}">`).join('')}</datalist></div>
          <div style="width:170px"><label class="fl">MAC</label>
            <input id="cpMac" class="mono" placeholder="AA:BB:CC:DD:EE:FF" oninput="this.value=this.value.toUpperCase()"
              onkeydown="if(event.key==='Enter'){event.preventDefault();addDoCatalogo('${id}')}"></div>
          <div style="width:150px"><label class="fl">Serial</label>
            <input id="cpSerial" class="mono up" placeholder="opcional" oninput="this.value=this.value.toUpperCase()"
              onkeydown="if(event.key==='Enter'){event.preventDefault();addDoCatalogo('${id}')}"></div>
          <div style="width:100px"><label class="fl">OS origem</label><input id="cpOS" placeholder="opcional"></div>
          <button class="btn a" onclick="addDoCatalogo('${id}')">Adicionar</button>
        </div>
        <div style="font-size:11.5px;color:var(--txt-3);margin-top:7px">
          O nome sai exatamente como está no catálogo da Direct. Digite o MAC e aperte Enter para lançar em sequência.</div>
      </div>
      ${disp.length ? `<div class="row" style="margin-bottom:12px">
        <select id="eqSel" style="flex:1">${disp.map(e => `<option value="${e.id}">${esc([e.marca, e.modelo].filter(Boolean).join(' '))} — ${esc(e.mac || e.serial || 'sem identificação')}${e.cliente ? ' · ' + esc(e.cliente) : ''}</option>`).join('')}</select>
        <button class="btn" onclick="addEquipCaixa('${id}',$('#eqSel').value)">Adicionar dos já cadastrados</button>
        <button class="btn" onclick="addTodosEquip('${id}')">Todos higienizados</button></div>` : ''}`;
    } else if (c.tipo === 'FONTES') {
      adicionar = `<div class="row" style="align-items:flex-end;margin-bottom:12px">
        <div style="flex:2;min-width:150px"><label class="fl">Modelo / fabricante</label><input id="fM" placeholder="ex.: FONTE INTELBRAS ONT"></div>
        <div style="width:78px"><label class="fl">Volts</label><input id="fV" placeholder="12"></div>
        <div style="width:78px"><label class="fl">Amperes</label><input id="fA" placeholder="1"></div>
        <div style="width:108px"><label class="fl">Conector</label><input id="fC" placeholder="P4 5,5×2,1"></div>
        <div style="flex:1;min-width:120px"><label class="fl">Aplicação</label><input id="fAp" placeholder="ONT 121AC"></div>
        <div style="width:96px"><label class="fl">Código</label><input id="fCod" placeholder="cód. barras"></div>
        <div style="width:68px"><label class="fl">Qtd</label><input type="number" id="fQ" value="1" min="1"></div>
        <button class="btn a" onclick="addFonteCaixa('${id}')">Adicionar</button></div>`;
    } else {
      adicionar = `<div class="row" style="align-items:flex-end;margin-bottom:12px">
        <div style="flex:2"><label class="fl">Item</label><input id="dD" placeholder="descrição do que vai na caixa"></div>
        <div style="width:130px"><label class="fl">Código</label><input id="dCod" placeholder="cód. barras"></div>
        <div style="width:78px"><label class="fl">Qtd</label><input type="number" id="dQ" value="1" min="1"></div>
        <button class="btn a" onclick="addDiverso('${id}')">Adicionar</button></div>`;
    }
  }
  const semCod = c.itens.filter(i => !codigoItem(i, c.cod)).length;
  modal(`Caixa ${c.num} · ${c.tipo.toLowerCase()}`, `
    <div class="row" style="margin-bottom:14px">
      <div class="f" style="max-width:230px"><label class="fl">Remetente (destaque na etiqueta)</label>
        <input value="${esc(DB.cfg.remetente)}" onchange="DB.cfg.remetente=this.value.toUpperCase();save();editarCaixa('${id}')"></div>
      <div class="f"><label class="fl">Destino</label><input value="${esc(c.destino)}" ${bloqueada ? 'disabled' : ''} onchange="caixaDe('${id}').destino=this.value.toUpperCase();save()"></div>
      <div class="f" style="max-width:150px"><label class="fl">${c.fechadaEm ? 'Fechada em' : 'Data de abertura'}</label>
        <input type="date" value="${dataFecho(c)}" onchange="var x=caixaDe('${id}');if(x.fechadaEm)x.fechadaEm=this.value;else x.data=this.value;save();editarCaixa('${id}')"></div>
    </div>
    <div class="row" style="margin-bottom:14px">
      ${eq ? `<div class="f" style="max-width:230px"><label class="fl">O código de barras representa</label>
        <select onchange="caixaDe('${id}').cod=this.value;save();editarCaixa('${id}')">
          <option value="mac" ${c.cod === 'mac' ? 'selected' : ''}>MAC (sem os dois-pontos)</option>
          <option value="serial" ${c.cod === 'serial' ? 'selected' : ''}>Número de série</option>
          <option value="ident" ${c.cod === 'ident' ? 'selected' : ''}>Identificador próprio</option>
        </select></div>` : ''}
      <div class="f" style="align-self:flex-end">
        <span class="tag t-a">A4 · ${1 + paginasDe(c).length} folhas ao todo</span>
          <span class="tag t-n">1 capa + ${paginasDe(c).length} de conteúdo</span>
        <span class="tag t-a">${totalPecas(c)} ${eq ? 'equipamentos' : 'peças'}</span>
        ${semCod ? `<span class="tag t-c">${semCod} sem código de barras</span>` : ''}
      </div>
    </div>
    ${adicionar}
    <div class="tw" style="max-height:260px"><table>
      <thead><tr><th class="nos" style="width:32px">#</th>
        ${eq ? '<th class="nos">Equipamento (nome da Direct)</th><th class="nos">MAC</th><th class="nos">Serial</th><th class="nos">Vira código</th>'
             : '<th class="nos">Item</th><th class="nos">Especificação</th><th class="nos" style="text-align:right">Qtd</th><th class="nos">Vira código</th>'}
        ${bloqueada ? '' : '<th class="nos"></th>'}</tr></thead>
      <tbody>${c.itens.length ? c.itens.map((i, n) => {
        const cod = codigoItem(i, c.cod);
        return eq ? `<tr>
          <td class="mono">${n + 1}</td><td><b>${esc(nomeItem(i))}</b>${i.tipo ? `<div style="font-size:11px;color:var(--txt-3)">${esc(i.tipo)}</div>` : ''}</td>
          <td class="mono" style="font-size:12px">${esc(i.mac || '—')}</td>
          <td class="mono" style="font-size:12px">${esc(i.serial || '—')}</td>
          <td class="mono" style="font-size:12px">${cod ? esc(cod) : '<span class="tag t-c">sem código</span>'}</td>
          ${bloqueada ? '' : `<td style="text-align:right"><button class="btn xs dg" onclick="tirarItem('${id}',${n})">tirar</button></td>`}</tr>`
        : `<tr><td class="mono">${n + 1}</td><td><b>${esc(i.modelo || i.desc || '')}</b>${i.aplicacao ? `<div style="font-size:11.5px;color:var(--txt-2)">${esc(i.aplicacao)}</div>` : ''}</td>
          <td class="mono">${i.volts ? esc(i.volts) + 'V / ' + esc(i.amps) + 'A' : esc(i.cod || '—')}${i.conector ? `<div style="font-size:11px;color:var(--txt-3)">${esc(i.conector)}</div>` : ''}</td>
          <td class="num"><b>${i.qtd || 1}</b></td>
          <td class="mono" style="font-size:12px">${cod ? esc(cod) : '<span class="tag t-n">sem código</span>'}</td>
          ${bloqueada ? '' : `<td style="text-align:right"><button class="btn xs dg" onclick="tirarItem('${id}',${n})">tirar</button></td>`}</tr>`;
      }).join('')
      : `<tr><td colspan="6"><div class="empty" style="padding:22px"><p>Caixa vazia. Comece escolhendo o equipamento na lista da Direct.</p></div></td></tr>`}</tbody></table></div>
    <div class="field" style="margin-top:12px"><label class="fl">Observação (sai destacada na capa)</label>
      <input value="${esc(c.obs || '')}" ${bloqueada ? 'disabled' : ''} placeholder="ex.: dois equipamentos com avaria aparente" onchange="caixaDe('${id}').obs=this.value;save()"></div>
    <div class="grid g2" style="margin-top:16px">
      <div><div class="fl" style="margin-bottom:8px">Papel 1 — capa</div>
        ${previa(etiquetaCapa(c, 1, 1), .32)}</div>
      <div><div class="fl" style="margin-bottom:8px">Papel 2 — conteúdo${paginasDe(c).length > 1 ? ` (folha 1 de ${paginasDe(c).length})` : ''}</div>
        ${previa(etiquetaConteudo(c, paginasDe(c)[0], 1, paginasDe(c).length, 0), .32)}</div>
    </div>`,
    `${bloqueada ? '' : `<button class="btn" onclick="fecharCaixa('${id}');fecharModal()">Fechar caixa</button>`}
     <button class="btn" onclick="imprimirLista('${id}')">Lista de conferência</button>
     <button class="btn" onclick="imprimirCapa('${id}')">Só a capa</button>
     <button class="btn" onclick="imprimirConteudo('${id}')">Só o conteúdo</button>
     <button class="btn a" onclick="imprimirCaixa('${id}')">Imprimir os dois papéis</button>`, 1080);
  setTimeout(() => { const p = $('#cpProd'); if (p && !p.value) p.focus(); }, 60);
}
render();
</script>

</style>
<script>
/* =====================================================================
   CAMADA 10 — Central do estoque: a tela inicial
   ===================================================================== */
if (!DB.cfg.corBotoes) DB.cfg.corBotoes = 'espectro';

const PALETA = {
  espectro: ['#2BB8D9', '#3B62E0', '#8B4FD6', '#D8437F', '#E8402A', '#F58220', '#F5C518'],
  ciano: null, vermelho: null, creme: null
};
function corPill(i) {
  const m = DB.cfg.corBotoes;
  if (m === 'espectro') return { bg: PALETA.espectro[i % 7], tx: '#04121B' };
  if (m === 'vermelho') return { bg: '#E8402A', tx: '#FFF5F2' };
  if (m === 'creme') return { bg: '#F2EDE4', tx: '#0A0E24' };
  return { bg: '#2BB8D9', tx: '#04121B' };
}

/* cada botão da central: para onde vai e o que mostra no contador */
function botoesCentral() {
  const est = listaEstoque();
  const crit = est.filter(x => x.st === 'crit').length;
  const tecs = DB.tecnicos.filter(t => t.ativo !== false);
  const semConf = tecs.filter(t => !DB.confCarga.some(c => c.data === hoje() && c.tec === t.nome)).length;
  const emAberto = equipEmAberto().length;
  const cxAbertas = DB.caixas.filter(c => c.status !== 'ENVIADA').length;
  const sug = sugerirPedido().length;
  const ativ = linhasRelatorio(hoje()).length;
  const diasMes = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate() - new Date().getDate();
  return [
    { id: 'estoque', n: 'Controle de estoque', s: `${est.length} itens${temCatalogo() ? ' · ' + fmtRk(valorCentral()) : ''}`, c: crit, alerta: crit > 0 },
    { id: 'cargas', n: 'Controle de estoque técnico', s: `${tecs.length} técnicos${temCatalogo() ? ' · ' + fmtRk(valorCampo()) + ' em campo' : ''}`, c: semConf, alerta: semConf > 0 },
    { id: 'equip', n: 'Cadastro de equipamentos', s: 'troca, retirada e esteira', c: emAberto, alerta: false },
    { id: 'matriz', n: 'Envios à matriz', s: 'caixas, etiquetas e códigos', c: cxAbertas, alerta: false },
    { id: 'pedido', n: 'Pedido semanal', s: 'reposição por consumo real', c: sug, alerta: false },
    { id: '@mes', n: 'Fechamento do mês', s: `faltam ${diasMes} dias para o fim do mês`, c: 0, alerta: false },
    { id: 'relatorio', n: 'Relatório diário', s: `${ativ} atividades registradas hoje`, c: ativ, alerta: false }
  ];
}
function irCentral(id) { if (id === '@mes') return fechamentoDoMes(); ir(id); }
function fechamentoDoMes() {
  const d = new Date(), ini = iso(new Date(d.getFullYear(), d.getMonth(), 1));
  abrirResultados();
  setTimeout(() => { const a = $('#rde'); if (a) { a.value = ini; atualizarResultados(); } }, 80);
}

function vCentral() {
  const est = listaEstoque(), crit = est.filter(x => x.st === 'crit');
  const tecs = DB.tecnicos.filter(t => t.ativo !== false);
  const fc = DB.ferr.checks[hoje()] || {};
  const semFerr = tecs.filter(t => !fc[t.nome]);
  const eqHoje = DB.equip.filter(e => e.data === hoje()).length;
  const leg = todosLegados();
  const reqs = (DB.reqs || []).filter(r => r.status === 'PENDENTE');
  const prontos = (DB.reqs || []).filter(r => r.status === 'PRONTO');
  const cxFechadas = DB.caixas.filter(c => c.status === 'FECHADA');
  const r = rotinaHoje(), feitos = PASSOS.filter(p => r[p.id]).length;

  if (!Object.keys(DB.itens).length && !DB.equip.length) return avisoBackup() + primeiroUso();

  const alertas = [];
  if (crit.length) alertas.push({ c: 'var(--f-vermelho)', t: `${crit.length} item(ns) em ruptura`, d: crit.slice(0, 2).map(x => x.desc).join(' · '), v: 'estoque' });
  if (reqs.length) alertas.push({ c: 'var(--f-laranja)', t: `${reqs.length} pedido(s) de técnico aguardando separação`, d: reqs.slice(0, 2).map(x => x.tecnico).join(', '), v: 'reqs' });
  if (semFerr.length && DB.ferr.lista.length) alertas.push({ c: 'var(--f-amarelo)', t: `Ferramental sem conferência`, d: semFerr.map(t => t.nome).join(', '), v: 'ferramental' });
  if (leg.length) alertas.push({ c: 'var(--f-vermelho)', t: `${leg.length} patrimônios inativos parados em carga`, d: 'aguardando recolhimento', v: 'equip' });
  if (cxFechadas.length) alertas.push({ c: 'var(--f-aqua)', t: `${cxFechadas.length} caixa(s) fechada(s) prontas para envio`, d: cxFechadas.map(c => c.num).join(', '), v: 'matriz' });
  if (prontos.length) alertas.push({ c: 'var(--acc)', t: `${prontos.length} pedido(s) separados aguardando retirada`, d: prontos.map(x => x.tecnico).join(', '), v: 'reqs' });

  const secundarios = [
    { id: 'os', n: 'Ocorrências e custo', c: DB.os.length || '' },
    { id: 'firmware', n: 'Firmware', c: DB.firm.alvos.filter(a => a.pend > 0).length || '' },
    { id: 'reqs', n: 'Pedidos dos técnicos', c: reqs.length || '' },
    { id: 'ajustes', n: 'Ajustes e dados', c: '' }
  ];
  const cp = corPill(-1);

  return avisoBackup() + `
  <div class="central">
    <div>
      <div class="pilha">
        ${botoesCentral().map((b, i) => { const c = corPill(i);
          return `<button class="pill ${b.alerta ? 'alerta' : ''}" style="--pc:${c.bg};--pt:${c.tx}" onclick="irCentral('${b.id}')">
            <span class="ic">${String(i + 1).padStart(2, '0')}</span>
            <span class="tx">${esc(b.n)}<small>${esc(b.s)}</small></span>
            ${b.c ? `<span class="ct">${b.c}</span>` : ''}
          </button>`;
        }).join('')}
      </div>
      <div class="row" style="margin-top:16px;gap:8px">
        ${secundarios.map(s => `<button class="pill-sec" onclick="ir('${s.id}')">${esc(s.n)}${s.c ? `<span class="ct">${s.c}</span>` : ''}</button>`).join('')}
      </div>
      <div class="row" style="margin-top:14px;gap:8px;align-items:center">
        <span class="fl" style="margin:0">Cor dos botões</span>
        ${[['espectro', 'Espectro'], ['ciano', 'Ciano'], ['vermelho', 'Vermelho'], ['creme', 'Creme']].map(([v, n]) =>
          `<span class="chip ${DB.cfg.corBotoes === v ? 'on' : ''}" onclick="DB.cfg.corBotoes='${v}';save();render()">${n}</span>`).join('')}
      </div>
    </div>

    <div>
      <div class="topo-dir">
        <button class="pill-ped" style="--pc:${cp.bg};--pt:${cp.tx}" onclick="ir('reqs')">Pedidos</button>
        <div class="bolha ${reqs.length ? '' : 'zero'}">${reqs.length}</div>
        <button class="pill-sec" onclick="abrirResultados()">Resultados</button>
      </div>

      <div class="resumo">
        <h3>Resumo operacional · ${br(hoje())}</h3>
        <div class="res-kpi">
          ${temCatalogo()
            ? `<div style="--c:var(--f-verde)"><div class="l">Patrimônio</div><div class="v">${fmtRk(valorTotal())}</div><div class="d">central e campo</div></div>`
            : `<div style="--c:var(--f-verde)"><div class="l">Itens</div><div class="v">${est.length}</div><div class="d">no almoxarifado</div></div>`}
          <div style="--c:${crit.length ? 'var(--f-vermelho)' : 'var(--ok)'}"><div class="l">Ruptura</div><div class="v">${crit.length}</div><div class="d">itens críticos</div></div>
          <div style="--c:var(--f-violeta)"><div class="l">Equipamentos hoje</div><div class="v">${eqHoje}</div><div class="d">troca e retirada</div></div>
          <div style="--c:var(--f-aqua)"><div class="l">Rotina</div><div class="v">${feitos}<span style="font-size:15px;color:var(--txt-3)">/${PASSOS.length}</span></div><div class="d">passos concluídos</div></div>
        </div>

        <div class="res-sec">
          <b>Precisa de você agora</b>
          ${alertas.length ? alertas.map(x => `<div class="res-linha" style="cursor:pointer" onclick="ir('${x.v}')">
              <span class="pt" style="background:${x.c}"></span>
              <span style="flex:1;min-width:0"><b>${esc(x.t)}</b>
                <span style="display:block;font-size:11.5px;color:var(--txt-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.d)}</span></span>
              <span class="btn xs">abrir</span></div>`).join('')
            : `<div class="res-linha" style="color:var(--ok);font-weight:600"><span class="pt" style="background:var(--ok)"></span>Nada pendente. Rotina em dia.</div>`}
        </div>

        <div class="res-sec">
          <b>Rotina do dia</b>
          <div class="row" style="gap:7px">
            ${PASSOS.map(p => `<span class="chip ${r[p.id] ? 'on' : ''}" onclick="toggleRotina('${p.id}')" title="${esc(p.d)}">${esc(p.t.split(' ').slice(0, 3).join(' '))}</span>`).join('')}
          </div>
        </div>

        <div class="res-sec">
          <b>Movimento do estoque</b>
          ${graficoMovimento()}
        </div>
      </div>
    </div>
  </div>`;
}
Object.assign(VFN, { hoje: vCentral });
render();
</script>

/* período do painel de resultados passa a ser um parâmetro, não um ajuste posterior */
function abrirResultados(deArg, ateArg) {
  const de = deArg || iso(new Date(Date.now() - 30 * 864e5));
  const ate = ateArg || hoje();
  modal('Resultados do período', `
    <div class="row" style="margin-bottom:14px">
      <div class="f"><label class="fl">De</label><input type="date" id="rde" value="${de}" onchange="atualizarResultados()"></div>
      <div class="f"><label class="fl">Até</label><input type="date" id="rate" value="${ate}" onchange="atualizarResultados()"></div>
      <div class="f" style="flex:0 0 auto;align-self:flex-end">
        <button class="btn sm" onclick="$('#rde').value='${iso(new Date(Date.now() - 7 * 864e5))}';$('#rate').value='${hoje()}';atualizarResultados()">7 dias</button>
        <button class="btn sm" onclick="$('#rde').value='${iso(new Date(Date.now() - 30 * 864e5))}';$('#rate').value='${hoje()}';atualizarResultados()">30 dias</button>
        <button class="btn sm" onclick="var d=new Date();$('#rde').value=iso(new Date(d.getFullYear(),d.getMonth(),1));$('#rate').value='${hoje()}';atualizarResultados()">Mês atual</button>
        <button class="btn sm" onclick="var d=new Date();$('#rde').value=iso(new Date(d.getFullYear(),d.getMonth()-1,1));$('#rate').value=iso(new Date(d.getFullYear(),d.getMonth(),0));atualizarResultados()">Mês passado</button></div>
    </div>
    <div id="resTxt" class="pre" style="max-height:none">${esc(textoResultados(de, ate))}</div>
    <p style="font-size:12.5px;color:var(--txt-2);margin:12px 0 0">
      Números vindos do que foi registrado, sem estimativa. Se um indicador estiver baixo, é porque o registro
      daquele item ainda não virou rotina — não invente o número, corrija a rotina.</p>`,
    `<button class="btn" onclick="baixar('resultados_'+$('#rde').value+'_a_'+$('#rate').value+'.txt',textoResultados($('#rde').value,$('#rate').value))">Baixar</button>
     <button class="btn a" onclick="copiar(textoResultados($('#rde').value,$('#rate').value),'Resultados copiados.')">Copiar</button>`, 780);
}
function fechamentoDoMes() {
  const d = new Date();
  abrirResultados(iso(new Date(d.getFullYear(), d.getMonth(), 1)), hoje());
}
render();
</script>

<script>
/* =====================================================================
   CAMADA 11 — navegação sem painel lateral
   ===================================================================== */
function render() {
  const v = VIEWS.find(x => x.id === VIEW) || VIEWS[0];
  const naCentral = VIEW === 'hoje';
  const reqs = (DB.reqs || []).filter(r => r.status === 'PENDENTE').length;
  document.getElementById('app').innerHTML = `
  <div class="app">
    <header class="topo">
      <div class="fiber">${FIBRA.slice(0, 10).map(c => `<i style="background:${c}"></i>`).join('')}</div>

        <button class="marca" onclick="ir('hoje')" title="voltar à central">
          <b>ALMOX</b><span>${esc(DB.cfg.unidade || '')}</span></button>
        ${naCentral ? '' : `<div class="tdiv"></div>
          <div class="tcrumb"><div class="e">${esc(v.grp)} · ${br(hoje())}</div><h2>${esc(v.n)}</h2></div>`}
        <div class="sp"></div>
        ${acoesDaTela()}
        ${naCentral ? `<div class="tstat">${Object.keys(DB.itens).length} itens · ${snapsCentral().length} posições${reqs ? `<br><span style="color:var(--f-vermelho)">${reqs} pedido(s) na fila</span>` : ''}</div>
          <button class="voltar" onclick="backup()">Backup</button>`
        : `<button class="voltar" onclick="ir('hoje')">← Central</button>`}
      </div>
    </header>
    <div class="main"><div class="wrap" id="view">${corpo()}</div></div>
  </div>`;
  if (typeof depoisDeRenderizar === 'function') depoisDeRenderizar();
}
function acoesDaTela() {
  return ({
    estoque: `<button class="btn" onclick="exportEstoque()">Exportar CSV</button><button class="btn a" onclick="abrirImport('central')">Importar estoque</button>`,
    cargas: `<button class="btn a" onclick="abrirImport('carga')">Importar carga</button>`,
    ferramental: `<button class="btn" onclick="editarFerramental()">Editar lista</button><button class="btn a" onclick="slackFerramental()">Aviso do Slack</button>`,
    equip: `<button class="btn" onclick="exportTrocas()">Exportar planilha</button><button class="btn a" onclick="novoEquip()">Novo cadastro</button>`,
    matriz: `<button class="btn" onclick="galeriaEtiquetas()">Modelos de etiqueta</button><button class="btn a" onclick="novaCaixa('EQUIPAMENTOS')">Nova caixa</button>`,
    reqs: `<button class="btn" onclick="publicarCatalogo()">Publicar lista</button><button class="btn a" onclick="sincronizarReqs()">Buscar pedidos</button>`,
    os: `<button class="btn a" onclick="abrirImport('os')">Importar ocorrências</button>`,
    pedido: `<button class="btn" onclick="window.print()">Imprimir</button><button class="btn a" onclick="fecharPedido()">Registrar pedido</button>`,
    firmware: `<button class="btn a" onclick="novoAlvoFirm()">Novo lote</button>`,
    relatorio: `<button class="btn" onclick="abrirResultados()">Resultados</button><button class="btn a" onclick="copiarRelatorio()">Copiar relatório</button>`,
    ajustes: `<button class="btn" onclick="abrirImport('catalogo')">Importar catálogo</button><button class="btn a" onclick="restaurar()">Restaurar backup</button>`
  })[VIEW] || '';
}

/* ---------- Central com o ferramental entre os principais ---------- */
function botoesCentral() {
  const est = listaEstoque();
  const crit = est.filter(x => x.st === 'crit').length;
  const tecs = DB.tecnicos.filter(t => t.ativo !== false);
  const semConf = tecs.filter(t => !DB.confCarga.some(c => c.data === hoje() && c.tec === t.nome)).length;
  const fc = DB.ferr.checks[hoje()] || {};
  const semFerr = DB.ferr.lista.length ? tecs.filter(t => !fc[t.nome]).length : 0;
  const emAberto = equipEmAberto().length;
  const cxAbertas = DB.caixas.filter(c => c.status !== 'ENVIADA').length;
  const sug = sugerirPedido().length;
  const ativ = linhasRelatorio(hoje()).length;
  const d = new Date();
  const diasMes = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate();
  return [
    { id: 'estoque', n: 'Controle de estoque', s: `${est.length} itens${temCatalogo() ? ' · ' + fmtRk(valorCentral()) : ''}`, c: crit, alerta: crit > 0 },
    { id: 'cargas', n: 'Controle de estoque técnico', s: `${tecs.length} técnicos${temCatalogo() ? ' · ' + fmtRk(valorCampo()) + ' em campo' : ''}`, c: semConf, alerta: semConf > 0 },
    { id: 'ferramental', n: 'Ferramental', s: DB.ferr.lista.length ? `${DB.ferr.lista.length} itens conferidos por técnico` : 'monte a lista de ferramentas e EPI', c: semFerr, alerta: semFerr > 0 },
    { id: 'equip', n: 'Cadastro de equipamentos', s: 'troca, retirada e esteira', c: emAberto, alerta: false },
    { id: 'matriz', n: 'Envios à matriz', s: 'caixas, etiquetas e códigos', c: cxAbertas, alerta: false },
    { id: 'pedido', n: 'Pedido semanal', s: 'reposição por consumo real', c: sug, alerta: false },
    { id: '@mes', n: 'Fechamento do mês', s: `faltam ${diasMes} dias para o fim do mês`, c: 0, alerta: false },
    { id: 'relatorio', n: 'Relatório diário', s: `${ativ} atividades registradas hoje`, c: ativ, alerta: false }
  ];
}
function corPill(i) {
  const m = DB.cfg.corBotoes;
  const esp = ['#2BB8D9', '#3B62E0', '#8B4FD6', '#D8437F', '#E8402A', '#F58220', '#F5C518', '#4CAF50'];
  if (m === 'espectro') return { bg: esp[((i % 8) + 8) % 8], tx: '#04121B' };
  if (m === 'vermelho') return { bg: '#E8402A', tx: '#FFF5F2' };
  if (m === 'creme') return { bg: '#F2EDE4', tx: '#0A0E24' };
  return { bg: '#2BB8D9', tx: '#04121B' };
}

/* ---------- atalhos ---------- */
document.addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape' && !document.getElementById('modal').innerHTML && VIEW !== 'hoje') { ir('hoje'); return; }
  if (e.key === 'Backspace' && VIEW !== 'hoje') { e.preventDefault(); ir('hoje'); }
});
render();
</script>

<script>
/* =====================================================================
   CAMADA 12 — troca de tema

const PALETAS = {
  arc: {
    fibra: ['#0057B8', '#F26A21', '#F5C518', '#4CAF50', '#2BB8D9', '#3B62E0', '#8B4FD6', '#D8437F', '#C08552', '#8A91B4'],
    pills: ['#2BB8D9', '#3B62E0', '#8B4FD6', '#D8437F', '#E8402A', '#F58220', '#F5C518', '#4CAF50'],
    txPill: '#04121B',
    solidas: { ciano: ['#2BB8D9', '#04121B'], vermelho: ['#E8402A', '#FFF5F2'], creme: ['#F2EDE4', '#0A0E24'] }
  },
  berserk: {
    /* escala de brasa: do sangue seco à ferrugem, terminando em ferro */
    fibra: ['#7A0A0E', '#A31217', '#C1121F', '#CC2A1E', '#B5651D', '#C9862A', '#8A7A5C', '#6D675E', '#4A4348', '#312C31'],
    pills: ['#8E1017', '#A81219', '#C1121F', '#D01A22', '#A8451A', '#8F4A15', '#6E5228', '#6E5A50'],
    txPill: '#F4EEE2',
    solidas: { ciano: ['#6E5A50', '#F4EEE2'], vermelho: ['#B2131A', '#F4EEE2'], creme: ['#EDE6D8', '#0B0A0C'] }
  }
};
function temaAtual() { return DB.cfg.tema === 'berserk' ? 'berserk' : 'arc'; }
function aplicarTema(t, redesenhar) {
  DB.cfg.tema = t; save();
  document.body.className = t === 'berserk' ? 'berserk' : '';
  const p = PALETAS[t];
  FIBRA.length = 0; p.fibra.forEach(c => FIBRA.push(c));
  /* técnicos herdam a paleta nova */
  DB.tecnicos.forEach(x => { x.cor = corDe(x.nome); });
  save();
  if (redesenhar !== false) render();
}
function corPill(i) {
  const p = PALETAS[temaAtual()], m = DB.cfg.corBotoes;
  if (m === 'espectro') return { bg: p.pills[((i % 8) + 8) % 8], tx: p.txPill };
  const s = p.solidas[m] || p.solidas.ciano;
  return { bg: s[0], tx: s[1] };
}
function seletorTema() {
  return `<div class="row" style="margin-top:14px;gap:8px;align-items:center">
    <span class="fl" style="margin:0">Tema</span>
    ${[['berserk', 'Berserk'], ['arc', 'ARC']].map(([v, n]) =>
      `<span class="chip ${temaAtual() === v ? 'on' : ''}" onclick="DB.cfg.temaEscolhido=1;aplicarTema('${v}')">${n}</span>`).join('')}
    <span class="fl" style="margin:0 0 0 14px">Botões</span>
    ${[['espectro', temaAtual() === 'berserk' ? 'Brasa' : 'Espectro'], ['vermelho', 'Sangue'], ['ciano', 'Ferro'], ['creme', 'Osso']].map(([v, n]) =>
      `<span class="chip ${DB.cfg.corBotoes === v ? 'on' : ''}" onclick="DB.cfg.corBotoes='${v}';save();render()">${n}</span>`).join('')}
  </div>`;
}
/* substitui a antiga linha de cores por tema + cores */
const _vCentralBase = vCentral;
function vCentralTema() {
  return _vCentralBase().replace(
    /<div class="row" style="margin-top:14px;gap:8px;align-items:center">[\s\S]*?<\/div>\s*<\/div>\s*<div>/,
    seletorTema() + '</div><div>');
}
Object.assign(VFN, { hoje: vCentralTema });

if (!DB.cfg.tema) DB.cfg.tema = 'berserk';
aplicarTema(temaAtual(), false);
render();

<script>
/* =====================================================================
   CAMADA 13 — correção da impressão e limpeza da etiqueta
   O contêiner de impressão nunca existia no documento: era só regra de
   CSS. Agora é criado sob demanda. Fora também o número da caixa e a
   nota fiscal, que não são usados aqui.
   ===================================================================== */
function areaImpressao() {
  let el = document.getElementById('imprimivel');
  if (!el) {
    el = document.createElement('div');
    el.id = 'imprimivel';
    document.body.appendChild(el);
  }
  return el;
}
function imprimir(html) {
  if (!html) return toast('Nada para imprimir.', 'e');
  const el = areaImpressao();
  el.innerHTML = html;
  document.body.classList.add('imprimindo');
  let limpo = false;
  /* remove a classe em vez de restaurar um retrato do body: duas impressões
     seguidas guardariam o estado sujo da anterior */
  let limpar = () => {
    if (limpo) return; limpo = true;
    document.body.classList.remove('imprimindo');
    el.innerHTML = '';
  };
  /* limpa quando a impressão termina, quando a janela volta ao foco
     (o usuário fechou o diálogo) ou, na pior das hipóteses, por tempo */
  const aoFocar = () => setTimeout(limpar, 400);
  window.addEventListener('afterprint', limpar);
  window.addEventListener('focus', aoFocar, { once: true });
  const guarda = setTimeout(limpar, 120000);
  const limparAntes = limpar;
  limpar = () => { clearTimeout(guarda); window.removeEventListener('focus', aoFocar); limparAntes(); };
  setTimeout(() => {
    try { window.print(); } catch (e) { toast('O navegador bloqueou a impressão: ' + e.message, 'e'); limpar(); }
  }, 150);
}

/* ---------- papel 1: capa, sem número de caixa e sem nota fiscal ---------- */
function etiquetaCapa(c, seq, de) {
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  return `<div class="et et-capa">
    <div class="arco">${ARCO6.map(x => `<i style="background:${x}"></i>`).join('')}</div>
    <div class="rot">Destinatário</div>
    <div class="para">${esc(c.destino)}</div>
    <div class="tipo">${esc(c.tipo)}</div>
    <div class="remet">
      <div class="r">Remetente</div>
      <b>${esc(DB.cfg.remetente)}</b>
    </div>
    <div class="meta">
      <div style="flex:1.6">${c.fechadaEm ? 'Caixa fechada em' : 'Aberta em'}<b>${br(dataFecho(c))}</b></div>
      <div>Volume<b>${seq || 1}/${de || 1}</b></div>
    </div>
    <div class="qtd">
      <b>${totalPecas(c)}</b>
      <span>${eq ? 'equipamentos na caixa' : 'peças na caixa'}</span>
    </div>
    ${c.obs ? `<div class="obs"><b>Atenção:</b> ${esc(c.obs)}</div>` : ''}
    <div class="de">
      ${DB.cfg.responsavel ? '<b>Responsável:</b> ' + esc(DB.cfg.responsavel) + '<br>' : ''}
      ${DB.cfg.unidade ? '<b>Unidade:</b> ' + esc(DB.cfg.unidade) + '<br>' : ''}
      <b>Conferência:</b> lista de conteúdo colada ao lado desta etiqueta.
    </div>
  </div>`;
}

/* ---------- papel 2: conteúdo ---------- */
function etiquetaConteudo(c, itens, pag, tot, offset) {
  const a4 = c.formato === 'a4';
  const modo = c.cod || 'mac';
  const alt = a4 ? 11 : 8;
  return `<div class="et et-cont ${a4 ? 'a4' : ''}">
    <div class="rem">
      <div><span>Remetente</span><b>${esc(DB.cfg.remetente)}</b></div>
      <div class="dt">Caixa fechada em<br><b style="font-size:9pt">${br(dataFecho(c))}${c.fechadaHora ? ' ' + c.fechadaHora : ''}</b></div>
    </div>
    <div class="ch">
      <h2>Conteúdo da caixa</h2>
      ${tot > 1 ? `<div class="p">página ${pag}/${tot}</div>` : ''}
    </div>
    <div class="linhas">
      ${itens.length ? itens.map((i, n) => {
        const cod = codigoItem(i, modo);
        return `<div class="li">
          <div class="n">${String((offset || 0) + n + 1).padStart(2, '0')}</div>
          <div class="tx">
            <b>${esc(nomeItem(i))}</b>
            <div class="mac">${esc(rotuloItem(i))}</div>
            ${i.serial && i.mac ? `<div class="ex">serial ${esc(i.serial)}</div>` : ''}
            ${i.qtd > 1 ? `<div class="ex">quantidade: ${i.qtd}</div>` : ''}
          </div>
          <div class="cb">${cod ? barras(cod, alt) : '<div style="font-size:6.5pt;color:#999;text-align:center">sem código</div>'}</div>
        </div>`;
      }).join('') : '<div style="font-size:8pt;color:#666;padding:6mm 0">Caixa sem itens.</div>'}
    </div>
    <div class="rod">
      <div class="cx">${esc(DB.cfg.remetente)}<br>para ${esc(c.destino)}<br>${br(dataFecho(c))}</div>
      <div class="tt"><b>${totalPecas(c)}</b><span>${c.tipo === 'EQUIPAMENTOS' ? 'equipamentos' : 'peças'} no total</span></div>
    </div>
  </div>`;
}

/* ---------- lista de conferência ---------- */
function listaConferencia(c) {
  const eq = (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
  return `<div class="et-lista">
    <h1>Lista de conferência</h1>
    <div class="sub"><b>De:</b> ${esc(DB.cfg.remetente)} &nbsp;·&nbsp; <b>Para:</b> ${esc(c.destino)}
      &nbsp;·&nbsp; <b>Fechada em:</b> ${br(dataFecho(c))}${c.fechadaHora ? ' às ' + c.fechadaHora : ''}
      &nbsp;·&nbsp; ${c.itens.length} itens / ${totalPecas(c)} peças</div>
    <table><thead><tr><th style="width:8mm">#</th>
      ${eq ? '<th>Equipamento (nome no sistema)</th><th style="width:32mm">Serial</th><th style="width:36mm">MAC</th><th style="width:24mm">OS origem</th><th style="width:12mm">OK</th>'
           : '<th>Item</th><th style="width:30mm">Especificação</th><th style="width:18mm">Quantidade</th><th style="width:12mm">OK</th>'}
    </tr></thead><tbody>
    ${c.itens.map((i, n) => eq ? `<tr><td>${n + 1}</td>
        <td>${esc(nomeItem(i))}</td><td style="font-family:monospace">${esc(i.serial || '—')}</td>
        <td style="font-family:monospace">${esc(i.mac || '—')}</td><td>${esc(i.os || '—')}</td><td></td></tr>`
      : `<tr><td>${n + 1}</td><td>${esc(i.modelo || i.desc || '')}</td>
        <td>${i.volts ? esc(i.volts) + 'V / ' + esc(i.amps) + 'A' : esc(i.cod || '—')}</td>
        <td>${i.qtd || 1}</td><td></td></tr>`).join('')}
    </tbody></table>
    ${c.obs ? `<p style="font-size:8pt;margin-top:4mm"><b>Observação:</b> ${esc(c.obs)}</p>` : ''}
    <div class="ass"><div>Separado por — ${esc(DB.cfg.responsavel || '')} · ${esc(DB.cfg.remetente)}</div><div>Conferido no recebimento</div></div>
  </div>`;
}

render();
</script>

            ${PASSOS.map(p => `<span class="chip ${r[p.id] ? 'on' : ''}" onclick="toggleRotina('${p.id}')" title="${esc(p.d)}">${esc(p.t.split(' ').slice(0, 3).join(' '))}</span>`).join('')}

function seletorTema() {
  const est = temaAtual() === 'apex'
    ? [['hud', 'HUD'], ['espectro', 'Verde Direct'], ['vermelho', 'Alerta'], ['creme', 'Claro']]
    : [['espectro', temaAtual() === 'berserk' ? 'Brasa' : 'Espectro'], ['vermelho', 'Sangue'], ['ciano', 'Ferro'], ['creme', 'Osso']];

<script>
/* =====================================================================
   CAMADA 14 — ocorrências com troca + ponte HubSoft
   ===================================================================== */
if (!DB.cfg.ponteHub) DB.cfg.ponteHub = 'http://localhost:8765';
if (!DB.cfg.janelaOS) DB.cfg.janelaOS = 7;
let PONTE = { pronto: false, erro: '', consultadas: 0, cadastro: false, ensaio: false, checado: null };

/* o que conta como ocorrência de troca ou retirada */
const RE_TROCA = /(troca|substitui|retirad|recolh|devolu|cancelament|desinstal|comodato)/i;
function ehTroca(o) { return RE_TROCA.test([o.tipo, o.assunto, o.desc].filter(Boolean).join(' ')); }
function osComTroca(dias) {
  const d = dias || +DB.cfg.janelaOS || 7;
  const lim = iso(new Date(Date.now() - d * 864e5));
  return DB.os.filter(o => ehTroca(o) && o.data >= lim)
    .sort((a, b) => b.data.localeCompare(a.data) || String(a.os).localeCompare(String(b.os)));
}
function equipDaOS(num) { return DB.equip.filter(e => String(e.os) === String(num)); }
function osPendentes(dias) { return osComTroca(dias).filter(o => !equipDaOS(o.os).length); }

/* ---------- ponte ---------- */
async function checarPonte(silencioso) {
  try {
    const r = await fetch(DB.cfg.ponteHub.replace(/\/$/, '') + '/status', { cache: 'no-store' });
    const j = await r.json();
    PONTE = { pronto: !!j.pronto, erro: j.erro || '', consultadas: j.consultadas || 0,
      cadastro: !!j.cadastro, ensaio: !!j.ensaio, checado: new Date() };
    if (!silencioso) toast(j.pronto ? 'Ponte conectada ao HubSoft.' : ('Ponte no ar, mas ainda não entrou: ' + (j.erro || 'aguardando login')), j.pronto ? '' : 'w');
  } catch (e) {
    PONTE = { pronto: false, erro: 'ponte não respondeu', consultadas: 0, cadastro: false, ensaio: false, checado: new Date() };
    if (!silencioso) toast('A ponte não respondeu. Ela está rodando? (Central.bat)', 'e');
  }
  if (VIEW === 'equip') render();
}
function selosPonte() {
  if (!PONTE.checado) return `<span class="tag t-n">ponte não verificada</span>`;
  if (PONTE.pronto) return `<span class="tag t-ok">ponte conectada</span>${PONTE.ensaio ? '<span class="tag t-w">modo ensaio</span>' : ''}${PONTE.cadastro ? '' : '<span class="tag t-w">sem módulo de cadastro</span>'}`;
  return `<span class="tag t-c">ponte fora do ar</span>`;
}
async function enviarPelaPonte(id) {
  const e = DB.equip.find(x => x.id === id); if (!e) return;
  if (!PONTE.pronto) { await checarPonte(true); if (!PONTE.pronto) return toast('A ponte não está conectada ao HubSoft.', 'e'); }
  const corpo = {
    os: e.os || '', modelo: e.modelo || '', mac: e.mac || '', serial: e.serial || '',
    identificador: e.ident || '', tag: (e.tag || 'RETORNO DE TROCA').replace(/^RETORNO DE /, 'RETORNO ').toUpperCase(),
    cliente: e.cliente || '', contrato: e.contrato || '', obs: e.obs || ''
  };
  modal('Enviando ao HubSoft', `<div id="pPassos" class="pre" style="max-height:none">Abrindo as telas do HubSoft…
Isso leva de dois a quatro minutos e passa por três etapas.
Não feche esta janela.</div>`, '', 640);
  try {
    const r = await fetch(DB.cfg.ponteHub.replace(/\/$/, '') + '/cadastrar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo)
    });
    const j = await r.json();
    const passos = (j.passos || []).map(p => (typeof p === 'string' ? p : (p.texto || JSON.stringify(p)))).join('\n');
    const el = $('#pPassos');
    if (el) el.textContent = (passos || '(sem passos retornados)') + (j.ok ? '\n\nCadastro concluído.' : '\n\nParou: ' + (j.erro || 'motivo não informado'));
    if (j.ok) {
      e.hubsoft = true; e.etapa = e.cliente ? 'VINCULADO' : 'CADASTRADO';
      e.ponte = { em: new Date().toISOString(), ensaio: PONTE.ensaio };
      save();
      toast(PONTE.ensaio ? 'Ensaio concluído — nada foi gravado no HubSoft.' : 'Equipamento cadastrado no HubSoft.');
    } else toast('A ponte parou no meio: ' + (j.erro || ''), 'e');
  } catch (x) {
    const el = $('#pPassos'); if (el) el.textContent = 'Falha ao falar com a ponte: ' + x.message
      + '\n\nSe o ALMOX estiver aberto por https, o navegador bloqueia a chamada ao localhost.\nUse o arquivo local (duplo clique no almox.html).';
    toast('Falha ao falar com a ponte.', 'e');
  }
}
async function fotosDaOS(num) {
  if (!PONTE.pronto) { await checarPonte(true); if (!PONTE.pronto) return toast('Ponte não conectada.', 'e'); }
  modal(`Fotos da OS ${num}`, `<div id="fotosBox"><div class="empty">Buscando no HubSoft…</div></div>`, '', 900);
  try {
    const r = await fetch(DB.cfg.ponteHub.replace(/\/$/, '') + '/fotos?os=' + encodeURIComponent(num), { cache: 'no-store' });
    const j = await r.json();
    const fs = j.fotos || [];
    const el = $('#fotosBox'); if (!el) return;
    el.innerHTML = fs.length
      ? `<div class="grid g3">${fs.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener">
          <img src="${esc(f.url)}" style="width:100%;border:1px solid var(--line);display:block" loading="lazy"></a>`).join('')}</div>
         <div style="font-size:12.5px;color:var(--txt-2);margin-top:10px">${fs.length} foto(s). As imagens vêm direto do HubSoft e não são guardadas aqui.</div>`
      : `<div class="empty"><h4>Sem anexo</h4><p>Esta ordem não tem foto anexada no HubSoft.</p></div>`;
  } catch (e) { const el = $('#fotosBox'); if (el) el.innerHTML = `<div class="empty"><p>${esc(e.message)}</p></div>`; }
}

/* ---------- tela de troca e retirada ---------- */
function vEquip() {
  const hj = DB.equip.filter(e => e.data === hoje());
  const pend = DB.equip.filter(e => !e.hubsoft);

  const dias = +DB.cfg.janelaOS || 7;

  <div class="grid g4" style="margin-bottom:16px">

    ${kpi('Trocas sem cadastro', semCadastro.length, `ocorrências dos últimos ${dias} dias`, semCadastro.length ? 'var(--f-vermelho)' : 'var(--ok)')}
