<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#070A1C">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMOX · Central de Estoque e Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ALMOX — identidade visual
   Retro-futurismo espacial: void índigo, arco espectral,
   tipografia pesada em creme, duotone âmbar e ciano.
   ============================================================ */
:root{
  /* espectro do arco — também é a escala categórica de dados */
  --f-vermelho:#E8402A; --f-laranja:#F58220; --f-amarelo:#F5C518; --f-verde:#4CAF50;
  --f-aqua:#2BB8D9; --f-azul:#3B62E0; --f-violeta:#8B4FD6; --f-rosa:#D8437F;
  --f-marrom:#C08552; --f-cinza:#8A91B4; --f-branco:#F2EDE4; --f-preto:#070A1C;

  /* void */
  --ink:#070A1C; --ink-2:#0E1330; --ink-3:#1A2050;
  --paper:#0A0E24; --card:#111634; --line:#242B5C; --line-2:#1A2048;

  /* creme */
  --txt:#F2EDE4; --txt-2:#A9AEC9; --txt-3:#6E7599;

  /* ciano é a ação, âmbar é o destaque */
  --acc:#2BB8D9; --acc-d:#1A93B0; --acc-l:#12304A;
  --amb:#F5A623;

  --ok:#3FD07D; --ok-bg:#0F2E22;
  --warn:#F5C518; --warn-bg:#332A0C;
  --crit:#FF5C4D; --crit-bg:#3A1418;
  --info-bg:#141C42;

  --r:3px; --r2:8px;
  --sh:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 20px 60px rgba(0,0,0,.65),0 0 0 1px rgba(43,184,217,.14);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:'Archivo','IBM Plex Sans',system-ui,sans-serif;
  --rail:220px;
  --arco:linear-gradient(90deg,var(--f-vermelho),var(--f-laranja) 18%,var(--f-amarelo) 36%,var(--f-verde) 54%,var(--f-aqua) 72%,var(--f-azul));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--txt); font-family:var(--sans);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 620px at 76% -12%, rgba(59,98,224,.20), transparent 62%),
    radial-gradient(620px 460px at 4% 8%, rgba(139,79,214,.14), transparent 60%);
  background-attachment:fixed;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2A3168;border-radius:6px;border:2px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(43,184,217,.32);color:#fff}

/* ============ layout ============ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{
  background:var(--ink); color:var(--txt-2); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--line-2);
  position:sticky;
}
/* arco espectral atrás da marca */
.rail::before{
  content:'';position:absolute;left:-108px;top:-96px;width:300px;height:300px;border-radius:50%;
  background:conic-gradient(from 168deg,
    var(--f-vermelho) 0deg 8deg, var(--f-laranja) 8deg 16deg, var(--f-amarelo) 16deg 24deg,
    var(--f-verde) 24deg 32deg, var(--f-aqua) 32deg 40deg, var(--f-azul) 40deg 48deg,
    transparent 48deg 360deg);
  -webkit-mask:radial-gradient(circle,transparent 128px,#000 129px,#000 168px,transparent 169px);
  mask:radial-gradient(circle,transparent 128px,#000 129px,#000 168px,transparent 169px);
  opacity:.9;pointer-events:none
}
.fiber{display:flex;height:3px;flex:0 0 3px;position:relative;z-index:1}
.fiber i{flex:1}
.brand{padding:20px 16px 12px;position:relative;z-index:1}
.brand h1{
  font-family:var(--disp);font-weight:800;font-size:27px;letter-spacing:-.045em;
  color:var(--f-branco);margin:0;line-height:.92;text-transform:uppercase
}
.brand .sub{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-3);margin-top:7px}
.nav{flex:1;overflow-y:auto;padding:6px 8px 8px;position:relative;z-index:1}
.nav .grp{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:#4A5180;padding:15px 8px 6px}
.nav a{
  display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--r);
  color:var(--txt-2);text-decoration:none;cursor:pointer;font-size:13px;font-weight:500;position:relative
}
.nav a .n{font-family:var(--mono);font-size:10px;color:#464D7C;width:15px;flex:0 0 15px}
.nav a:hover{background:var(--ink-2);color:var(--txt)}
.nav a.on{background:linear-gradient(90deg,rgba(43,184,217,.20),transparent);color:var(--f-branco);font-weight:700}
.nav a.on::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--acc)}
.nav a.on .n{color:var(--acc)}
.nav a .bdg{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--f-vermelho);color:#fff;padding:1px 5px;border-radius:8px;font-weight:700}
.railfoot{padding:11px 12px;border-top:1px solid var(--line-2);font-family:var(--mono);font-size:9.5px;color:#4A5180;display:flex;justify-content:space-between;align-items:center;gap:6px;position:relative;z-index:1}
.railfoot button{background:none;border:1px solid var(--line);color:var(--txt-3);border-radius:var(--r);padding:3px 7px;font-family:var(--mono);font-size:10px;cursor:pointer}
.railfoot button:hover{border-color:var(--acc);color:var(--acc)}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  background:rgba(14,19,48,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-2);
  padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;flex-wrap:wrap
}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--arco);opacity:.5}
.top h2{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.03em;margin:0;text-transform:uppercase;color:var(--f-branco)}
.top .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-3);margin-bottom:3px}
.top .sp{flex:1}
.wrap{padding:20px 22px 64px;max-width:1500px;width:100%}

/* ============ átomos ============ */
.card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r2);box-shadow:var(--sh)}
.card>.hd{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>.hd h3{margin:0;font-family:var(--disp);font-weight:700;font-size:13.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--f-branco)}
.card>.hd .sp{flex:1}
.card>.bd{padding:16px}
.card>.bd.tight{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{position:static;height:auto}.nav{max-height:none}}

.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--ink-2);
  color:var(--txt);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap
}
.btn:hover{border-color:#39418A;background:var(--ink-3)}
.btn.p{background:var(--f-branco);color:var(--ink);border-color:var(--f-branco)}
.btn.p:hover{background:#fff;color:var(--ink)}
.btn.a{background:var(--acc);color:#04121B;border-color:var(--acc);font-weight:700}
.btn.a:hover{background:#4FD3F0;color:#04121B}
.btn.dg{color:var(--crit);border-color:#5A2028;background:transparent}
.btn.dg:hover{background:var(--crit-bg)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.xs{padding:2px 6px;font-size:11px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .k{font-family:var(--mono);font-size:10px;opacity:.6;border:1px solid currentColor;border-radius:2px;padding:0 3px}

label.fl{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);color:var(--txt)
}
input::placeholder,textarea::placeholder{color:#5A6190}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px rgba(43,184,217,.16);background:var(--ink)}
input[type=color]{padding:1px;background:var(--ink-2)}
textarea{resize:vertical;min-height:70px}
.mono{font-family:var(--mono)}
.up{text-transform:uppercase}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.f{flex:1;min-width:130px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--txt-3);font-weight:500;padding:10px;border-bottom:1px solid var(--line);
  background:var(--ink-2);position:sticky;top:0;z-index:2;white-space:nowrap;cursor:pointer;user-select:none
}
th.nos{cursor:default}
th:hover:not(.nos){color:var(--acc)}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:rgba(43,184,217,.05)}
.tw{max-height:560px;overflow:auto;border-top:1px solid var(--line-2)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:2px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-w{background:var(--warn-bg);color:var(--warn)}
.t-c{background:var(--crit-bg);color:var(--crit)}
.t-n{background:var(--ink-3);color:var(--txt-2)}
.t-i{background:var(--info-bg);color:#7FA0FF}
.t-a{background:var(--acc-l);color:#5AD8F5}

.kpi{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r2);padding:15px 16px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--acc))}
.kpi::after{content:'';position:absolute;right:-46px;top:-46px;width:120px;height:120px;border-radius:50%;background:var(--c,var(--acc));opacity:.07}
.kpi .l{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3)}
.kpi .v{font-family:var(--disp);font-weight:800;font-size:31px;line-height:1.02;letter-spacing:-.04em;margin-top:6px;color:var(--f-branco)}
.kpi .d{font-size:11.5px;color:var(--txt-2);margin-top:4px}

.empty{padding:46px 20px;text-align:center;color:var(--txt-2)}
.empty .ic{font-size:26px;opacity:.35;margin-bottom:8px}
.empty h4{font-family:var(--disp);font-size:16px;color:var(--f-branco);margin:0 0 6px;text-transform:uppercase;letter-spacing:-.01em}
.empty p{margin:0 0 15px;font-size:13px}

.bar{height:6px;background:var(--ink-3);border-radius:3px;overflow:hidden;min-width:54px}
.bar i{display:block;height:100%;background:var(--acc)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px}
.spark i{flex:1;background:#2E3670;border-radius:1px;min-height:2px}
.spark i.hi{background:var(--acc)}

.drop{border:2px dashed var(--line);border-radius:var(--r2);padding:28px;text-align:center;background:var(--ink-2);cursor:pointer}
.drop.hot{border-color:var(--acc);background:var(--acc-l)}
.drop h4{margin:0 0 5px;font-family:var(--disp);font-size:15px;color:var(--f-branco);text-transform:uppercase}
.drop p{margin:0;font-size:12.5px;color:var(--txt-2)}

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--ink-2);color:var(--txt-2);border-radius:14px;padding:3px 11px;font-size:12px;cursor:pointer}
.chip:hover{border-color:#39418A;color:var(--txt)}
.chip.on{background:var(--acc);color:#04121B;border-color:var(--acc);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%}

.modal{position:fixed;inset:0;background:rgba(4,7,20,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh-2);max-width:880px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal .box>.hd{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;background:var(--ink-2)}
.modal .box>.hd h3{margin:0;font-family:var(--disp);font-size:15px;text-transform:uppercase;letter-spacing:.01em;color:var(--f-branco)}
.modal .box>.bd{padding:18px;overflow:auto}
.modal .box>.ft{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;background:var(--ink-2)}

#toasts{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);border:1px solid var(--line);color:var(--txt);padding:11px 15px;border-radius:var(--r);box-shadow:var(--sh-2);font-size:13px;font-weight:500;max-width:380px;border-left:3px solid var(--acc);animation:sl .18s ease}
.toast.e{border-left-color:var(--f-vermelho)}
.toast.w{border-left-color:var(--f-amarelo)}
@keyframes sl{from{transform:translateY(6px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--ink);border:1px solid var(--line-2);border-radius:var(--r);padding:13px;max-height:340px;overflow:auto;color:var(--txt)}

/* rotina */
.step{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.step:last-child{border-bottom:none}
.step .bx{width:19px;height:19px;flex:0 0 19px;border:1.5px solid var(--line);border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;background:var(--ink-2);margin-top:1px}
.step .bx.on{background:var(--ok);border-color:var(--ok);color:#04121B}
.step .tx{flex:1;min-width:0}
.step .tx b{display:block;font-size:13.5px;font-weight:600}
.step .tx span{font-size:12px;color:var(--txt-2)}
.step.done .tx b{color:var(--txt-3);text-decoration:line-through}

/* folha do pedido: nasce clara, é feita para imprimir */
.sheet{background:#F6F2EA;color:#0A0E24;border:1px solid var(--line);border-radius:var(--r2);padding:24px}
.sheet .sh-h{display:flex;align-items:flex-end;gap:12px;border-bottom:3px solid #0A0E24;padding-bottom:10px;margin-bottom:14px;position:relative}
.sheet .sh-h::after{content:'';position:absolute;left:0;right:0;bottom:-7px;height:3px;background:var(--arco)}
.sheet .sh-h h3{font-family:var(--disp);font-weight:800;font-size:23px;margin:0;letter-spacing:-.035em;text-transform:uppercase;color:#0A0E24}
.sheet .sh-h .m{font-family:var(--mono);font-size:11px;color:#5A6190;margin-left:auto;text-align:right}
.sheet table{font-size:14px}
.sheet th{background:#F6F2EA;border-bottom:2px solid #0A0E24;color:#0A0E24;font-size:9.5px;position:static}
.sheet td{padding:7px 10px;border-bottom:1px solid #DCD6C9;color:#0A0E24}
.sheet tbody tr:hover{background:#EFE9DD}
.sheet .qt{font-family:var(--mono);font-weight:700;font-size:15px}
.sheet .fl,.sheet .mono{color:#5A6190}

@media print{
  .rail,.top,.noprint{display:none!important}
  .app{grid-template-columns:1fr}
  .wrap{padding:0;max-width:none}
  html,body{background:#fff!important;color:#000!important;background-image:none!important}
  .sheet{border:none;padding:0;background:#fff;color:#000}
  .sheet .sh-h::after{background:#000}
  .card{border:none;box-shadow:none;background:#fff;color:#000}
  .card>.hd h3,.top h2{color:#000}
  #toasts,#modal{display:none}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =====================================================================
   ALMOX — Central de Estoque e Campo
   arquivo único · funciona offline · dados no navegador
   ===================================================================== */
"use strict";

/* ---------- storage com fallback (funciona em preview e em disco) ---------- */
const Store = (() => {
  let mem = {}, ok = false;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); ok = true; } catch (e) { ok = false; }
  return {
    ok,
    get(k, d) { try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { const s = JSON.stringify(v); if (ok) { try { localStorage.setItem(k, s); } catch (e) { toast('Armazenamento cheio. Exporte um backup.', 'e'); } } else mem[k] = s; }
  };
})();

/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const key = s => norm(s).replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
const NULOS = /^(n\/?a|nenhum|nao informado|não informado|-{1,3}|—|null|undefined)$/i;
const nulo = v => { const s = String(v == null ? '' : v).trim(); return !s || NULOS.test(s); };
const lim = v => nulo(v) ? '' : String(v).trim();
const num = v => {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v == null ? '' : v).trim();
  if (nulo(s)) return 0;
  s = s.replace(/[^\d,.\-]/g, '');
  if (!s) return 0;
  /* HubSoft exporta com ponto decimal (534.0000, 272.932). Virgula so aparece no formato pt-BR. */
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');          // 1.250,50 -> 1250.50
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');    // 1.250.000 -> 1250000
  const n = parseFloat(s); return isFinite(n) ? n : 0;
};
/* "Unitário - (UN)" -> UN | "Metro - (m)" -> M */
function unNorm(v) {
  const s = lim(v); if (!s) return 'UN';
  const m = s.match(/\(([^)]+)\)\s*$/);
  const b = (m ? m[1] : s).trim().toUpperCase();
  return ({ METRO: 'M', UNITARIO: 'UN', 'UNITÁRIO': 'UN', PECA: 'PC', 'PEÇA': 'PC' })[b] || b.slice(0, 5);
}
const LEGADO = /\(INATIVO\)|N[ÃA]O USAR|F5INTERNET/i;
const iso = d => { const x = d ? new Date(d) : new Date(); return new Date(x.getTime() - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const hoje = () => iso();
const br = s => { if (!s) return ''; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; };
const diasEntre = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('pt-BR');
const semana = d => { const x = new Date(d + 'T12:00'); const j = new Date(x.getFullYear(), 0, 1); return `${x.getFullYear()}-S${String(Math.ceil(((x - j) / 864e5 + j.getDay() + 1) / 7)).padStart(2, '0')}`; };
const FIBRA = ['#E8402A', '#F58220', '#F5C518', '#4CAF50', '#2BB8D9', '#3B62E0', '#8B4FD6', '#D8437F', '#C08552', '#8A91B4'];
const corDe = s => FIBRA[Math.abs(String(s).split('').reduce((a, c) => a * 31 + c.charCodeAt(0) | 0, 7)) % FIBRA.length];

/* MAC: normaliza para AA:BB:CC:DD:EE:FF. Nunca "corrige" B,C,D,E,F — são hex válidos. */
function macNorm(v) {
  const h = String(v || '').toUpperCase().replace(/[^0-9A-FO IL]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-F]/g, '');
  return h.length === 12 ? h.match(/.{2}/g).join(':') : String(v || '').toUpperCase().trim();
}
const macOk = v => /^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(macNorm(v));
const serialNorm = v => String(v || '').toUpperCase().replace(/\s+/g, '').trim();

/* ---------- toast ---------- */
function toast(msg, tipo) {
  const d = document.createElement('div');
  d.className = 'toast' + (tipo ? ' ' + tipo : '');
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .3s'; setTimeout(() => d.remove(), 300); }, 3600);
}
function copiar(txt, msg) {
  const done = () => toast(msg || 'Copiado para a área de transferência.');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fb());
  else fb();
  function fb() { const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Não consegui copiar. Selecione o texto manualmente.', 'e'); } t.remove(); }
}
function baixar(nome, conteudo, tipo) {
  const b = new Blob([conteudo], { type: (tipo || 'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csv(linhas) { return '\uFEFF' + linhas.map(l => l.map(c => { const s = String(c == null ? '' : c); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\n'); }

/* =====================================================================
   LEITOR DE PLANILHA — detecção automática de colunas do HubSoft
   ===================================================================== */
const DIC = {
  idprod: ['id produto', 'idproduto', 'id do produto', 'id', 'cod produto', 'codigo produto'],
  desc: ['nome', 'produto', 'descricao', 'descricao produto', 'descricao do produto', 'material', 'item', 'equipamento', 'especificacao'],
  qtd: ['quantidade', 'qtd', 'qtde', 'saldo', 'saldo atual', 'quantidade atual', 'estoque', 'disponivel', 'total'],
  un: ['unidade medida', 'unidade de medida', 'unidade', 'un', 'und', 'unid', 'medida'],
  patrim: ['codigo', 'patrimonio', 'n patrimonio', 'numero patrimonio', 'cod patrimonio', 'num patrimonio'],
  ctrlpat: ['controle patrimonial', 'patrimonial', 'controle'],
  serial: ['numero serie', 'numero de serie', 'n serie', 'serial', 'serie', 'sn'],
  mac: ['mac', 'mac address', 'endereco mac', 'macaddress'],
  ident: ['identificador proprio', 'identificador', 'ident'],
  epica: ['epi ca', 'ca', 'certificado aprovacao'],
  epival: ['epi data validade', 'validade ca', 'data validade', 'validade'],
  recond: ['recondicionado', 'recond'],
  tecnico: ['tecnico', 'responsavel', 'colaborador', 'usuario', 'funcionario', 'atendente', 'operador'],
  local: ['almoxarifado', 'deposito', 'local', 'estoque local', 'setor', 'filial'],
  min: ['minimo', 'estoque minimo', 'qtd minima', 'min'],
  compra: ['valor compra', 'valor de compra', 'preco compra', 'custo', 'custo unitario'],
  venda: ['valor venda', 'valor de venda', 'preco venda', 'preco', 'valor unitario', 'valor'],
  categoria: ['categoria', 'grupo', 'familia', 'classe'],
  tipoprod: ['tipo produto', 'tipo de produto', 'tipo'],
  osnum: ['os', 'ordem servico', 'ordem de servico', 'numero os', 'n os', 'id os', 'codigo os', 'protocolo', 'chamado'],
  ostipo: ['tipo servico', 'tipo de servico', 'servico', 'motivo', 'assunto', 'tipo os', 'descricao servico', 'tipo atendimento'],
  cliente: ['cliente', 'assinante', 'nome cliente', 'razao social', 'nome do cliente'],
  data: ['data', 'data execucao', 'data de execucao', 'data fechamento', 'data finalizacao', 'data conclusao', 'dt']
};
const CAMPOS = ['idprod', 'desc', 'qtd', 'un', 'patrim', 'ctrlpat', 'serial', 'mac', 'ident', 'epica', 'epival', 'tecnico', 'local', 'min', 'compra', 'venda', 'categoria', 'tipoprod', 'osnum', 'ostipo', 'cliente', 'data'];
function achaCol(cabecalhos, campo) {
  const alvo = DIC[campo] || [];
  let melhor = -1, pontos = 0;
  cabecalhos.forEach((h, i) => {
    const n = key(h); if (!n) return;
    alvo.forEach((a, ordem) => {
      let p = 0;
      if (n === a) p = 100 - ordem;
      else if (n.startsWith(a + ' ') || n.endsWith(' ' + a)) p = 70 - ordem;
      else if (a.length > 3 && n.includes(a)) p = 45 - ordem;
      if (p > pontos) { pontos = p; melhor = i; }
    });
  });
  return pontos > 0 ? melhor : -1;
}
/* acha a linha de cabecalho: a que tiver mais colunas reconhecidas */
function acharCabecalho(matriz) {
  let melhor = 0, pontos = -1;
  for (let i = 0; i < Math.min(matriz.length, 25); i++) {
    const linha = (matriz[i] || []).map(c => String(c == null ? '' : c));
    const preenchidas = linha.filter(c => c.trim()).length;
    if (preenchidas < 2) continue;
    let p = 0;
    ['idprod', 'desc', 'qtd', 'un', 'tecnico', 'serial', 'mac', 'patrim'].forEach(c => { if (achaCol(linha, c) >= 0) p += 2; });
    p += Math.min(preenchidas, 8) * 0.4;
    if (p > pontos) { pontos = p; melhor = i; }
  }
  return melhor;
}
function lerArquivo(file) {
  return new Promise((ok, err) => {
    const r = new FileReader();
    r.onerror = () => err(new Error('Falha ao ler o arquivo.'));
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ext === 'csv' || ext === 'txt') {
      r.onload = e => { try { ok(parseCSV(String(e.target.result))); } catch (x) { err(x); } };
      r.readAsText(file, 'utf-8');
    } else {
      if (typeof XLSX === 'undefined') return err(new Error('Leitor de XLSX não carregou. Salve a planilha como CSV e importe de novo.'));
      r.onload = e => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          ok(XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }));
        } catch (x) { err(new Error('Não consegui abrir a planilha: ' + x.message)); }
      };
      r.readAsArrayBuffer(file);
    }
  });
}
function parseCSV(txt) {
  const sep = (txt.split('\n')[0].match(/;/g) || []).length >= (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const out = []; let lin = [], cel = '', asp = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (asp) { if (c === '"') { if (txt[i + 1] === '"') { cel += '"'; i++; } else asp = false; } else cel += c; }
    else if (c === '"') asp = true;
    else if (c === sep) { lin.push(cel); cel = ''; }
    else if (c === '\n') { lin.push(cel); out.push(lin); lin = []; cel = ''; }
    else if (c !== '\r') cel += c;
  }
  if (cel || lin.length) { lin.push(cel); out.push(lin); }
  return out;
}

<script>
/* =====================================================================
   IMPORTAÇÃO
   ===================================================================== */
let IMP = null; // {matriz, cab, linhas, mapa, tipo, arquivo}

function abrirImport(tipo) {
  IMP = { tipo: tipo || 'central' };
  modal('Importar planilha do HubSoft', `
    <div class="drop" id="drop">
      <h4>Solte o arquivo aqui ou clique para escolher</h4>
      <p>Aceita .xlsx, .xls e .csv exportados do HubSoft</p>
      <input type="file" id="fin" accept=".xlsx,.xls,.csv,.txt" style="display:none">
    </div>
    <div class="row" style="margin-top:14px">
      <div class="f"><label class="fl">O que é esta planilha</label>
        <select id="itipo" onchange="if(IMP.cab)prevImport()">
          <option value="central">Posição do estoque central</option>
          <option value="carga">Carga pessoal do técnico</option>
          <option value="catalogo">Catálogo de produtos (com preço)</option>
          <option value="os">Ordens de serviço executadas</option>
        </select></div>
      <div class="f"><label class="fl">Data da posição</label><input type="date" id="idata" value="${hoje()}"></div>
    </div>
    <div id="prev"></div>`, '', 940);
  $('#itipo').value = IMP.tipo;
  const d = $('#drop'), f = $('#fin');
  d.onclick = () => f.click();
  d.ondragover = e => { e.preventDefault(); d.classList.add('hot'); };
  d.ondragleave = () => d.classList.remove('hot');
  d.ondrop = e => { e.preventDefault(); d.classList.remove('hot'); if (e.dataTransfer.files[0]) receber(e.dataTransfer.files[0]); };
  f.onchange = e => { if (e.target.files[0]) receber(e.target.files[0]); };
}
async function receber(file) {
  $('#prev').innerHTML = '<div class="empty">Lendo a planilha…</div>';
  try {
    const m = await lerArquivo(file);
    if (!m || !m.length) throw new Error('A planilha está vazia.');
    IMP.matriz = m; IMP.arquivo = file.name;
    const ic = acharCabecalho(m);
    IMP.cab = (m[ic] || []).map(c => String(c == null ? '' : c).trim());
    IMP.linhas = m.slice(ic + 1).filter(l => (l || []).some(c => !nulo(c)));
    IMP.mapa = {};
    CAMPOS.forEach(c => IMP.mapa[c] = achaCol(IMP.cab, c));
    if (IMP.mapa.desc < 0 && IMP.mapa.idprod >= 0) IMP.mapa.desc = IMP.mapa.idprod;
    IMP.nativo = IMP.mapa.idprod >= 0 && IMP.mapa.desc >= 0 && IMP.mapa.qtd >= 0;
    /* catalogo traz preco; OS traz numero de chamado; carga traz patrimonio, MAC e CA */
    const temPreco = IMP.mapa.compra >= 0 || IMP.mapa.venda >= 0;
    const temOS = IMP.mapa.osnum >= 0 || (IMP.mapa.ostipo >= 0 && IMP.mapa.cliente >= 0);
    const ehCarga = IMP.mapa.ctrlpat >= 0 || IMP.mapa.mac >= 0 || IMP.mapa.epica >= 0;
    IMP.tipo = temOS ? 'os' : temPreco ? 'catalogo' : ehCarga ? 'carga' : 'central';
    if ($('#itipo')) $('#itipo').value = IMP.tipo;
    prevImport();
  } catch (e) { $('#prev').innerHTML = `<div class="empty"><h4>Não deu para ler</h4><p>${esc(e.message)}</p></div>`; }
}
function prevImport() {
  const opts = i => IMP.cab.map((c, x) => `<option value="${x}" ${x === i ? 'selected' : ''}>${esc(c || 'coluna ' + (x + 1))}</option>`).join('');
  const campo = (k, lbl, obr) => `<div style="min-width:140px;flex:1"><label class="fl">${lbl}${obr ? ' *' : ''}</label>
     <select onchange="IMP.mapa.${k}=+this.value;prevImport()"><option value="-1">— não usar —</option>${opts(IMP.mapa[k])}</select></div>`;
  const tipoSel = $('#itipo') ? $('#itipo').value : IMP.tipo;
  const carga = tipoSel === 'carga';
  const achou = CAMPOS.filter(k => IMP.mapa[k] >= 0).length;
  const pat = IMP.mapa.ctrlpat >= 0 ? IMP.linhas.filter(l => /^s/i.test(lim(l[IMP.mapa.ctrlpat]))).length : 0;
  const leg = IMP.mapa.desc >= 0 ? IMP.linhas.filter(l => LEGADO.test(String(l[IMP.mapa.desc] || ''))).length : 0;
  const tecAtual = $('#itec') ? $('#itec').value : '';
  $('#prev').innerHTML = `
   <div class="card" style="margin-top:14px"><div class="hd">
     <h3>${esc(IMP.arquivo)}</h3>
     ${IMP.nativo || tipoSel === 'os' ? '<span class="tag t-ok">formato HubSoft reconhecido</span>' : `<span class="tag t-w">${achou} colunas reconhecidas</span>`}
     ${tipoSel === 'catalogo' ? '<span class="tag t-i">catálogo — não altera saldos</span>' : ''}
     <span class="tag t-a">${IMP.linhas.length} linhas</span>
     ${pat ? `<span class="tag t-i">${pat} com patrimônio</span>` : ''}
     ${leg ? `<span class="tag t-c">${leg} inativos / legado</span>` : ''}
   </div>
   <div class="bd">
     ${carga ? `<div style="background:var(--acc-l);border:1px solid var(--acc);border-radius:var(--r);padding:10px 12px;margin-bottom:14px">
        <label class="fl" style="color:var(--acc-d)">De quem é esta carga? *</label>
        <input id="itec" list="ltecimp" value="${esc(tecAtual)}" placeholder="Nome do técnico — o HubSoft não exporta esse dado"
          style="max-width:340px" oninput="this.value=this.value.toUpperCase()">
        <datalist id="ltecimp">${DB.tecnicos.map(t => `<option>${esc(t.nome)}</option>`).join('')}</datalist></div>` : ''}
     ${tipoSel === 'os' ? `<div class="row" style="align-items:flex-end">
       ${campo('data', 'Data de execução')}${campo('osnum', 'Nº da OS', 1)}${campo('ostipo', 'Tipo de serviço', 1)}${campo('tecnico', 'Técnico')}${campo('cliente', 'Cliente')}
     </div>` : `<div class="row" style="align-items:flex-end">
       ${campo('idprod', 'ID do produto')}${campo('desc', 'Descrição', 1)}${campo('qtd', 'Quantidade', tipoSel === 'catalogo' ? 0 : 1)}${campo('un', 'Unidade')}
     </div>`}
     ${tipoSel === 'catalogo' ? `<div class="row" style="align-items:flex-end;margin-top:10px">
       ${campo('compra', 'Valor de compra')}${campo('venda', 'Valor de venda')}${campo('categoria', 'Categoria')}${campo('tipoprod', 'Tipo (insumo/patrimônio)')}${campo('min', 'Estoque mínimo')}
     </div>` : ''}
     ${carga ? `<div class="row" style="align-items:flex-end;margin-top:10px">
       ${campo('ctrlpat', 'Controle patrimonial')}${campo('patrim', 'Nº patrimônio')}${campo('serial', 'Serial')}${campo('mac', 'MAC')}${campo('ident', 'Identificador próprio')}${campo('epica', 'CA do EPI')}
     </div>` : ''}
     <div class="tw" style="max-height:210px;margin-top:12px">
       <table><thead><tr>${IMP.cab.map(c => `<th class="nos">${esc(c || '—')}</th>`).join('')}</tr></thead>
       <tbody>${IMP.linhas.slice(0, 6).map(l => `<tr>${IMP.cab.map((_, i) => `<td class="${i === IMP.mapa.qtd ? 'num' : ''}">${esc(String(l[i] == null ? '' : l[i]).slice(0, 40))}</td>`).join('')}</tr>`).join('')}</tbody></table>
     </div>
     <div class="row" style="margin-top:14px;justify-content:flex-end">
       <button class="btn a" onclick="confirmarImport()">Importar ${IMP.linhas.length} linhas</button>
     </div>
   </div></div>`;
}
function confirmarImport() {
  const tipo = $('#itipo').value, data = $('#idata').value || hoje(), m = IMP.mapa;
  /* ocorrencias nao tem quantidade: sai antes do fluxo de estoque */
  if (tipo === 'os') {
    if (m.osnum < 0 && m.ostipo < 0) return toast('Escolha ao menos a coluna do número da OS ou do tipo de serviço.', 'e');
    return gravarOS(IMP.linhas, m, data);
  }
  if (m.desc < 0) return toast('Escolha a coluna de Descrição do produto.', 'e');
  if (tipo !== 'catalogo' && m.qtd < 0) return toast('Escolha a coluna de Quantidade.', 'e');
  const manual = $('#itec') ? $('#itec').value.trim().toUpperCase() : '';
  if (tipo === 'carga' && m.tecnico < 0 && !manual) { toast('Informe de quem é esta carga.', 'e'); if ($('#itec')) $('#itec').focus(); return; }
  const g = (l, c) => c >= 0 ? lim(l[c]) : '';
  const linhas = [];
  IMP.linhas.forEach(l => {
    const desc = g(l, m.desc);
    if (!desc || /^total/.test(key(desc))) return;
    const id = g(l, m.idprod);
    linhas.push({
      k: id ? 'p' + id : key(desc), id, desc, qtd: m.qtd >= 0 ? num(l[m.qtd]) : 0,
      un: unNorm(m.un >= 0 ? l[m.un] : ''),
      serie: /^s/i.test(g(l, m.ctrlpat)) || !!g(l, m.patrim) || !!g(l, m.mac),
      pat: g(l, m.patrim), serial: serialNorm(g(l, m.serial)),
      mac: g(l, m.mac) ? macNorm(g(l, m.mac)) : '', ident: g(l, m.ident),
      ca: g(l, m.epica), val: g(l, m.epival),
      compra: m.compra >= 0 ? num(l[m.compra]) : 0, venda: m.venda >= 0 ? num(l[m.venda]) : 0,
      categoria: g(l, m.categoria), tipoprod: g(l, m.tipoprod), minimo: m.min >= 0 ? num(l[m.min]) : 0,
      tec: (g(l, m.tecnico) || manual).toUpperCase()
    });
  });
  if (!linhas.length) return toast('Nenhuma linha válida encontrada.', 'e');

  const catalogar = r => {
    const it = DB.itens[r.k] || {};
    DB.itens[r.k] = Object.assign({}, it, {
      k: r.k, cod: r.id || it.cod || '', desc: r.desc, un: r.un || it.un || 'UN',
      qtd: it.qtd || 0, min: it.min || 0, cat: it.cat || categorizar(r.desc),
      legado: LEGADO.test(r.desc), atualizado: data
    });
  };
  const agregar = ls => {
    const itens = {}, series = [];
    ls.forEach(r => {
      catalogar(r);
      itens[r.k] = (itens[r.k] || 0) + (r.serie ? (r.qtd || 1) : r.qtd);
      if (r.serie && (r.pat || r.serial || r.mac || r.ident))
        series.push({ k: r.k, desc: r.desc, pat: r.pat, serial: r.serial, mac: r.mac, ident: r.ident, ca: r.ca, val: r.val, legado: LEGADO.test(r.desc) });
    });
    return { itens, series };
  };

  if (tipo === 'catalogo') return gravarCatalogo(linhas, data);

  if (tipo === 'central') {
    const { itens, series } = agregar(linhas);
    Object.entries(itens).forEach(([k, q]) => { DB.itens[k].qtd = q; });
    DB.snaps = DB.snaps.filter(x => !(x.tipo === 'central' && x.data === data));
    DB.snaps.push({ id: uid(), tipo: 'central', data, arquivo: IMP.arquivo, itens, series });
    DB.snaps.sort((a, b) => a.data.localeCompare(b.data));
    if (DB.snaps.length > 120) DB.snaps = DB.snaps.slice(-120);
    marcarRotina('estoque', data);
    toast(`Estoque central de ${br(data)}: ${Object.keys(itens).length} itens, ${fmt(Object.values(itens).reduce((a, b) => a + b, 0))} peças.`);
  } else {
    const porTec = {};
    linhas.forEach(r => { const t = r.tec || 'SEM NOME'; (porTec[t] = porTec[t] || []).push(r); });
    Object.entries(porTec).forEach(([t, ls]) => {
      const { itens, series } = agregar(ls);
      DB.cargas[t] = { tec: t, data, itens, series, arquivo: IMP.arquivo };
      DB.snaps = DB.snaps.filter(x => !(x.tipo === 'carga' && x.tec === t && x.data === data));
      DB.snaps.push({ id: uid(), tipo: 'carga', tec: t, data, itens });
      if (!DB.tecnicos.find(x => x.nome === t)) DB.tecnicos.push({ nome: t, cor: corDe(t), ativo: true });
    });
    const leg = linhas.filter(r => LEGADO.test(r.desc)).length;
    DB.snaps.sort((a, b) => a.data.localeCompare(b.data));
    marcarRotina('carga', data);
    toast(`Carga importada: ${Object.keys(porTec).join(', ')} · ${linhas.length} linhas${leg ? ` · ${leg} equipamentos inativos em campo` : ''}.`);
  }
  save(); fecharModal(); render();
}
function categorizar(d) {

  if (/(mikrotik|routerboard|cloud core|switch|olt|servidor)/.test(n)) return 'Rede';
  if (/(onu|ont|roteador|router|repetidor|mesh|equipamento giga|xpon)/.test(n)) return 'Equipamento';
  if (/(cabo optico|drop|cordao|cordoa|patch|utp|cabo )/.test(n)) return 'Cabo';
  if (/(conector|acoplador|splitter|divisor|emenda|protecao|adaptador|rj45|rj11)/.test(n)) return 'Conectivo';
  if (/(cto|caixa|nap|ceo|bastidor|dio|rack)/.test(n)) return 'Caixa';
  if (/(abracadeira|parafuso|bucha|alca|esticador|suporte|fixa fio|olhal|cinta|arruela|prego|braco|fita)/.test(n)) return 'Fixação';
  if (/(lacre|plaqueta|etiqueta|identificacao)/.test(n)) return 'Identificação';
  if (/(botina|capacete|cinto|luva|oculos|colete|talabarte|balde de lona|paraquedista|epi)/.test(n)) return 'EPI';
  if (/(alicate|clivador|fusion|power meter|opm|chave |martelo|canete|caneta laser|localizador|zumbador|kit optico|maleta|escada|trena|multimetro|lanterna|decapador)/.test(n)) return 'Ferramenta';

}

function snapsCentral() { return DB.snaps.filter(s => s.tipo === 'central').sort((a, b) => a.data.localeCompare(b.data)); }

/* consumo = soma das quedas entre posições consecutivas (entradas ignoradas) */
function consumo(k, dias) {
  const s = snapsCentral(); if (s.length < 2) return { total: 0, dia: 0, dias: 0, amostras: 0 };
  const lim = iso(new Date(Date.now() - (dias || 60) * 864e5));
  const uso = s.filter(x => x.data >= lim); if (uso.length < 2) return { total: 0, dia: 0, dias: 0, amostras: uso.length };
  let total = 0;
  for (let i = 1; i < uso.length; i++) {
    const a = uso[i - 1].itens[k], b = uso[i].itens[k];
    if (a == null || b == null) continue;
    if (b < a) total += a - b;
  }
  const span = Math.max(1, diasEntre(uso[0].data, uso[uso.length - 1].data));
  return { total, dia: total / span, dias: span, amostras: uso.length };
}
function serieDe(k, n) { return snapsCentral().slice(-(n || 12)).map(s => ({ d: s.data, q: s.itens[k] == null ? null : s.itens[k] })); }

let _cacheCentral = { chave: '', set: null };
function itensDoCentral() {
  const sn = snapsCentral();
  const chave = sn.length + '|' + (sn.length ? sn[sn.length - 1].data : '');
  if (_cacheCentral.chave !== chave) {
    const st = new Set();
    sn.forEach(x => Object.keys(x.itens).forEach(k => st.add(k)));
    _cacheCentral = { chave, set: st };
  }
  return _cacheCentral.set;
}
const soEmCampo = k => snapsCentral().length > 0 && !itensDoCentral().has(k);
const duravel = it => it.cat === 'Ferramenta' || it.cat === 'EPI';

function statusItem(it) {
  const c = consumo(it.k); const min = it.min || 0;
  const cob = c.dia > 0 ? it.qtd / c.dia : (it.qtd > 0 ? 999 : 0);
  let st = 'ok', txt = 'Normal';
  if (it.legado) { st = 'legado'; txt = 'Inativo'; }
  else if (soEmCampo(it.k)) { st = 'campo'; txt = 'Só em campo'; }
  else if (it.qtd <= 0) { st = 'crit'; txt = 'Zerado'; }
  else if (min > 0 && it.qtd <= min) { st = 'crit'; txt = 'Abaixo do mínimo'; }
  else if (min > 0 && it.qtd <= min * 1.35) { st = 'baixo'; txt = 'Perto do mínimo'; }
  else if (c.dia > 0 && cob < 7) { st = 'crit'; txt = 'Menos de 1 semana'; }
  else if (c.dia > 0 && cob < 14) { st = 'baixo'; txt = 'Menos de 2 semanas'; }
  else if (min > 0 && it.qtd > min * 6 && c.dia === 0) { st = 'parado'; txt = 'Parado'; }
  return { st, txt, cob, consumoDia: c.dia, consumo30: c.dia * 30, amostras: c.amostras };
}
const PESO = { crit: 0, baixo: 1, ok: 2, parado: 3, campo: 4, legado: 5 };

function sugerirPedido() {
  const cob = Math.max(1, +DB.cfg.cobertura || 2);
  return listaEstoque()
    /* fora do pedido: inativos, itens que so existem na carga, e duraveis sem minimo definido */
    .filter(it => it.st !== 'legado' && it.st !== 'campo' && !(duravel(it) && !(it.min > 0)))
    .map(it => {

}
function repaintEstoque() {

function tabelaEstoque(l) {

        ${temCatalogo() ? `<td style="text-align:center">${ABC[it.k] ? `<span class="tag ${({ A: 't-c', B: 't-w', C: 't-n' })[ABC[it.k]]}">${ABC[it.k]}</span>` : '—'}</td>` : ''}
        <td><span class="tag t-n">${esc(it.cat)}</span></td>
        <td class="num"><b>${fmt(it.qtd)}</b> <span style="color:var(--txt-3);font-size:11px">${esc(it.un || '')}</span></td>
        ${temCampo ? `<td class="num" style="color:${ec ? 'var(--txt)' : 'var(--txt-3)'}">${ec ? fmt(ec) : '—'}</td>` : ''}
        ${temCatalogo() ? `<td class="num">${foraDoCatalogo(it.k) ? '<span class="tag t-c">fora do catálogo</span>' : fmtR((it.qtd + ec) * precoDe(it.k))}</td>` : ''}
        <td class="num"><input type="number" value="${it.min || 0}" min="0" style="width:74px;text-align:right;padding:3px 6px"
            onchange="DB.itens['${it.k}'].min=+this.value||0;save();repaintEstoque()"></td>
        <td class="num">${it.consumo30 > 0 ? fmt(it.consumo30) : '—'}</td>

}
function exportEstoque() {

}

/* =====================================================================

let pedSel = null;

          <th class="nos" style="text-align:right">Pedir</th></tr></thead>
        <tbody>${sug.map(s => `<tr>
          <td><b>${esc(s.desc)}</b> <span class="tag ${T[s.st]}">${esc(s.txt)}</span>

          <td class="num">${fmt(s.qtd)}</td>
          <td class="num">${s.consumoDia > 0 ? fmt(Math.round(s.consumoDia * 7)) : '—'}</td>

          <td class="num"><input type="number" min="0" value="${pedSel[s.k] || 0}" style="width:80px;text-align:right;padding:3px 6px"
            onchange="pedSel['${s.k}']=Math.max(0,+this.value||0);render()"></td></tr>`).join('')}</tbody></table></div></div></div>

    <div>
      <div class="sheet" id="folha">
        <div class="sh-h">
          <div><h3>Pedido de materiais</h3>
            <div class="mono" style="font-size:11px;color:var(--txt-2);margin-top:3px">${esc(DB.cfg.unidade || '')} · semana ${semana(hoje())}</div></div>
          <div class="m">${br(hoje())}<br>${esc(DB.cfg.responsavel || '')}</div>
        </div>
        ${itens.length ? `<table><thead><tr><th style="width:34px">#</th><th>Material</th><th style="text-align:right">Temos</th><th style="text-align:right">Pedido</th></tr></thead>
        <tbody>${itens.map((s, i) => `<tr>
          <td class="mono" style="color:var(--txt-3)">${String(i + 1).padStart(2, '0')}</td>
          <td>${esc(s.desc)}${s.cod ? ` <span class="mono" style="font-size:11px;color:var(--txt-3)">${esc(s.cod)}</span>` : ''}</td>
          <td class="num" style="color:var(--txt-2)">${fmt(s.qtd)} ${esc(s.un || '')}</td>
          <td class="num qt">${fmt(pedSel[s.k])}</td></tr>`).join('')}</tbody></table>
        <div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--txt-2)">
          <span>${itens.length} itens · ${fmt(itens.reduce((a, b) => a + pedSel[b.k], 0))} peças${temCatalogo() ? ` · <b style="color:var(--txt);font-size:13px">${fmtR(itens.reduce((a, b) => a + pedSel[b.k] * precoDe(b.k), 0))}</b>` : ''}</span>
          <div class="sp" style="flex:1"></div>
          <span class="mono">gerado pelo ALMOX</span></div>`
      : '<div class="empty"><p>Nenhum item selecionado.</p></div>'}
      </div>
      <div class="row noprint" style="margin-top:12px">
        <button class="btn" onclick="copiar(textoPedido(),'Pedido copiado. Cole no WhatsApp ou no Slack.')">Copiar como texto</button>
        <button class="btn" onclick="baixar('pedido_${hoje()}.csv',csv(csvPedido()),'text/csv')">CSV</button>
        <button class="btn" onclick="window.print()">Imprimir / PDF</button>
      </div>
      <div class="card noprint" style="margin-top:14px"><div class="hd"><h3>Pedidos anteriores</h3></div>
        <div class="bd tight">${DB.pedidos.length ? DB.pedidos.map((p, i) => ({ p, i })).slice(-8).reverse().map(o => `
          <div class="row" style="padding:9px 16px;border-bottom:1px solid var(--line-2)">
            <b>${br(o.p.data)}</b><span class="tag t-n">${o.p.itens.length} itens</span>
            <div class="sp" style="flex:1"></div>
            <button class="btn xs" onclick="copiar(textoPedidoDe(${o.i}),'Pedido copiado.')">copiar</button>

          </div>`).join('') : '<div class="empty" style="padding:22px"><p>Nenhum pedido registrado ainda.</p></div>'}
      </div></div>
    </div>
  </div>`;
}
function itensPedido() { return sugerirPedido().filter(s => (pedSel && pedSel[s.k]) > 0).map(s => ({ k: s.k, desc: s.desc, cod: s.cod, un: s.un, temos: s.qtd, qtd: pedSel[s.k] })); }
function textoPedido() {
  const it = itensPedido();
  return `*PEDIDO DE MATERIAIS — ${br(hoje())}*\n${DB.cfg.unidade || ''} · semana ${semana(hoje())}\n\n`
    + it.map((s, i) => `${String(i + 1).padStart(2, '0')}. ${s.desc} — *${fmt(s.qtd)}* ${s.un || ''}  _(temos ${fmt(s.temos)})_`).join('\n')
    + `\n\n${it.length} itens · ${fmt(it.reduce((a, b) => a + b.qtd, 0))} peças${temCatalogo() ? ` · ${fmtR(it.reduce((a, b) => a + b.qtd * precoDe(b.k), 0))}` : ''}`
    + (DB.cfg.responsavel ? `\nSolicitante: ${DB.cfg.responsavel}` : '');
}
function textoPedidoDe(i) {
  const p = DB.pedidos[i]; if (!p) return '';
  return `*PEDIDO DE MATERIAIS — ${br(p.data)}*\n\n` + p.itens.map((s, n) => `${String(n + 1).padStart(2, '0')}. ${s.desc} — *${fmt(s.qtd)}* ${s.un || ''}`).join('\n');
}
function baixarPedido(i) {
  const p = DB.pedidos[i]; if (!p) return;
  baixar(`pedido_${p.data}.csv`, csv([['Material', 'Unidade', 'Pedido'], ...p.itens.map(s => [s.desc, s.un, s.qtd])]), 'text/csv');
}
function csvPedido() { return [['Código', 'Material', 'Unidade', 'Temos', 'Pedido'], ...itensPedido().map(s => [s.cod, s.desc, s.un, s.temos, s.qtd])]; }
function fecharPedido() {
  const it = itensPedido(); if (!it.length) return toast('Nenhum item com quantidade.', 'e');
  DB.pedidos.push({ id: uid(), data: hoje(), semana: semana(hoje()), itens: it });
  marcarRotina('pedido'); save(); toast(`Pedido da semana ${semana(hoje())} registrado com ${it.length} itens.`); render();
}
</script>
<script>
/* =====================================================================
   CARGA DOS TÉCNICOS
   ===================================================================== */
function kitDe(tec) {
  const t = DB.tecnicos.find(x => x.nome === tec);
  return (t && t.kit && t.kit.length) ? t.kit : DB.kit;
}
function divergencias(tec) {
  const c = DB.cargas[tec]; const kit = kitDe(tec);
  const out = [];
  kit.forEach(k => {
    const tem = c && c.itens[k.k] != null ? c.itens[k.k] : 0;
    const d = tem - k.qtd;
    if (d !== 0) out.push({ k: k.k, desc: k.desc, esperado: k.qtd, tem, dif: d, tipo: d < 0 ? 'falta' : 'sobra' });
  });
  if (c) Object.keys(c.itens).forEach(k => {
    if (!kit.find(x => x.k === k) && c.itens[k] > 0) {
      const it = DB.itens[k];
      out.push({ k, desc: it ? it.desc : k, esperado: 0, tem: c.itens[k], dif: c.itens[k], tipo: 'extra' });
    }
  });
  return out.sort((a, b) => a.dif - b.dif);
}
function vCargas() {
  const tecs = DB.tecnicos.filter(t => t.ativo !== false);
  if (!tecs.length) return `<div class="card"><div class="bd"><div class="empty"><h4>Nenhum técnico cadastrado</h4>
    <p>Importe a planilha de carga pessoal do HubSoft — os técnicos entram automaticamente.</p>
    <div class="row" style="justify-content:center"><button class="btn a" onclick="abrirImport('carga')">Importar carga</button>
    <button class="btn" onclick="novoTecnico()">Cadastrar técnico à mão</button></div></div></div></div>`;
  const conf = DB.confCarga.filter(c => c.data === hoje());
  return `
  <div class="card" style="margin-bottom:16px"><div class="hd"><h3>Kit padrão</h3>
    <span class="tag t-n">${DB.kit.length} itens</span>
    <div class="sp"></div>
    <button class="btn sm" onclick="editarKit()">Editar kit padrão</button>
    <button class="btn sm" onclick="novoTecnico()">Novo técnico</button></div>
    <div class="bd" style="padding:12px 16px">
      ${DB.kit.length ? `<div class="row" style="gap:6px">${DB.kit.map(k => `<span class="chip"><b class="mono">${fmt(k.qtd)}</b> ${esc(k.desc)}</span>`).join('')}</div>`
      : `<div style="color:var(--txt-2);font-size:13px">Sem kit padrão definido. Sem ele a conferência só mostra o que o técnico tem — defina o kit para o sistema apontar falta e sobra sozinho.</div>`}
    </div></div>
  <div class="grid g3">
    ${tecs.map(t => {
      const c = DB.cargas[t.nome], div = divergencias(t.nome);
      const falta = div.filter(d => d.tipo === 'falta'), sobra = div.filter(d => d.tipo !== 'falta');
      const serie = seriesDe(t.nome), legado = legadosDe(t.nome);
      const feito = conf.find(x => x.tec === t.nome);
      const total = c ? Object.values(c.itens).reduce((a, b) => a + b, 0) : 0;
      return `<div class="card">
        <div class="hd" style="border-left:3px solid ${t.cor}">
          <h3>${esc(t.nome)}</h3><div class="sp"></div>
          ${feito ? '<span class="tag t-ok">conferido</span>' : '<span class="tag t-n">pendente</span>'}</div>
        <div class="bd">
          <div class="row" style="gap:16px;margin-bottom:10px">
            <div><div class="fl">Peças</div><b class="mono" style="font-size:17px">${fmt(total)}</b></div>
            <div><div class="fl">Falta</div><b class="mono" style="font-size:17px;color:${falta.length ? 'var(--crit)' : 'var(--ok)'}">${falta.length}</b></div>
            <div><div class="fl">Sobra/extra</div><b class="mono" style="font-size:17px;color:${sobra.length ? 'var(--warn)' : 'var(--ok)'}">${sobra.length}</b></div>
            <div style="flex:1"></div>
            <div><div class="fl">Patrimônio</div><b class="mono" style="font-size:17px">${serie.length}</b></div>
            <div style="flex:1"></div>
            <div style="text-align:right"><div class="fl">Posição</div><span class="mono" style="font-size:12px">${c ? br(c.data) : '—'}</span></div>
          </div>
          ${legado.length ? `<div style="background:var(--crit-bg);border-radius:var(--r);padding:7px 10px;margin-bottom:8px;font-size:12.5px">
            <b style="color:var(--crit)">${legado.length} equipamento(s) inativos parados na carga</b>
            <div style="color:var(--txt-2);margin-top:2px">${esc([...new Set(legado.map(x => x.desc))].slice(0, 2).join(' · '))}</div></div>` : ''}
          ${falta.length ? `<div style="margin-bottom:8px">${falta.slice(0, 5).map(d => `<div class="row" style="gap:6px;padding:2px 0;font-size:12.5px">
            <span class="tag t-c">${fmt(d.dif)}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.desc)}</span>
            <span class="mono" style="color:var(--txt-3)">${fmt(d.tem)}/${fmt(d.esperado)}</span></div>`).join('')}
            ${falta.length > 5 ? `<div style="font-size:11.5px;color:var(--txt-2)">e mais ${falta.length - 5}</div>` : ''}</div>`
        : `<div style="font-size:12.5px;color:var(--ok);margin-bottom:8px">Carga bate com o kit padrão.</div>`}
          <div class="row">
            <button class="btn sm" onclick="verCarga('${esc(t.nome).replace(/'/g, "\\'")}')">Detalhe</button>
            <button class="btn sm ${feito ? '' : 'a'}" onclick="conferirCarga('${esc(t.nome).replace(/'/g, "\\'")}')">${feito ? 'Reconferir' : 'Marcar conferido'}</button>
            <div class="sp" style="flex:1"></div>
            <button class="btn xs" onclick="copiar(textoCarga('${esc(t.nome).replace(/'/g, "\\'")}'),'Divergências copiadas.')">copiar</button>
          </div>
        </div></div>`;
    }).join('')}
  </div>`;
}
function verCarga(tec) {
  const c = DB.cargas[tec], div = divergencias(tec), kit = kitDe(tec), serie = seriesDe(tec);
  const linhas = kit.map(k => ({ desc: k.desc, esperado: k.qtd, tem: c && c.itens[k.k] != null ? c.itens[k.k] : 0 }))
    .concat(c ? Object.keys(c.itens).filter(k => !kit.find(x => x.k === k) && c.itens[k] > 0).map(k => ({ desc: (DB.itens[k] || {}).desc || k, esperado: 0, tem: c.itens[k] })) : []);
  modal(`Carga · ${tec}`, `
    <div class="row" style="margin-bottom:12px">
      <span class="tag t-n">posição ${c ? br(c.data) : 'sem importação'}</span>
      <span class="tag ${div.filter(d => d.tipo === 'falta').length ? 't-c' : 't-ok'}">${div.filter(d => d.tipo === 'falta').length} faltando</span>
      <span class="tag ${div.filter(d => d.tipo !== 'falta').length ? 't-w' : 't-ok'}">${div.filter(d => d.tipo !== 'falta').length} a mais</span></div>
    <div class="tw" style="max-height:420px"><table>
      <thead><tr><th class="nos">Material</th><th class="nos" style="text-align:right">Kit</th><th class="nos" style="text-align:right">Tem</th><th class="nos" style="text-align:right">Diferença</th></tr></thead>
      <tbody>${linhas.length ? linhas.map(l => { const d = l.tem - l.esperado; return `<tr>
        <td>${esc(l.desc)}</td><td class="num">${fmt(l.esperado)}</td><td class="num"><b>${fmt(l.tem)}</b></td>
        <td class="num"><span class="tag ${d < 0 ? 't-c' : d > 0 ? 't-w' : 't-ok'}">${d > 0 ? '+' : ''}${fmt(d)}</span></td></tr>`; }).join('')
      : '<tr><td colspan="4"><div class="empty"><p>Sem dados de carga para este técnico.</p></div></td></tr>'}</tbody></table></div>

    `<button class="btn" onclick="copiar(textoCarga('${esc(tec).replace(/'/g, "\\'")}'),'Copiado.')">Copiar divergências</button>

function textoCarga(tec) {
  const d = divergencias(tec), f = d.filter(x => x.tipo === 'falta'), s = d.filter(x => x.tipo !== 'falta');
  if (!d.length) return `*${tec}* — carga conferida em ${br(hoje())}: tudo certo, sem divergência.`;
  return `*CARGA — ${tec}* · ${br(hoje())}\n`
    + (f.length ? `\n:red_circle: Faltando\n` + f.map(x => `• ${x.desc} — tem ${fmt(x.tem)}, deveria ter ${fmt(x.esperado)} (${fmt(x.dif)})`).join('\n') : '')
    + (s.length ? `\n\n:large_yellow_circle: A mais\n` + s.map(x => `• ${x.desc} — tem ${fmt(x.tem)} (+${fmt(x.dif)})`).join('\n') : '');
}
function conferirCarga(tec) {
  const d = divergencias(tec);
  DB.confCarga = DB.confCarga.filter(c => !(c.data === hoje() && c.tec === tec));
  DB.confCarga.push({ id: uid(), data: hoje(), tec, faltas: d.filter(x => x.tipo === 'falta').length, sobras: d.filter(x => x.tipo !== 'falta').length, div: d });
  const tecs = DB.tecnicos.filter(t => t.ativo !== false);
  if (tecs.every(t => DB.confCarga.some(c => c.data === hoje() && c.tec === t.nome))) marcarRotina('carga');
  save(); toast(`Carga de ${tec} conferida.`); render();
}

  DB.tecnicos.push({ nome, cor: corDe(nome), ativo: true }); save(); render();
}

    ${DB.kit.map((k, i) => `<tr><td>${esc(k.desc)}</td>

function tglFerr(tec, f) {
  const d = hoje(); DB.ferr.checks[d] = DB.ferr.checks[d] || {};
  DB.ferr.checks[d][tec] = DB.ferr.checks[d][tec] || {};
  DB.ferr.checks[d][tec][f] = !DB.ferr.checks[d][tec][f];
  if (!DB.ferr.checks[d][tec][f]) delete DB.ferr.checks[d][tec][f];
  save(); render();
}
function marcarTudoFerr() {
  const d = hoje(); DB.ferr.checks[d] = DB.ferr.checks[d] || {};
  DB.tecnicos.filter(t => t.ativo !== false).forEach(t => { DB.ferr.checks[d][t.nome] = {}; DB.ferr.lista.forEach(f => DB.ferr.checks[d][t.nome][f] = true); });
  marcarRotina('ferr'); save(); toast('Todos marcados. Ajuste o que estiver faltando.'); render();
}
/* extrai ferramentas e EPI da carga importada — a lista sai do proprio HubSoft */
function ferrDaCarga() {
  const nomes = new Set();
  Object.values(DB.cargas).forEach(c => Object.keys(c.itens).forEach(k => {
    const it = DB.itens[k];
    if (it && (it.cat === 'Ferramenta' || it.cat === 'EPI') && c.itens[k] > 0) nomes.add(it.desc);
  }));
  if (!nomes.size) return toast('Nenhuma ferramenta ou EPI encontrada nas cargas importadas.', 'e');
  DB.ferr.lista = [...nomes].sort();
  save(); render();
  toast(`${nomes.size} itens de ferramental e EPI trazidos da carga.`);
}

function retornoDaCarga(tec, pat) {

  setTimeout(() => {

    set('#eObs', `Patrimônio ${x.pat} — recolhido da carga de ${tec}`);

    <div class="row"><div class="f"><label class="fl">Serial</label><input id="eSerial" class="mono up" value="${g('serial')}" oninput="this.value=this.value.toUpperCase()"></div>
      <div class="f"><label class="fl">MAC</label><input id="eMac" class="mono up" value="${g('mac')}" placeholder="AA:BB:CC:DD:EE:FF" oninput="checaMac(this)">
        <div id="macAviso" style="font-size:11.5px;margin-top:3px"></div></div>
      <div class="f" id="wrapIdent"><label class="fl">Identificador próprio</label>
        <input id="eIdent" class="mono up" value="${g('ident')}" placeholder="terceiro código da etiqueta">
        <div id="identDica" style="font-size:11.5px;margin-top:3px;color:var(--txt-2)"></div></div></div>
    <div class="field"><label class="fl">Observação</label><input id="eObs" value="${g('obs')}" placeholder="estado do equipamento, avaria, sem fonte…"></div>
    <div id="eAviso"></div>`,
    `<button class="btn" onclick="salvarEquip('${id || ''}',1)">Salvar e novo</button>
     <button class="btn a" onclick="salvarEquip('${id || ''}')">Salvar</button>`, 820);
  tglIdent(); setTimeout(() => { const el = $('#eOS'); if (el && !id) el.focus(); }, 60);
}
function tglIdent() {
  const w = $('#wrapIdent'); if (!w) return;
  const intel = $('#eMarca').value === 'INTELBRAS';
  w.style.display = intel ? '' : 'none';
  const dica = $('#identDica'); if (!dica) return;
  const mac = macNorm($('#eMac') ? $('#eMac').value : '');
  if (intel && macOk(mac) && !$('#eIdent').value) {
    const p = 'ITBS' + mac.split(':').slice(2).join('');
    dica.innerHTML = `padrão observado: <b class="mono">${esc(p)}</b>
      <button class="btn xs" onclick="$('#eIdent').value='${esc(p)}';$('#identDica').innerHTML='confira na etiqueta antes de salvar'">usar</button>`;
  } else dica.innerHTML = intel ? 'terceiro código impresso na etiqueta — não é o serial nem o MAC' : '';
}
function checaMac(el) {
  const v = el.value.toUpperCase(); el.value = v;
  const a = $('#macAviso'); if (!a) return;
  if (!v.trim()) { a.innerHTML = ''; return; }
  const n = macNorm(v);
  const dup = DB.equip.find(x => x.mac && macNorm(x.mac) === n);
  if (!macOk(v)) a.innerHTML = `<span style="color:var(--crit)">MAC incompleto — precisa de 12 dígitos hexadecimais.</span>`;
  else if (dup) a.innerHTML = `<span style="color:var(--warn)">Já registrado em ${br(dup.data)}${dup.os ? ' · OS ' + esc(dup.os) : ''}.</span>`;
  else a.innerHTML = `<span style="color:var(--ok)">${n} · válido</span>`;
  tglIdent();
}
function salvarEquip(id, novo) {
  const d = {
    data: $('#eData').value || hoje(), os: $('#eOS').value.trim(), cliente: $('#eCli').value.trim(),
    tag: $('#eTag').value, tecnico: $('#eTec').value.trim().toUpperCase(), setor: $('#eSetor').value.trim(),
    tipo: $('#eTipo').value, marca: $('#eMarca').value, modelo: $('#eModelo').value.trim().toUpperCase(),
    serial: serialNorm($('#eSerial').value), mac: macNorm($('#eMac').value), ident: serialNorm($('#eIdent').value),
    obs: $('#eObs').value.trim()
  };
  if (!d.serial && !d.mac) return toast('Informe ao menos o serial ou o MAC.', 'e');
  if (d.mac && !macOk(d.mac)) return toast('MAC inválido. Confira os 12 dígitos.', 'e');
  if (d.marca === 'INTELBRAS' && !d.ident) if (!confirm('Intelbras costuma exigir o identificador próprio. Salvar mesmo assim?')) return;
  const dup = DB.equip.find(x => x.id !== id && ((d.mac && macNorm(x.mac) === d.mac) || (d.serial && serialNorm(x.serial) === d.serial)));
  if (dup && !confirm(`Já existe registro com esse serial/MAC (${br(dup.data)}). Salvar assim mesmo?`)) return;
  if (id) { Object.assign(DB.equip.find(x => x.id === id), d); toast('Registro atualizado.'); }
  else { DB.equip.push(Object.assign({ id: uid(), hubsoft: false }, d)); toast('Equipamento registrado.'); }
  marcarRotina('equip'); save();
  if (novo) { fecharModal(); novoEquip(); } else { fecharModal(); render(); }
}
function exportTrocas() {
  const l = DB.equip.slice().reverse();
  if (!l.length) return toast('Nada para exportar.', 'e');
  baixar(`trocas_retiradas_${hoje()}.csv`, csv([
    ['DATA', 'OS', 'CLIENTE', 'TECNICO', 'ORIGEM', 'TIPO', 'MARCA', 'MODELO', 'SERIAL', 'MAC', 'IDENTIFICADOR', 'SETOR', 'HUBSOFT', 'OBSERVACAO'],
    ...l.map(e => [br(e.data), e.os, e.cliente, e.tecnico, e.tag, e.tipo, e.marca, e.modelo, e.serial, e.mac, e.ident, e.setor, e.hubsoft ? 'CADASTRADO' : 'PENDENTE', e.obs])
  ]), 'text/csv');
  toast('Planilha de trocas e retiradas gerada.');
}
</script>
<script>
/* =====================================================================
   FIRMWARE
   ===================================================================== */
function vFirmware() {
  const a = DB.firm.alvos;
  if (!a.length) return `<div class="card"><div class="bd"><div class="empty"><h4>Nenhum lote de firmware</h4>
    <p>Abra um lote quando precisar subir versão em um modelo. O sistema acompanha quantos faltam e registra no relatório do dia.</p>
    <button class="btn a" onclick="novoAlvoFirm()">Abrir lote</button></div></div></div>`;
  return `<div class="grid g2">${a.map((x, i) => {

        <div class="row">

          <input type="number" id="fq${i}" placeholder="qtd" style="width:80px" onkeydown="if(event.key==='Enter')baixaFirm(${i},+this.value||0)">
          <div class="sp" style="flex:1"></div>
          <button class="btn xs dg" onclick="DB.firm.alvos.splice(${i},1);save();render()">encerrar</button></div>
        ${x.obs ? `<div style="font-size:12.5px;color:var(--txt-2);margin-top:10px">${esc(x.obs)}</div>` : ''}
      </div></div>`;
  }).join('')}</div>
  <div class="card" style="margin-top:16px"><div class="hd"><h3>Histórico</h3></div><div class="bd tight">
    ${DB.firm.log.length ? `<div class="tw" style="max-height:300px"><table><thead><tr><th class="nos">Data</th><th class="nos">Modelo</th><th class="nos">Versão</th><th class="nos" style="text-align:right">Qtd</th></tr></thead>
      <tbody>${DB.firm.log.slice().reverse().map(l => `<tr><td class="mono" style="font-size:12px">${br(l.data)}</td><td>${esc(l.modelo)}</td><td class="mono" style="font-size:12px">${esc(l.para)}</td><td class="num">${l.qtd}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty" style="padding:22px"><p>Sem atualizações registradas.</p></div>'}</div></div>`;
}
function novoAlvoFirm() {
  modal('Novo lote de firmware', `
    <div class="row"><div class="f"><label class="fl">Modelo</label><input id="fm" class="up" placeholder="ex.: ONT 121AC"></div>
      <div class="f"><label class="fl">Versão atual</label><input id="fd" class="mono" placeholder="ex.: 1.2.3"></div>
      <div class="f"><label class="fl">Versão alvo</label><input id="fp" class="mono" placeholder="ex.: 1.4.0"></div>
      <div class="f"><label class="fl">Quantidade</label><input type="number" id="ft" value="10" min="1"></div></div>
    <div class="field"><label class="fl">Observação</label><input id="fo" placeholder="onde estão os equipamentos, prazo…"></div>`,
    `<button class="btn a" onclick="salvarAlvoFirm()">Abrir lote</button>`, 720);
}
function salvarAlvoFirm() {
  const modelo = $('#fm').value.trim().toUpperCase(), para = $('#fp').value.trim(), total = +$('#ft').value || 0;
  if (!modelo || !para || !total) return toast('Preencha modelo, versão alvo e quantidade.', 'e');
  DB.firm.alvos.push({ id: uid(), modelo, de: $('#fd').value.trim(), para, total, pend: total, obs: $('#fo').value.trim(), data: hoje() });
  save(); fecharModal(); render(); toast('Lote aberto.');
}
function baixaFirm(i, q) {
  const a = DB.firm.alvos[i]; if (!a || q <= 0) return;
  const n = Math.min(q, a.pend); a.pend -= n;
  DB.firm.log.push({ data: hoje(), modelo: a.modelo, para: a.para, qtd: n });
  marcarRotina('firm'); save(); render(); toast(`${n} equipamento(s) atualizados.`);
}

/* =====================================================================
   RELATÓRIO DO DIA
   ===================================================================== */
function montarRelatorio(d) {
  const data = d || hoje();
  const conf = DB.confCarga.filter(c => c.data === data);
  const eq = DB.equip.filter(e => e.data === data);
  const fc = DB.ferr.checks[data] || {};
  const tecs = DB.tecnicos.filter(t => t.ativo !== false);
  const ferrOk = tecs.filter(t => fc[t.nome] && DB.ferr.lista.every(f => fc[t.nome][f]));
  const ferrPend = tecs.filter(t => fc[t.nome] && !DB.ferr.lista.every(f => fc[t.nome][f]));
  const ped = DB.pedidos.filter(p => p.data === data);
  const firm = DB.firm.log.filter(l => l.data === data);
  const snap = snapsCentral().find(s => s.data === data);
  const crit = listaEstoque().filter(x => x.st === 'crit');
  const extra = (DB.diario[data] || {}).notas || '';
  const L = [];
  L.push(`*RELATÓRIO DIÁRIO — ${br(data)}*`);
  L.push(`${DB.cfg.unidade || ''}${DB.cfg.responsavel ? ' · ' + DB.cfg.responsavel : ''}`);
  L.push('');
  if (snap) L.push(`:package: *Estoque central* — posição do dia importada, ${Object.keys(snap.itens).length} itens conferidos${temCatalogo() ? `, ${fmtR(valorCentral())} em estoque` : ''}.`);
  const osDia = osDe(data);
  if (osDia.length) {
    const pv = previsto(osDia), cst = Object.entries(pv).reduce((a, e) => a + e[1] * precoDe(e[0]), 0);
    L.push(`:clipboard: *Ocorrências* — ${osDia.length} OS atendidas${cst ? `, ${fmtR(cst)} de material previsto (${fmtR(cst / osDia.length)} por OS)` : ''}.`);
  }
  if (crit.length) L.push(`:red_circle: *Ruptura* — ${crit.length} item(ns) em nível crítico: ${crit.slice(0, 5).map(x => x.desc).join(', ')}${crit.length > 5 ? ` e mais ${crit.length - 5}` : ''}.`);
  if (conf.length) {
    const comFalta = conf.filter(c => c.faltas > 0);
    L.push(`:toolbox: *Carga dos técnicos* — ${conf.length} de ${tecs.length} conferidas.${comFalta.length ? ` Divergência em: ${comFalta.map(c => `${c.tec} (${c.faltas})`).join(', ')}.` : ' Todas em conformidade.'}`);
  }
  if (Object.keys(fc).length) L.push(`:wrench: *Ferramental* — ${ferrOk.length} completo(s)${ferrPend.length ? `, pendência com ${ferrPend.map(t => t.nome).join(', ')}` : ''}.`);
  if (eq.length) {
    const porTag = {}; eq.forEach(e => porTag[e.tag] = (porTag[e.tag] || 0) + 1);
    L.push(`:arrows_counterclockwise: *Troca e retirada* — ${eq.length} equipamento(s) recebidos e cadastrados (${Object.entries(porTag).map(([k, v]) => `${v} ${k.toLowerCase()}`).join(', ')}), devolvidos ao setor ${DB.cfg.setor}.`);
    const pend = eq.filter(e => !e.hubsoft).length;
    if (pend) L.push(`   ↳ ${pend} ainda aguardando cadastro no HubSoft.`);
  }
  if (ped.length) L.push(`:memo: *Pedido semanal* — enviado com ${ped[0].itens.length} itens (${fmt(ped[0].itens.reduce((a, b) => a + b.qtd, 0))} peças).`);
  if (firm.length) L.push(`:arrow_up: *Firmware* — ${firm.reduce((a, b) => a + b.qtd, 0)} equipamento(s) atualizados (${[...new Set(firm.map(f => f.modelo + ' ' + f.para))].join(', ')}).`);
  if (extra) { L.push(''); L.push(`:pushpin: *Outras atividades*`); L.push(extra); }
  L.push('');
  L.push(`_gerado automaticamente pelo ALMOX_`);
  return L.join('\n');
}
function vRelatorio() {
  const data = ($('#relData') && $('#relData').value) || hoje();
  const txt = montarRelatorio(data);
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) 320px;gap:16px">
    <div class="card"><div class="hd"><h3>Relatório</h3><div class="sp"></div>
      <input type="date" id="relData" value="${data}" style="width:150px" onchange="render()">
      <button class="btn sm" onclick="copiar(montarRelatorio($('#relData').value),'Relatório copiado.')">Copiar</button>
      <button class="btn sm" onclick="baixar('relatorio_'+$('#relData').value+'.txt',montarRelatorio($('#relData').value))">Baixar</button></div>
      <div class="bd"><div class="pre" style="max-height:none">${esc(txt)}</div></div></div>
    <div>
      <div class="card"><div class="hd"><h3>Outras atividades</h3></div><div class="bd">
        <p style="margin:0 0 8px;font-size:12.5px;color:var(--txt-2)">O que você fez além da rotina. Entra no relatório na hora.</p>
        <textarea id="relNotas" style="min-height:150px" placeholder="Ex.: organização do almoxarifado, apoio ao setor de recepção, separação de material para a equipe de expansão…">${esc((DB.diario[data] || {}).notas || '')}</textarea>
        <button class="btn a" style="margin-top:8px;width:100%" onclick="salvarNotas()">Salvar no relatório</button></div></div>
      <div class="card" style="margin-top:14px"><div class="hd"><h3>Últimos dias</h3></div><div class="bd tight">
        ${ultimosDias().map(d => `<div class="row" style="padding:8px 16px;border-bottom:1px solid var(--line-2);cursor:pointer" onclick="$('#relData').value='${d.data}';render()">
          <b style="font-size:13px">${br(d.data)}</b><div class="sp" style="flex:1"></div>
          <span class="tag t-n">${d.n} registros</span></div>`).join('') || '<div class="empty" style="padding:20px"><p>Sem histórico ainda.</p></div>'}
      </div></div>
    </div></div>`;
}
function ultimosDias() {
  const c = {};
  const add = d => { if (d) c[d] = (c[d] || 0) + 1; };
  DB.equip.forEach(e => add(e.data)); DB.confCarga.forEach(e => add(e.data));
  DB.pedidos.forEach(e => add(e.data)); snapsCentral().forEach(e => add(e.data));
  Object.keys(DB.ferr.checks).forEach(add);
  return Object.entries(c).map(([data, n]) => ({ data, n })).sort((a, b) => b.data.localeCompare(a.data)).slice(0, 10);
}
function salvarNotas() {
  const data = $('#relData').value || hoje();
  DB.diario[data] = DB.diario[data] || {};
  DB.diario[data].notas = $('#relNotas').value;
  marcarRotina('rel', data); save(); render(); toast('Relatório atualizado.');
}
function copiarRelatorio() { const d = ($('#relData') && $('#relData').value) || hoje(); marcarRotina('rel', d); save(); copiar(montarRelatorio(d), 'Relatório copiado. Cole no Slack.'); }

/* =====================================================================
   AJUSTES E DADOS
   ===================================================================== */
function vAjustes() {
  return `<div class="grid g2">
    <div class="card"><div class="hd"><h3>Identificação</h3></div><div class="bd">
      <div class="field"><label class="fl">Unidade</label><input id="cUn" value="${esc(DB.cfg.unidade)}" onchange="DB.cfg.unidade=this.value;save();render()"></div>
      <div class="field"><label class="fl">Responsável</label><input id="cResp" value="${esc(DB.cfg.responsavel)}" placeholder="seu nome, sai no pedido e no relatório" onchange="DB.cfg.responsavel=this.value;save()"></div>
      <div class="field"><label class="fl">Setor de retorno dos equipamentos</label><input id="cSetor" value="${esc(DB.cfg.setor)}" onchange="DB.cfg.setor=this.value;save()"></div>
      <div class="field"><label class="fl">Canal do Slack</label><input id="cCanal" value="${esc(DB.cfg.canal)}" onchange="DB.cfg.canal=this.value;save()"></div>
    </div></div>
    <div class="card"><div class="hd"><h3>Técnicos</h3><div class="sp"></div><button class="btn sm" onclick="novoTecnico()">Novo</button></div>
      <div class="bd tight">${DB.tecnicos.length ? DB.tecnicos.map((t, i) => `
        <div class="row" style="padding:8px 16px;border-bottom:1px solid var(--line-2)">
          <input type="color" value="${t.cor}" style="width:30px;height:24px;padding:0;border:1px solid var(--line)" onchange="DB.tecnicos[${i}].cor=this.value;save();render()">
          <b style="flex:1">${esc(t.nome)}</b>
          <label style="font-size:12px;display:flex;align-items:center;gap:5px"><input type="checkbox" ${t.ativo !== false ? 'checked' : ''} onchange="DB.tecnicos[${i}].ativo=this.checked;save();render()" style="width:auto">ativo</label>
          <button class="btn xs dg" onclick="if(confirm('Remover ${esc(t.nome)}?')){DB.tecnicos.splice(${i},1);save();render()}">remover</button>
        </div>`).join('') : '<div class="empty" style="padding:22px"><p>Nenhum técnico.</p></div>'}</div></div>
    <div class="card"><div class="hd"><h3>Dados</h3></div><div class="bd">
      <p style="margin:0 0 12px;font-size:13px;color:var(--txt-2)">
        Tudo fica gravado neste navegador${Store.ok ? '' : ' — <b style="color:var(--crit)">exceto agora: a gravação está bloqueada, exporte um backup antes de fechar</b>'}.
        Faça backup toda semana e guarde o arquivo no Drive.</p>
      <div class="row">
        <button class="btn" onclick="backup()">Baixar backup</button>
        <button class="btn" onclick="restaurar()">Restaurar backup</button>
        <button class="btn" onclick="exportTudo()">Exportar tudo em CSV</button>
        <button class="btn dg" onclick="zerar()">Apagar tudo</button></div>
      <div class="row" style="margin-top:14px;font-size:12.5px;color:var(--txt-2);gap:16px">
        <span>${Object.keys(DB.itens).length} itens</span><span>${snapsCentral().length} posições</span>
        <span>${DB.equip.length} equipamentos</span><span>${DB.pedidos.length} pedidos</span>
        <span>${DB.confCarga.length} conferências</span></div>
    </div></div>
    <div class="card"><div class="hd"><h3>Atalhos do teclado</h3></div><div class="bd">
      <div class="row" style="gap:20px;font-size:13px">
        <div><b class="mono">1…9</b><div style="color:var(--txt-2)">trocar de tela</div></div>
        <div><b class="mono">i</b><div style="color:var(--txt-2)">importar planilha</div></div>
        <div><b class="mono">n</b><div style="color:var(--txt-2)">novo equipamento</div></div>
        <div><b class="mono">r</b><div style="color:var(--txt-2)">relatório do dia</div></div>
        <div><b class="mono">Esc</b><div style="color:var(--txt-2)">fechar janela</div></div>
      </div>
      <p style="margin:14px 0 0;font-size:12.5px;color:var(--txt-2)">Os atalhos ficam desligados enquanto você digita em um campo.</p>
    </div></div>
  </div>`;
}
function backup() {
  baixar(`almox_backup_${hoje()}.json`, JSON.stringify(DB, null, 1), 'application/json');
  toast('Backup gerado. Guarde no Drive.');
}
function restaurar() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
  i.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!d || typeof d !== 'object' || !('itens' in d)) throw new Error('Arquivo não é um backup do ALMOX.');
        if (!confirm('Isso substitui todos os dados atuais. Continuar?')) return;
        DB = Object.assign(VAZIO(), d); save(); render(); toast('Backup restaurado.');
      } catch (x) { toast(x.message, 'e'); }
    };
    r.readAsText(f);
  };
  i.click();
}
function exportTudo() {
  exportEstoque();
  if (DB.equip.length) setTimeout(exportTrocas, 400);
  if (DB.confCarga.length) setTimeout(() => baixar(`conferencias_${hoje()}.csv`, csv([['Data', 'Técnico', 'Faltas', 'Sobras'],
  ...DB.confCarga.map(c => [br(c.data), c.tec, c.faltas, c.sobras])]), 'text/csv'), 800);
}
function zerar() {
  if (!confirm('Apagar TODOS os dados do ALMOX neste navegador? Baixe um backup antes.')) return;
  if (!confirm('Confirma? Não dá para desfazer.')) return;
  DB = VAZIO(); save(); render(); toast('Tudo apagado.');
}

<script>

const fmtR = v => 'R$ ' + (Math.round(v * 100) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtRk = v => v >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : fmtR(v);

const temCatalogo = () => Object.keys(DB.catalogo).length > 0;
const foraDoCatalogo = k => temCatalogo() && !DB.catalogo[k];
const valorCentral = () => Object.values(DB.itens).reduce((a, i) => a + i.qtd * precoDe(i.k), 0);
const valorCampo = () => Object.values(DB.cargas).reduce((a, c) => a + Object.entries(c.itens).reduce((x, e) => x + e[1] * precoDe(e[0]), 0), 0);

/* =====================================================================
   CURVA ABC — onde o dinheiro realmente esta
   Classifica por valor de giro (consumo x preco); sem historico, por capital parado.
   ===================================================================== */
let _abc = { chave: '', mapa: {}, resumo: null };
function abcMapa() {
  const chave = Object.keys(DB.itens).length + '|' + DB.snaps.length + '|' + Object.keys(DB.catalogo).length;
  if (_abc.chave === chave) return _abc.mapa;
  const base = Object.values(DB.itens).map(i => {
    const cm = consumo(i.k).dia * 30, p = precoDe(i.k);
    return { k: i.k, giro: cm > 0, v: p * (cm > 0 ? cm : (i.qtd + emCampo(i.k))) };
  }).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const tot = base.reduce((a, b) => a + b.v, 0) || 1;
  const mapa = {}, res = { A: { n: 0, v: 0 }, B: { n: 0, v: 0 }, C: { n: 0, v: 0 }, tot };
  let ac = 0;
  base.forEach(x => {
    ac += x.v;
    const c = ac <= tot * .8 ? 'A' : (ac <= tot * .95 ? 'B' : 'C');
    mapa[x.k] = c; res[c].n++; res[c].v += x.v;

}

function gravarOS(linhas, m, dataPadrao) {

const osDe = d => DB.os.filter(x => x.data === d);

function ultimaDataOS() { return DB.os.length ? DB.os[DB.os.length - 1].data : ''; }

function posicoes() {

    const p = por[s.data] = por[s.data] || { data: s.data, itens: {}, central: false, cargas: 0 };

/* consumo real da operação entre duas posições consecutivas */
function consumoEntre(dIni, dFim) {
  const ps = posicoes();
  const a = ps.filter(p => p.data <= dIni).pop(), b = ps.filter(p => p.data <= dFim).pop();
  if (!a || !b || a.data === b.data) return null;
  const out = {};
  Object.keys(a.itens).forEach(k => { const d = a.itens[k] - (b.itens[k] == null ? a.itens[k] : b.itens[k]); if (d > 0) out[k] = d; });

}
/* consumo previsto = soma das cestas das OS do período */
function previsto(lista) {
