  </div>

  <div class="card" style="margin-bottom:16px"><div class="hd">
    <h3>Ocorrências com troca</h3>
    ${selosPonte()}
    <div class="sp"></div>
    <label class="fl" style="margin:0">Período</label>
    <select style="width:130px" onchange="DB.cfg.janelaOS=+this.value;save();render()">
      ${[3, 7, 15, 30, 60, 90].map(n => `<option value="${n}" ${dias === n ? 'selected' : ''}>${n} dias</option>`).join('')}
    </select>
    <button class="btn sm" onclick="checarPonte()">Testar ponte</button>
    <button class="btn sm" onclick="configPonte()">Configurar</button>
    <button class="btn sm a" onclick="abrirImport('os')">Importar ocorrências</button></div>
    <div class="bd tight">
      ${DB.os.length ? (trocas.length ? `
        <div class="row" style="padding:10px 16px;border-bottom:1px solid var(--line-2);gap:14px;font-size:12.5px;color:var(--txt-2)">
          <span><b style="color:var(--txt)">${trocas.length}</b> ocorrências com troca ou retirada</span>
          <span><b style="color:${semCadastro.length ? 'var(--crit)' : 'var(--ok)'}">${semCadastro.length}</b> ainda sem equipamento cadastrado</span>
          <div class="sp" style="flex:1"></div>
          <button class="btn xs" onclick="copiar(textoTrocasPendentes(),'Lista copiada.')">copiar pendentes</button>
          <button class="btn xs" onclick="baixar('trocas_sem_cadastro_${hoje()}.csv',csv([['Data','OS','Cliente','Técnico','Tipo'],...osPendentes().map(o=>[br(o.data),o.os,o.cliente,tecOS(o),o.tipo])]),'text/csv')">csv</button>
        </div>
        <div class="tw" style="max-height:420px"><table>
          <thead><tr><th class="nos">Data</th><th class="nos">OS</th><th class="nos">Cliente</th>
            <th class="nos">Técnico</th><th class="nos">Tipo de serviço</th><th class="nos">Equipamento</th><th class="nos"></th></tr></thead>
          <tbody>${trocas.slice(0, 200).map(o => {
            const eq = equipDaOS(o.os);
            return `<tr style="${eq.length ? '' : 'background:rgba(255,74,61,.05)'}">
              <td class="mono" style="font-size:12px">${br(o.data)}</td>
              <td class="mono"><b>${esc(o.os)}</b></td>
              <td>${esc(o.cliente || '—')}</td>
              <td style="font-size:12.5px">${esc(tecOS(o) || '—')}</td>
              <td style="font-size:12.5px">${esc(o.tipo || '—')}</td>
              <td>${eq.length ? `<span class="tag t-ok">${eq.length} cadastrado(s)</span>
                    <div class="mono" style="font-size:11px;color:var(--txt-3)">${esc(eq.map(x => x.mac || x.serial).filter(Boolean).join(' · '))}</div>`
                : '<span class="tag t-c">sem cadastro</span>'}</td>
              <td style="text-align:right;white-space:nowrap">
                ${eq.length ? '' : `<button class="btn xs a" onclick="cadastrarDaOS('${esc(String(o.os))}')">cadastrar</button>`}
                <button class="btn xs" onclick="fotosDaOS('${esc(String(o.os))}')">fotos</button></td></tr>`;
          }).join('')}</tbody></table></div>`
      : `<div class="empty" style="padding:26px"><p>Nenhuma ocorrência de troca ou retirada nos últimos ${dias} dias.<br>
          <span style="font-size:12px">O sistema procura por troca, substituição, retirada, recolhimento, devolução e cancelamento no tipo de serviço.</span></p></div>`)
      : `<div class="empty">
          <h4>Importe a lista de ocorrências</h4>
          <p>Com as OS do período, o sistema separa as que tiveram troca ou retirada e mostra<br>
             quais ainda não têm equipamento cadastrado — a lista do que falta fazer.</p>
          <button class="btn a" onclick="abrirImport('os')">Importar ocorrências</button></div>`}
    </div></div>

  ${leg.length ? `<div class="card" style="margin-bottom:16px;border-left:3px solid var(--f-vermelho)">
    <div class="hd"><h3>Equipamentos inativos parados na carga</h3>
      <span class="tag t-c">${leg.length} patrimônios</span><div class="sp"></div>
      <button class="btn sm" onclick="copiar(textoLegados(),'Lista copiada.')">Copiar lista</button></div>
    <div class="bd" style="padding:12px 16px">
      ${Object.entries(leg.reduce((a, x) => { (a[x.tec] = a[x.tec] || []).push(x); return a; }, {})).map(([t, l]) => `
        <div class="row" style="padding:6px 0;border-top:1px solid var(--line-2)">
          <b style="min-width:150px">${esc(t)}</b><span class="tag t-c">${l.length}</span>
          <span style="flex:1;min-width:0;font-size:12.5px;color:var(--txt-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc([...new Set(l.map(x => x.desc))].join(' · '))}</span>
          <button class="btn xs" onclick="verCarga('${esc(t).replace(/'/g, "\\'")}')">ver</button></div>`).join('')}
    </div></div>` : ''}

  <div class="card"><div class="hd"><h3>Registros</h3>
    <input type="search" id="qeq" placeholder="Buscar serial, MAC, OS, cliente…" style="max-width:280px" oninput="fEq=this.value;repaintEquip()" value="${esc(fEq)}">
    <div class="sp"></div>
    <button class="btn sm" onclick="novoEquip()">Novo cadastro</button></div>
    <div class="bd tight" id="tbEq">${tabelaEquip()}</div></div>`;
}
function cadastrarDaOS(num) {
  const o = DB.os.find(x => String(x.os) === String(num));
  novoEquip();
  setTimeout(() => {
    const set = (id, v) => { const e = $(id); if (e && v) e.value = v; };
    if (!o) return;
    set('#eOS', o.os); set('#eCli', o.cliente); set('#eTec', tecOS(o)); set('#eData', o.data);
    if ($('#eTag')) $('#eTag').value = /cancelament/i.test(o.tipo || '') ? 'RETORNO DE CANCELAMENTO' : 'RETORNO DE TROCA';
    const s = $('#eSerial'); if (s) s.focus();
  }, 80);
}
function textoTrocasPendentes() {
  const l = osPendentes();
  if (!l.length) return `Todas as ocorrências de troca do período já têm equipamento cadastrado.`;
  return `*TROCAS SEM EQUIPAMENTO CADASTRADO* — últimos ${+DB.cfg.janelaOS || 7} dias\n\n`
    + l.map(o => `• ${br(o.data)} · OS ${o.os} · ${o.cliente || 'sem cliente'}${tecOS(o) ? ' · ' + tecOS(o) : ''}`).join('\n')
    + `\n\n${l.length} pendente(s) de ${osComTroca().length} ocorrências com troca.`;
}
function configPonte() {
  modal('Ponte com o HubSoft', `
    <div class="field"><label class="fl">Endereço da ponte</label>
      <input id="phUrl" class="mono" value="${esc(DB.cfg.ponteHub)}" placeholder="http://localhost:8765"></div>
    <div class="row" style="gap:16px;margin-bottom:12px">
      <div><div class="fl">Situação</div><div style="margin-top:4px">${selosPonte()}</div></div>
      ${PONTE.checado ? `<div><div class="fl">Última verificação</div>
        <div class="mono" style="font-size:12px;margin-top:4px">${PONTE.checado.toTimeString().slice(0, 8)}</div></div>` : ''}
      ${PONTE.consultadas ? `<div><div class="fl">OS consultadas</div>
        <div class="mono" style="font-size:12px;margin-top:4px">${PONTE.consultadas}</div></div>` : ''}
    </div>
    <div style="background:var(--ink-2);border:1px solid var(--line);padding:12px 14px;font-size:13px;line-height:1.7">
      <b>Como ligar</b><br>
      1. Duplo clique no <span class="mono">Central.bat</span>, na pasta da ponte.<br>
      2. Espere aparecer <span class="mono">Conectado. A ponte está no ar.</span><br>
      3. Volte aqui e clique em <b>Testar ponte</b>.
      <br><br>
      <b style="color:var(--warn)">A ponte só funciona com o ALMOX aberto do computador</b> (duplo clique no arquivo).
      Se você abrir por um endereço https, o navegador bloqueia a conversa com o <span class="mono">localhost</span> e nada chega.
      <br><br>
      Antes de cadastrar de verdade, rode o <span class="mono">Ensaio.bat</span>: ele preenche as telas e para
      antes de confirmar, sem mexer no estoque.
    </div>`,
    `<button class="btn" onclick="DB.cfg.ponteHub=$('#phUrl').value.trim();save();checarPonte()">Salvar e testar</button>
     <button class="btn a" onclick="fecharModal()">Fechar</button>`, 660);
}

/* botão de envio pela ponte na tabela de registros */
function tabelaEquip() {
  const q = fEq.toLowerCase();
  const l = DB.equip.filter(e => !q || JSON.stringify(e).toLowerCase().includes(q)).slice().reverse();
  if (!l.length) return `<div class="empty"><h4>Nenhum equipamento registrado</h4>
    <p>Cadastre aqui o que volta de troca e retirada. O sistema valida MAC, avisa duplicidade, acompanha a esteira até o envio e monta a linha da planilha.</p>
    <button class="btn a" onclick="novoEquip()">Novo cadastro</button></div>`;
  return `<div class="tw"><table><thead><tr>
    <th class="nos">Data</th><th class="nos">OS / Cliente</th><th class="nos">Equipamento</th><th class="nos">Serial</th>
    <th class="nos">MAC</th><th class="nos">Origem</th><th class="nos">Etapa</th><th class="nos"></th></tr></thead>
    <tbody>${l.map(e => { const et = etapaDe(e), i = ETAPAS.indexOf(et);
      return `<tr>
      <td class="mono" style="font-size:12px">${br(e.data)}</td>
      <td><b>${esc(e.os || '—')}</b>${e.cliente ? `<div style="font-size:11.5px;color:var(--txt-2)">${esc(e.cliente)}</div>`
        : '<div style="font-size:11.5px;color:var(--crit)">sem cliente de origem</div>'}</td>
      <td>${esc(e.marca || '')} ${esc(e.modelo || '')}<div style="font-size:11.5px;color:var(--txt-2)">${esc(e.tipo || '')}
        ${e.ponte ? `<span class="tag t-ok" style="margin-left:4px">${e.ponte.ensaio ? 'ensaio' : 'via ponte'}</span>` : ''}</div></td>
      <td class="mono" style="font-size:12px">${esc(e.serial || '—')}</td>
      <td class="mono" style="font-size:12px;${e.mac && !macOk(e.mac) ? 'color:var(--crit)' : ''}">${esc(e.mac || '—')}</td>
      <td><span class="tag t-i">${esc((e.tag || '').replace('RETORNO ', ''))}</span></td>
      <td style="white-space:nowrap">
        <button class="btn xs" onclick="avancarEtapa('${e.id}',-1)" ${i === 0 ? 'disabled' : ''}>‹</button>
        <span class="tag ${ETAPA_COR[et]}" style="min-width:88px;justify-content:center">${et}</span>
        <button class="btn xs" onclick="avancarEtapa('${e.id}',1)" ${i === ETAPAS.length - 1 ? 'disabled' : ''}>›</button></td>
      <td style="text-align:right;white-space:nowrap">
        ${e.hubsoft ? '' : `<button class="btn xs a" onclick="enviarPelaPonte('${e.id}')" title="cadastrar no HubSoft pela ponte">ponte</button>`}
        <button class="btn xs" onclick="novoEquip('${e.id}')">editar</button>
        <button class="btn xs dg" onclick="delEquip('${e.id}')">excluir</button></td></tr>`;
    }).join('')}</tbody></table></div>`;
}
Object.assign(VFN, { equip: vEquip });
setTimeout(() => checarPonte(true), 1200);
render();
</script>
<script>
/* =====================================================================
   CAMADA 15 — relatório completo
   Três formatos: o seu texto corrido, o de indicadores e o completo,
   que detalha item por item o que passou pelo almoxarifado no dia.
   ===================================================================== */
function montarRelatorio(d) {
  const data = d || hoje();
  const f = DB.cfg.relFormato;
  if (f === 'gestao') return relatorioGestao(data);
  if (f === 'completo') return relatorioCompleto(data);
  const l = linhasRelatorio(data);
  return `RELATÓRIO DIÁRIO - ${br(data)} ${(DB.cfg.responsavel || '').toUpperCase()}`.trim()
    + '\n' + (l.length ? l.join('\n') : 'SEM ATIVIDADES REGISTRADAS');
}

function relatorioCompleto(data) {
  const L = [], sep = '─'.repeat(58);
  const tecs = DB.tecnicos.filter(t => t.ativo !== false);
  const est = listaEstoque(), crit = est.filter(x => x.st === 'crit'), baixo = est.filter(x => x.st === 'baixo');
  const conf = DB.confCarga.filter(c => c.data === data);
  const fc = DB.ferr.checks[data] || {};
  const eq = DB.equip.filter(e => e.data === data);
  const snap = snapsCentral().find(s => s.data === data);
  const ped = DB.pedidos.filter(p => p.data === data);
  const firm = DB.firm.log.filter(x => x.data === data);
  const cxs = DB.caixas.filter(c => c.fechadaEm === data || c.enviadaEm === data);
  const reqs = (DB.reqs || []).filter(r => String(r.criado_em).slice(0, 10) === data);
  const saidas = (DB.saidas || []).filter(s => s.data === data);
  const osDia = DB.os.filter(o => o.data === data);
  const leg = todosLegados();
  const $$c = temCatalogo();
  const cab = t => { L.push(''); L.push(t.toUpperCase()); L.push(sep); };

  L.push('═'.repeat(58));
  L.push(`RELATÓRIO DIÁRIO — ${br(data)}`);
  L.push(`${DB.cfg.unidade || ''}${DB.cfg.responsavel ? '  ·  ' + DB.cfg.responsavel : ''}`);
  L.push(`Remetente: ${DB.cfg.remetente || 'ESTOQUE PINHAIS'}`);
  L.push('═'.repeat(58));

  /* 1 — atividades, do jeito que você reporta */
  cab('1. Atividades executadas');
  const ativ = linhasRelatorio(data);
  if (ativ.length) ativ.forEach((x, i) => L.push(`${String(i + 1).padStart(2, '0')}. ${x}`));
  else L.push('Nenhuma atividade registrada.');

  /* 2 — posição do estoque */
  cab('2. Posição do estoque');
  if (snap) {
    L.push(`Posição importada: ${Object.keys(snap.itens).length} itens · ${fmt(Object.values(snap.itens).reduce((a, b) => a + b, 0))} peças`);
  } else L.push('Posição do dia não importada.');
  if ($$c) {
    L.push(`Capital no almoxarifado : ${fmtR(valorCentral())}`);
    L.push(`Capital na carga        : ${fmtR(valorCampo())}`);
    L.push(`Total sob controle      : ${fmtR(valorTotal())}`);
    const r = abcResumo();
    if (r) L.push(`Curva ABC: ${r.A.n} itens classe A concentram ${Math.round(r.A.v / r.tot * 100)}% do valor`);
  }
  L.push(`Itens em ruptura: ${crit.length}   ·   em atenção: ${baixo.length}`);
  if (crit.length) {
    L.push('');
    L.push('Itens críticos:');
    crit.slice(0, 15).forEach(x => L.push(`  · ${x.desc} — saldo ${fmt(x.qtd)} ${x.un || ''}${x.min ? `, mínimo ${fmt(x.min)}` : ''} (${x.txt})`));
    if (crit.length > 15) L.push(`  · e mais ${crit.length - 15} itens`);
  }

  /* 3 — carga dos técnicos */
  cab('3. Carga dos técnicos');
  if (conf.length) {
    L.push(`Conferidas: ${conf.length} de ${tecs.length}`);
    conf.forEach(c => {
      L.push(`  ${c.tec}: ${c.faltas ? `${c.faltas} falta(s)` : 'sem falta'}${c.sobras ? `, ${c.sobras} a mais` : ''}`);
      (c.div || []).filter(d => d.tipo === 'falta').slice(0, 8).forEach(d =>
        L.push(`     - ${d.desc}: tem ${fmt(d.tem)}, deveria ter ${fmt(d.esperado)}`));
    });
  } else L.push('Nenhuma carga conferida neste dia.');
  if (leg.length) {
    L.push('');
    L.push(`Equipamentos inativos parados em carga: ${leg.length}`);
    Object.entries(leg.reduce((a, x) => { (a[x.tec] = a[x.tec] || []).push(x); return a; }, {}))
      .forEach(([t, l]) => L.push(`  ${t}: ${l.length} patrimônio(s) — ${[...new Set(l.map(x => x.desc))].slice(0, 3).join(', ')}`));
  }

  /* 4 — ferramental */
  cab('4. Ferramental');
  if (Object.keys(fc).length) {
    tecs.forEach(t => {
      const c = fc[t.nome];
      if (!c) { L.push(`  ${t.nome}: sem conferência`); return; }
      const falta = DB.ferr.lista.filter(x => !c[x]);
      L.push(`  ${t.nome}: ${falta.length ? 'FALTA ' + falta.join(', ').toUpperCase() : 'completo'}`);
    });
  } else L.push('Ferramental não conferido neste dia.');

  /* 5 — troca e retirada, item por item */
  cab('5. Equipamentos de troca e retirada');
  if (eq.length) {
    L.push(`Recebidos e cadastrados: ${eq.length}`);
    L.push('');
    eq.forEach((e, i) => {
      L.push(`${String(i + 1).padStart(2, '0')}. ${[e.marca, e.modelo].filter(Boolean).join(' ') || e.tipo}`);
      L.push(`    OS ${e.os || '—'} · ${e.cliente || 'cliente não informado'}${e.tecnico ? ' · téc. ' + e.tecnico : ''}`);
      L.push(`    serial ${e.serial || '—'}   MAC ${e.mac || '—'}${e.ident ? '   ident. ' + e.ident : ''}`);
      L.push(`    ${e.tag || ''} · etapa ${etapaDe(e)}${e.hubsoft ? ' · cadastrado no HubSoft' : ' · AGUARDANDO CADASTRO'}${e.obs ? ' · ' + e.obs : ''}`);
    });
    const pend = eq.filter(e => !e.hubsoft).length;
    if (pend) { L.push(''); L.push(`${pend} ainda aguardando cadastro no HubSoft.`); }
  } else L.push('Nenhum equipamento recebido neste dia.');
  const emAberto = equipEmAberto();
  if (emAberto.length) {
    L.push('');
    L.push(`Em processamento (todas as datas): ${emAberto.length}`);
    ETAPAS.forEach(x => { const n = emAberto.filter(y => etapaDe(y) === x).length; if (n) L.push(`  ${x}: ${n}`); });
  }

  /* 6 — ocorrências */
  cab('6. Ocorrências');
  if (osDia.length) {
    const trocas = osDia.filter(ehTroca);
    L.push(`OS registradas no dia: ${osDia.length}   ·   com troca ou retirada: ${trocas.length}`);
    const porTipo = osDia.reduce((a, o) => { const t = o.tipo || 'sem tipo'; a[t] = (a[t] || 0) + 1; return a; }, {});
    Object.entries(porTipo).sort((a, b) => b[1] - a[1]).forEach(([t, n]) => L.push(`  ${t}: ${n}`));
    const semCad = trocas.filter(o => !equipDaOS(o.os).length);
    if (semCad.length) {
      L.push('');
      L.push(`Trocas sem equipamento cadastrado: ${semCad.length}`);
      semCad.slice(0, 12).forEach(o => L.push(`  · OS ${o.os} — ${o.cliente || 'sem cliente'}${tecOS(o) ? ' · ' + tecOS(o) : ''}`));
    }
  } else L.push('Nenhuma ocorrência importada para este dia.');
  const p = padraoPorOS();
  if (p.custoOS) L.push(`Custo médio de material por atendimento: ${fmtR(p.custoOS)} (medido em ${p.totOS} OS)`);

  /* 7 — pedidos dos técnicos */
  if (reqs.length || saidas.length) {
    cab('7. Atendimento aos técnicos');
    if (reqs.length) {
      L.push(`Pedidos recebidos pelo aplicativo: ${reqs.length}`);
      reqs.forEach(r => L.push(`  · ${r.id} · ${r.tecnico} · ${r.itens.length} itens · ${ST_TXT[r.status] || r.status}`));
    }
    if (saidas.length) {
      L.push('');
      L.push(`Fichas de saída emitidas: ${saidas.length}`);
      saidas.forEach(s => {
        L.push(`  Ficha ${s.req} · ${s.tec} · ${s.hora}`);
        s.itens.forEach(i => L.push(`     ${fmt(i.qtd)} ${i.un || ''} — ${i.desc}`));
      });
    }
  }

  /* 8 — envios à matriz */
  if (cxs.length) {
    cab('8. Envios à matriz');
    cxs.forEach(c => {
      L.push(`Caixa ${c.num} · ${c.tipo} · ${c.status}${c.enviadaEm ? ' em ' + br(c.enviadaEm) : ''}`);
      L.push(`  destino ${c.destino} · ${c.itens.length} itens · ${totalPecas(c)} peças`);
      c.itens.slice(0, 20).forEach((i, n) => L.push(`   ${String(n + 1).padStart(2, '0')}. ${nomeItem(i)} — ${rotuloItem(i) || '—'}`));
      if (c.itens.length > 20) L.push(`   e mais ${c.itens.length - 20} itens`);
      if (c.obs) L.push(`  obs.: ${c.obs}`);
    });
  }

  /* 9 — reposição e firmware */
  if (ped.length || firm.length) {
    cab('9. Reposição e firmware');
    ped.forEach(x => {
      L.push(`Pedido semanal ${x.semana || ''}: ${x.itens.length} itens · ${fmt(x.itens.reduce((a, b) => a + b.qtd, 0))} peças`);
      x.itens.slice(0, 20).forEach(i => L.push(`  · ${i.desc} — ${fmt(i.qtd)} ${i.un || ''} (temos ${fmt(i.temos)})`));
      if (x.itens.length > 20) L.push(`  e mais ${x.itens.length - 20} itens`);
    });
    firm.forEach(x => L.push(`Firmware: ${x.qtd} × ${x.modelo} para a versão ${x.para}`));
  }

  /* 10 — pendências para amanhã */
  cab('10. Pendências');
  const pend = [];
  if (crit.length) pend.push(`${crit.length} item(ns) em ruptura`);
  const semConf = tecs.filter(t => !conf.some(c => c.tec === t.nome));
  if (semConf.length) pend.push(`carga não conferida: ${semConf.map(t => t.nome).join(', ')}`);
  const semFerr = DB.ferr.lista.length ? tecs.filter(t => !fc[t.nome]) : [];
  if (semFerr.length) pend.push(`ferramental não conferido: ${semFerr.map(t => t.nome).join(', ')}`);
  const eqPend = DB.equip.filter(e => !e.hubsoft).length;
  if (eqPend) pend.push(`${eqPend} equipamento(s) aguardando cadastro no HubSoft`);
  const trocasPend = osPendentes(30).length;
  if (trocasPend) pend.push(`${trocasPend} troca(s) dos últimos 30 dias sem equipamento cadastrado`);
  if (leg.length) pend.push(`${leg.length} patrimônio(s) inativos a recolher`);
  const cxAbertas = DB.caixas.filter(c => c.status === 'FECHADA').length;
  if (cxAbertas) pend.push(`${cxAbertas} caixa(s) fechada(s) aguardando envio`);
  const reqPend = (DB.reqs || []).filter(r => r.status === 'PENDENTE').length;
  if (reqPend) pend.push(`${reqPend} pedido(s) de técnico aguardando separação`);
  if (pend.length) pend.forEach(x => L.push(`  ! ${x}`));
  else L.push('  Nenhuma pendência em aberto.');

  L.push('');
  L.push(sep);
  L.push(`Gerado pelo ALMOX em ${br(hoje())} às ${new Date().toTimeString().slice(0, 5)}`);
  return L.join('\n');
}

/* seletor de formato com a terceira opção */
function vRelatorio() {
  const data = ($('#relData') && $('#relData').value) || hoje();
  const txt = montarRelatorio(data), feitas = new Set(feitasDe(data));
  const ts = tarefas(), f = DB.cfg.relFormato || 'texto';
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) 360px;gap:16px">
    <div>
      <div class="card"><div class="hd"><h3>Relatório</h3>
        <input type="date" id="relData" value="${data}" style="width:148px" onchange="render()">
        <div class="sp"></div>
        <div class="row" style="gap:5px">
          <span class="chip ${f === 'texto' ? 'on' : ''}" onclick="trocarFormato('texto')">Seu formato</span>
          <span class="chip ${f === 'gestao' ? 'on' : ''}" onclick="trocarFormato('gestao')">Indicadores</span>
          <span class="chip ${f === 'completo' ? 'on' : ''}" onclick="trocarFormato('completo')">Completo</span></div>
        <button class="btn sm" onclick="copiarRelatorio()">Copiar</button>
        <button class="btn sm" onclick="baixar('relatorio_'+$('#relData').value+'.txt',montarRelatorio($('#relData').value))">Baixar</button></div>
        <div class="bd"><div class="pre" style="max-height:none;font-size:${f === 'completo' ? '12' : '13'}px;line-height:1.65">${esc(txt)}</div></div></div>

      <div class="card" style="margin-top:16px"><div class="hd"><h3>Atividades do dia</h3>
        <span class="tag t-a">${linhasRelatorio(data).length} linhas</span><div class="sp"></div>
        <button class="btn sm" onclick="editarTarefas()">Editar lista</button></div>
        <div class="bd" style="padding:0">
          ${ts.map(t => {
            const ev = t.auto ? evidencia(t.auto, data) : null;
            const on = !!ev || feitas.has(t.id);
            return `<div class="step ${on ? 'done' : ''}" style="padding:8px 12px">
              <div class="bx ${on ? 'on' : ''}" ${ev ? 'title="marcado pelo sistema"' : `onclick="tglTarefa('${t.id}')" role="checkbox" aria-checked="${on}" tabindex="0" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();tglTarefa('${t.id}')}"`}
                style="${ev ? 'background:var(--acc);border-color:var(--acc);cursor:default' : ''}">✓</div>
              <div class="tx"><b style="font-size:12.5px;font-weight:${on ? 600 : 400}">${esc(t.t)}</b>
                ${ev ? `<span style="color:var(--acc)">registrado automaticamente${ev.txt ? ' ' + esc(ev.txt) : ''}</span>` : ''}</div>
            </div>`;
          }).join('')}
        </div></div>
    </div>
    <div>
      <div class="card"><div class="hd"><h3>Outras atividades</h3></div><div class="bd">
        <p style="margin:0 0 8px;font-size:12.5px;color:var(--txt-2)">Uma por linha. Entram no relatório exatamente como escritas.</p>
        <textarea id="relNotas" style="min-height:130px" placeholder="Apoio ao setor de recepção&#10;Separação de material para expansão">${esc((DB.diario[data] || {}).notas || '')}</textarea>
        <button class="btn a" style="margin-top:8px;width:100%" onclick="salvarNotas()">Salvar no relatório</button></div></div>
      <div class="card" style="margin-top:14px"><div class="hd"><h3>Equipamentos em processamento</h3></div>
        <div class="bd" style="padding:12px 16px">
          ${(() => { const c = porEtapa(), tot = equipEmAberto().length;
            return tot ? ETAPAS.map(e => c[e] ? `<div class="row" style="padding:3px 0;gap:8px">
              <span class="tag ${ETAPA_COR[e]}" style="width:104px;justify-content:center">${e}</span>
              <div class="bar" style="flex:1"><i style="width:${c[e] / DB.equip.length * 100}%"></i></div>
              <b class="mono" style="width:26px;text-align:right">${c[e]}</b></div>` : '').join('')
            + `<div style="font-size:12px;color:var(--txt-2);margin-top:8px">${tot} ainda não enviados.</div>`

<script>
/* =====================================================================
   CAMADA 16 — correções de integração
   1. padraoPorOS existia em duas chamadas mas nunca foi definida.
   2. o campo do técnico na OS chama "tecnico"; a camada nova usava "tec".
   ===================================================================== */

/* consumo médio por atendimento, a partir das posições de estoque e das OS do período */
function padraoPorOS() {
  const vazio = { porOS: {}, totOS: 0, totValor: 0, custoOS: 0, de: '', ate: '' };
  const ps = (typeof posicoes === 'function') ? posicoes() : [];
  if (ps.length < 2 || !DB.os.length) return vazio;
  const a = ps[0], b = ps[ps.length - 1];
  const c = consumoEntre(a.data, b.data);
  if (!c) return vazio;
  const n = DB.os.filter(o => o.data > c.de && o.data <= c.ate).length;
  if (!n) return vazio;
  const porOS = {}; let totValor = 0;
  Object.entries(c.itens).forEach(([k, q]) => { porOS[k] = q / n; totValor += q * precoDe(k); });
  return { porOS, totOS: n, totValor, custoOS: totValor / n, de: c.de, ate: c.ate };
}

/* o técnico pode vir em qualquer um dos dois campos */
const tecOS = o => (o && (o.tecnico || o.tec)) || '';
function ehTroca(o) { return RE_TROCA.test([o.tipo, o.assunto, o.desc, o.servico].filter(Boolean).join(' ')); }

/* A4 comporta 14 equipamentos por folha */
function porPagina(c) { return 14; }
function paginasDe(c) {
  const n = porPagina(c), p = [];
  for (let i = 0; i < c.itens.length; i += n) p.push(c.itens.slice(i, i + n));
  return p.length ? p : [[]];
}
/* o formato deixa de ser escolha */
function formatoA4(c) { if (c && c.formato !== 'a4') { c.formato = 'a4'; } return c; }
DB.caixas.forEach(formatoA4); save();

function etiquetaConteudo(c, itens, pag, tot, offset) {
  formatoA4(c);
  const modo = c.cod || 'mac';
  return `<div class="et et-cont a4">

<script>
/* ---------- tipos de caixa ---------- */
if (!TIPO_CAIXA.includes('RECUPERADOS')) TIPO_CAIXA.splice(1, 0, 'RECUPERADOS');
const ehSerie = c => c && (c.tipo === 'EQUIPAMENTOS' || c.tipo === 'RECUPERADOS');
const ehRecup = c => c && c.tipo === 'RECUPERADOS';
function porPagina(c) { return 25; }

/* modelo predominante da caixa, para o título dos recuperados */
function modeloDaCaixa(c) {
  if (c.modelo) return c.modelo;
  const cont = {};
  (c.itens || []).forEach(i => { const n = nomeItem(i); cont[n] = (cont[n] || 0) + 1; });
  const l = Object.entries(cont).sort((a, b) => b[1] - a[1]);
  return l.length ? l[0][0] : '';
}
function respDaCaixa(c) { return (c && c.responsavel) || DB.cfg.responsavel || ''; }
function blocoResp(c) {
  return `<div class="resp"><span class="r">Responsável pela caixa</span><b>${esc(respDaCaixa(c) || '—')}</b></div>`;
}

/* ---------- checklist editável ---------- */
const CHECK_PADRAO = ['Limpeza externa', 'Carcaça sem avaria', 'Reset de fábrica', 'Firmware atualizado',
  'Portas LAN testadas', 'Sinal óptico testado', 'Wi-Fi testado', 'Etiqueta legível'];
function checklist() {
  if (!Array.isArray(DB.checklist) || !DB.checklist.length) { DB.checklist = CHECK_PADRAO.slice(); save(); }
  return DB.checklist;
}
function editarChecklist() {
  modal('Checklist dos equipamentos recuperados', `
    <p style="margin-top:0;font-size:12.5px;color:var(--txt-2)">
      Cada item vira uma coluna na folha de conferência, com um quadrado por equipamento para você marcar à mão.
      Até 8 colunas cabem bem numa A4; acima disso as colunas ficam estreitas demais.</p>
    <div class="row" style="margin-bottom:12px"><input id="ckNovo" placeholder="Novo item de verificação" style="flex:1"
      onkeydown="if(event.key==='Enter')addCheck()"><button class="btn a" onclick="addCheck()">Adicionar</button></div>
    <div id="ckLista">${listaCheck()}</div>`,
    `<button class="btn" onclick="DB.checklist=(typeof CHECK_RECUP!=='undefined'?CHECK_RECUP:CHECK_PADRAO).slice();save();$('#ckLista').innerHTML=listaCheck()">Restaurar padrão</button>`, 620);
}
function listaCheck() {
  const l = checklist();
  return `<div style="border:1px solid var(--line);border-radius:var(--r)">
    ${l.map((c, i) => `<div class="row" style="padding:7px 12px;border-bottom:1px solid var(--line-2)">
      <span class="mono" style="color:var(--txt-3);width:20px">${i + 1}</span>
      <span style="flex:1">${esc(c)}</span>
      ${i > 7 ? '<span class="tag t-w">passa de 8</span>' : ''}
      <button class="btn xs dg" onclick="DB.checklist.splice(${i},1);save();$('#ckLista').innerHTML=listaCheck()">remover</button>
    </div>`).join('')}</div>
    <div style="font-size:12px;color:var(--txt-2);margin-top:8px">${l.length} colunas na folha</div>`;
}
function addCheck() {
  const v = $('#ckNovo').value.trim(); if (!v) return;
  checklist().push(v); save(); $('#ckNovo').value = ''; $('#ckLista').innerHTML = listaCheck(); $('#ckNovo').focus();
}

/* ---------- folha de checklist ---------- */
function folhaChecklist(c, itens, pag, tot, offset) {
  const ck = checklist();
  const l = itens || c.itens;
  return `<div class="et et-check">
    <div class="ch-h">
      <h1>Equipamentos recuperados</h1>
      <div class="mod">${esc(modeloDaCaixa(c) || 'MODELO NÃO INFORMADO')}</div>
      <div class="meta">
        <b>Remetente:</b> ${esc(DB.cfg.remetente)} &nbsp;·&nbsp;
        <b>Destino:</b> ${esc(c.destino)}<br>
        <b>Caixa fechada em:</b> ${br(dataFecho(c))}${c.fechadaHora ? ' às ' + c.fechadaHora : ''} &nbsp;·&nbsp;
        <b>Total:</b> ${totalPecas(c)} equipamentos${tot > 1 ? ` &nbsp;·&nbsp; <b>Folha</b> ${pag}/${tot}` : ''}
      </div>
    </div>
    ${blocoResp(c)}
    <table><thead><tr>
      <th class="num">#</th>
      <th style="width:auto">Equipamento</th>
      <th style="width:34mm">MAC / Serial</th>
      ${ck.map(x => `<th class="gira"><span>${esc(x)}</span></th>`).join('')}
    </tr></thead><tbody>
      ${l.length ? l.map((i, n) => `<tr>
        <td class="num">${String((offset || 0) + n + 1).padStart(2, '0')}</td>
        <td>${esc(nomeItem(i))}</td>
        <td class="mono">${esc(i.mac || i.serial || '—')}</td>
        ${ck.map(() => '<td class="bx"></td>').join('')}
      </tr>`).join('')
      : `<tr><td colspan="${3 + ck.length}" style="text-align:center;padding:8mm;color:#666">Caixa sem equipamentos.</td></tr>`}
    </tbody></table>
    <div class="leg">
      Marque cada quadrado conforme a verificação for concluída. Equipamento com qualquer item em branco
      não deve seguir para a matriz.
    </div>
    <div class="rod">
      <div class="ass">Recuperado e conferido por — ${esc(respDaCaixa(c))}</div>
      <div class="ass">Conferido no recebimento</div>
    </div>
  </div>`;
}
function paginasChecklist(c) {
  const pgs = paginasDe(c), tot = pgs.length;
  let off = 0;
  return pgs.map((itens, i) => { const h = folhaChecklist(c, itens, i + 1, tot, off); off += itens.length; return h; }).join('');
}

/* ---------- capa com título de recuperados e responsável ---------- */
function etiquetaCapa(c, seq, de) {
  const rec = ehRecup(c), serie = ehSerie(c);
  return `<div class="et et-capa">
    <div class="arco">${ARCO6.map(x => `<i style="background:${x}"></i>`).join('')}</div>
    <div class="rot">Destinatário</div>
    <div class="para">${esc(c.destino)}</div>
    <div class="tipo">${rec ? 'EQUIPAMENTOS RECUPERADOS' : esc(c.tipo)}</div>
    ${rec ? `<div style="font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:26pt;
      text-transform:uppercase;letter-spacing:-.02em;line-height:1.05;margin:-6mm 0 9mm">${esc(modeloDaCaixa(c) || '—')}</div>` : ''}
    <div class="remet"><div class="r">Remetente</div><b>${esc(DB.cfg.remetente)}</b></div>
    <div class="meta">
      <div style="flex:1.6">${c.fechadaEm ? 'Caixa fechada em' : 'Aberta em'}<b>${br(dataFecho(c))}</b></div>
      <div>Volume<b>${seq || 1}/${de || 1}</b></div>
    </div>
    <div class="qtd">
      <b>${totalPecas(c)}</b>
      <span>${serie ? 'equipamentos na caixa' : 'peças na caixa'}</span>
    </div>
    ${blocoResp(c)}
    ${c.obs ? `<div class="obs"><b>Atenção:</b> ${esc(c.obs)}</div>` : ''}
    <div class="de">
      ${DB.cfg.unidade ? '<b>Unidade:</b> ' + esc(DB.cfg.unidade) + '<br>' : ''}
      <b>Conferência:</b> ${rec ? 'folha de conteúdo e checklist de recuperação' : 'folha de conteúdo'} colada ao lado desta etiqueta.
    </div>
  </div>`;
}

/* ---------- conteúdo com responsável ---------- */
function etiquetaConteudo(c, itens, pag, tot, offset) {
  formatoA4(c);
  const modo = c.cod || 'mac';
  return `<div class="et et-cont a4">
    <div class="rem">
      <div><span>Remetente</span><b>${esc(DB.cfg.remetente)}</b></div>
      <div class="dt">Caixa fechada em<br><b>${br(dataFecho(c))}${c.fechadaHora ? ' · ' + c.fechadaHora : ''}</b></div>
    </div>
    <div class="ch">
      <h2>Conteúdo da caixa${ehRecup(c) ? ' · recuperados' : ''}</h2>
      ${tot > 1 ? `<div class="p">página ${pag}/${tot}</div>` : ''}
    </div>
    ${blocoResp(c)}
    <div class="linhas">
      ${itens.length ? itens.map((i, n) => {
        const cod = codigoItem(i, modo);
        return `<div class="li">
          <div class="n">${String((offset || 0) + n + 1).padStart(2, '0')}</div>
          <div class="tx">
            <b>${esc(nomeItem(i))}</b>
            <div class="mac">${esc(rotuloItem(i))}${i.serial && i.mac ? ` <span style="font-size:7.5pt;color:#555">· ${esc(i.serial)}</span>` : ''}${i.qtd > 1 ? ` <span style="font-size:7.5pt;color:#555">· ${i.qtd} un</span>` : ''}</div>
          </div>
          <div class="cb">${cod ? barras(cod, 6) : '<div style="font-size:8pt;color:#999;text-align:center">sem código</div>'}</div>
        </div>`;
      }).join('') : '<div style="font-size:11pt;color:#666;padding:10mm 0">Caixa sem itens.</div>'}
    </div>
    <div class="rod">
      <div class="cx">${esc(DB.cfg.remetente)}<br>para ${esc(c.destino)}<br>${br(dataFecho(c))}</div>
      <div class="tt"><b>${totalPecas(c)}</b><span>${ehSerie(c) ? 'equipamentos' : 'peças'} no total</span></div>
    </div>
  </div>`;
}

/* ---------- lista de conferência com responsável ---------- */
function listaConferencia(c) {
  const serie = ehSerie(c);
  return `<div class="et et-lista">
    <h1>Lista de conferência${ehRecup(c) ? ' · recuperados' : ''}</h1>
    <div class="sub"><b>De:</b> ${esc(DB.cfg.remetente)} &nbsp;·&nbsp; <b>Para:</b> ${esc(c.destino)}
      &nbsp;·&nbsp; <b>Responsável:</b> ${esc(respDaCaixa(c))}
      &nbsp;·&nbsp; <b>Fechada em:</b> ${br(dataFecho(c))}${c.fechadaHora ? ' às ' + c.fechadaHora : ''}
      &nbsp;·&nbsp; ${c.itens.length} itens / ${totalPecas(c)} peças</div>
    ${ehRecup(c) ? `<p style="font-size:10pt;margin:0 0 4mm"><b>Modelo:</b> ${esc(modeloDaCaixa(c))}</p>` : ''}
    <table><thead><tr><th style="width:8mm">#</th>
      ${serie ? '<th>Equipamento (nome no sistema)</th><th style="width:32mm">Serial</th><th style="width:36mm">MAC</th><th style="width:12mm">OK</th>'
              : '<th>Item</th><th style="width:30mm">Especificação</th><th style="width:18mm">Quantidade</th><th style="width:12mm">OK</th>'}
    </tr></thead><tbody>
    ${c.itens.map((i, n) => serie ? `<tr><td>${n + 1}</td>
        <td>${esc(nomeItem(i))}</td><td style="font-family:monospace">${esc(i.serial || '—')}</td>
        <td style="font-family:monospace">${esc(i.mac || '—')}</td><td></td></tr>`
      : `<tr><td>${n + 1}</td><td>${esc(i.modelo || i.desc || '')}</td>
        <td>${i.volts ? esc(i.volts) + 'V / ' + esc(i.amps) + 'A' : esc(i.cod || '—')}</td>
        <td>${i.qtd || 1}</td><td></td></tr>`).join('')}
    </tbody></table>
    ${c.obs ? `<p style="font-size:8pt;margin-top:4mm"><b>Observação:</b> ${esc(c.obs)}</p>` : ''}
    <div class="ass"><div>Separado por — ${esc(respDaCaixa(c))} · ${esc(DB.cfg.remetente)}</div><div>Conferido no recebimento</div></div>
  </div>`;
}

/* ---------- impressão ---------- */
function imprimirCaixa(id) {
  const c = caixaDe(id); if (!c) return;
  imprimir(etiquetaCapa(c, 1, 1) + paginasConteudo(c) + (ehRecup(c) ? paginasChecklist(c) : ''));
}
function imprimirChecklist(id) {
  const c = caixaDe(id); if (!c) return;
  if (!c.itens.length) return toast('A caixa está vazia.', 'e');
  imprimir(paginasChecklist(c));
}
function folhasDaCaixa(c) { return 1 + paginasDe(c).length + (ehRecup(c) ? paginasDe(c).length : 0); }

<script>

function novaCaixa(tipo) {
  const num = 'CX' + hoje().replace(/-/g, '').slice(2) + '-' + String(DB.caixas.filter(c => c.data === hoje()).length + 1).padStart(2, '0');
  const c = { id: uid(), num, tipo: tipo || 'EQUIPAMENTOS', data: hoje(), destino: DB.cfg.matriz,
    status: 'ABERTA', itens: [], obs: '', nf: '', formato: 'a4', cod: 'mac',
    responsavel: DB.cfg.responsavel || '', modelo: '' };
  DB.caixas.unshift(c); save(); render();
  editarCaixa(c.id);
}
function setResp(id, v) { const c = caixaDe(id); if (!c) return; c.responsavel = v.toUpperCase(); save(); }
function setModelo(id, v) { const c = caixaDe(id); if (!c) return; c.modelo = v.toUpperCase(); save(); editarCaixa(id); }

/* o editor anterior foi guardado no bloco acima, antes desta redeclaração */
function editarCaixa(id) {
  window.__editarBase(id);
  const c = caixaDe(id); if (!c) return;
  const box = document.querySelector('.modal .box'); if (!box) return;
  const bd = box.querySelector('.bd'), ft = box.querySelector('.ft');
  const rec = ehRecup(c), prods = produtosDirect();

  /* linha com responsável e, nos recuperados, o modelo */
  const linha = document.createElement('div');
  linha.className = 'row';
  linha.style.margin = '0 0 14px';
  linha.innerHTML = `
    <div class="f" style="max-width:260px"><label class="fl">Responsável pela caixa</label>
      <input id="cxResp" value="${esc(respDaCaixa(c))}" placeholder="quem montou esta caixa"
        oninput="this.value=this.value.toUpperCase()" onchange="setResp('${id}',this.value);editarCaixa('${id}')"></div>
    ${rec ? `<div class="f" style="max-width:340px"><label class="fl">Modelo recuperado (sai no título)</label>
      <input id="cxModelo" list="listaDirect2" value="${esc(c.modelo || '')}" placeholder="${esc(modeloDaCaixa(c) || 'escolha o modelo')}"
        onchange="setModelo('${id}',this.value)">
      <datalist id="listaDirect2">${prods.map(p => `<option value="${esc(p.desc)}">`).join('')}</datalist></div>` : ''}
    <div class="f" style="align-self:flex-end">
      <span class="tag t-a">A4 · ${folhasDaCaixa(c)} folhas ao todo</span>
      <span class="tag t-n">25 equipamentos por folha</span>
      ${rec ? `<span class="tag t-i">inclui checklist</span>` : ''}
    </div>`;
  bd.insertBefore(linha, bd.firstChild);

  /* botão do checklist e prévia, só nos recuperados */
  if (rec && ft) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = 'Checklist';
    b.onclick = () => imprimirChecklist(id);
    ft.insertBefore(b, ft.firstChild);
    const grid = bd.querySelector('.grid.g2');
    if (grid) {
      const col = document.createElement('div');
      col.style.gridColumn = '1 / -1';
      col.innerHTML = `<div class="fl" style="margin:12px 0 8px">Papel 3 — checklist de recuperação (A4)
        <button class="btn xs" style="margin-left:8px" onclick="editarChecklist()">editar itens</button></div>
        ${previa(folhaChecklist(c, paginasDe(c)[0], 1, paginasDe(c).length, 0), .34)}`;
      grid.appendChild(col);
    }
  }
}
Object.assign(VFN, {});
render();
</script>

<style>

   CAMADA 20 — checklist de recuperação e etiqueta de fonte enxuta
   ===================================================================== */

  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box}

  text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.et-fonte .resp{font-size:6.8pt;color:#333;margin-top:1.4mm;line-height:1.3;letter-spacing:.02em}

</style>
<script>
/* ---------- os cinco itens de verificação ---------- */
/* CHECK_PADRAO já existe como const no bloco anterior: aqui vai outro nome */
const CHECK_ANTIGO = ['Limpeza externa', 'Carcaça sem avaria', 'Reset de fábrica', 'Firmware atualizado',
  'Portas LAN testadas', 'Sinal óptico testado', 'Wi-Fi testado', 'Etiqueta legível'];
const CHECK_RECUP = ['Todos os LED acendem?', 'Conecta 2.4G?', 'Conecta 5G?', 'Teste em PON?', 'Atualização de firmware?'];
/* quem já estava com a lista antiga recebe a nova */
if (!Array.isArray(DB.checklist) || !DB.checklist.length || DB.checklist.join('|') === CHECK_ANTIGO.join('|')) {
  DB.checklist = CHECK_RECUP.slice(); save();
}
function checklist() {
  if (!Array.isArray(DB.checklist) || !DB.checklist.length) { DB.checklist = CHECK_RECUP.slice(); save(); }
  return DB.checklist;
}
/* o checklist tem cabeçalho e assinaturas maiores: 18 linhas por folha */
function porPaginaCheck() { return 18; }
function paginasCheck(c) {
  const n = porPaginaCheck(), p = [];
  for (let i = 0; i < c.itens.length; i += n) p.push(c.itens.slice(i, i + n));
  return p.length ? p : [[]];
}
function paginasChecklist(c) {
  const pgs = paginasCheck(c), tot = pgs.length;
  let off = 0;
  return pgs.map((itens, i) => { const h = folhaChecklist(c, itens, i + 1, tot, off); off += itens.length; return h; }).join('');
}
function folhasDaCaixa(c) { return 1 + paginasDe(c).length + (ehRecup(c) ? paginasCheck(c).length : 0); }

function folhaChecklist(c, itens, pag, tot, offset) {
  const ck = checklist();
  const l = itens || c.itens;
  return `<div class="et et-check">
    <div class="ch-h">
      <h1>Equipamentos recuperados</h1>
      <div class="mod">${esc(modeloDaCaixa(c) || 'MODELO NÃO INFORMADO')}</div>
      <div class="meta">
        <b>Remetente:</b> ${esc(DB.cfg.remetente)} &nbsp;·&nbsp;
        <b>Destino:</b> ${esc(c.destino)}<br>
        <b>Caixa fechada em:</b> ${br(dataFecho(c))}${c.fechadaHora ? ' às ' + c.fechadaHora : ''} &nbsp;·&nbsp;
        <b>Total:</b> ${totalPecas(c)} equipamentos${tot > 1 ? ` &nbsp;·&nbsp; <b>Folha</b> ${pag}/${tot}` : ''}
      </div>
    </div>
    ${blocoResp(c)}
    <table><thead><tr>
      <th class="num">#</th>
      <th style="width:auto">Equipamento</th>
      <th style="width:34mm">MAC / Serial</th>
      ${ck.map(x => `<th class="gira"><span>${esc(x)}</span></th>`).join('')}
    </tr></thead><tbody>
      ${l.length ? l.map((i, n) => `<tr>
        <td class="num">${String((offset || 0) + n + 1).padStart(2, '0')}</td>
        <td>${esc(nomeItem(i))}</td>
        <td class="mono">${esc(i.mac || i.serial || '—')}</td>
        ${ck.map(() => '<td class="bx"><i></i></td>').join('')}
      </tr>`).join('')
      : `<tr><td colspan="${3 + ck.length}" style="text-align:center;padding:8mm;color:#666">Caixa sem equipamentos.</td></tr>`}
    </tbody></table>
    <div class="aviso">
      <b>Equipamento só segue para a matriz com os ${ck.length} quadrados marcados.</b>
      Qualquer item em branco significa recuperação incompleta — separe o aparelho e refaça o teste.
    </div>
    <div class="rod">
      <div class="ass">Recuperado e conferido por — ${esc(respDaCaixa(c))}</div>
      <div class="ass">Conferido no recebimento</div>
    </div>
  </div>`;
}

/* ---------- etiqueta de fonte: especificação, origem e responsável ---------- */
function etiquetaFonte(f, c) {
  const resp = (c && respDaCaixa(c)) || DB.cfg.responsavel || '';
  return `<div class="et-fonte">
    <div class="v">${esc(f.volts)}V <em>${esc(f.amps)}A</em></div>
    <div class="rule"></div>
    <div class="org">${esc(DB.cfg.remetente || 'ESTOQUE PINHAIS')}</div>
    ${resp ? `<div class="resp">Separação e higienização<b>${esc(resp)}</b></div>` : ''}
  </div>`;
}
function imprimirFontes(id) {
  const c = caixaDe(id); if (!c) return;
  const et = [];
  c.itens.forEach(f => { for (let i = 0; i < (f.qtd || 1); i++) et.push(etiquetaFonte(f, c)); });
  if (!et.length) return toast('Nenhuma fonte na caixa.', 'e');
  imprimir(`<div class="folha-fontes">${et.join('')}</div>`);
}
render();
</script>
